骤） */\n.startx,.secx,.endx{padding:0}\n.startx h2{margin:0;font-size:18px;line-height:34px}\n.startx p{margin:2px 0 0}\n.secx h2{margin:0;font-size:19px;line-height:34px}\n.endx p{margin:0;line-height:34px}\n.lane{margin-bottom:22px}\n.cardx{margin-top:0}\n.cx-h{padding:8px 24px 0}\n.cx-h h3{margin:0;font-size:16.5px;line-height:26px}\n.lane.sub .node,.lane.sub .node.step-node{margin-top:6px}\n.lane.sub .tick{margin-top:21px;height:1px;background:hsl(var(--primary) / .35)}\n/* 卡片内部：一套线条规则 */\n.ins2{padding:10px 24px 8px 46px}\n.ins2::before{left:29.5px;top:20px;bottom:20px;width:1px;background:hsl(var(--border))}\n.ix{padding:0 0 14px}\n.ix::before{left:-20px;top:9px;width:8px;height:8px;border-radius:50%;background:hsl(var(--muted-foreground) / .45);box-shadow:0 0 0 3px hsl(var(--card))}\n.ix.t-decide::before{background:hsl(var(--decide));box-shadow:0 0 0 3px hsl(var(--card))}\n.ix.t-ask::before{background:hsl(var(--warning));box-shadow:0 0 0 3px hsl(var(--card))}\n.ix.t-flow::before{background:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--card))}\n.ix.t-rule::before{background:hsl(var(--warning));box-shadow:0 0 0 3px hsl(var(--card))}\n/* 指令句：标签与第一行正文居中对齐 */\n.ix-p{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:14.5px;line-height:26px}\n.ix-p .kind{margin:2px 0 0;height:22px;flex:none}\n.nextline{margin:0;font-size:14px;line-height:26px}\n/* 分支列表：1px 连接线，统一缩进 */\n.bl{margin:6px 0 0;padding:0}\n.bl .bl{margin:2px 0 0 16px}\n.bl li{padding:2px 0 2px 18px;font-size:14px;line-height:26px}\n.bl li::before{border-left:1px solid hsl(var(--border))}\n.bl li:last-child::before{height:15px}\n.bl li::after{top:15px;width:10px;border-top:1px solid hsl(var(--border))}\n/* 行内标记统一高度和垂直位置 */\n.kw,.fc,.resx{display:inline-flex;align-items:center;vertical-align:top;margin-top:3px;line-height:1}\n.kw{height:20px;padding:0 6px;font-size:12px}\n.fc{height:20px;padding:0 7px;font-size:12.5px;gap:3px}\n.resx{height:20px;padding:0 7px;font-size:12px}\ncode{vertical-align:1px}\n.chk2{margin:8px 0 0}\n.rule-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:26px}\n.rule-row .kind{margin-top:2px;height:22px;flex:none}\n.rule-row ul{margin:0;padding-left:16px}\n\n/* ===== 第 6 版：类型配色与分支隶属 ===== */\n:root{--ask:186 72% 32%;--ask-bg:186 70% 94%}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--ask:186 70% 58%;--ask-bg:186 40% 14%}}\n:root[data-theme=\"dark\"]{--ask:186 70% 58%;--ask-bg:186 40% 14%}\n.k-do{background:hsl(var(--muted));color:hsl(var(--muted-foreground))}\n.k-decide{background:hsl(var(--decide-bg));color:hsl(var(--decide))}\n.k-ask{background:hsl(var(--ask-bg));color:hsl(var(--ask))}\n.k-flow{background:hsl(var(--primary-soft));color:hsl(var(--primary))}\n.ix.t-ask::before{background:hsl(var(--ask))}\n/* 分支：连接线从类型标签正下方伸出，颜色跟随父指令 */\n.ix > .bl{margin:4px 0 0 26px}\n.bl .bl{margin:2px 0 0 14px}\n.bl li{padding-left:22px}\n.bl li::after{width:14px}\n.bl-decide > li::before,.bl-decide > li::after{border-color:hsl(var(--decide) / .35)}\n.bl-ask > li::before,.bl-ask > li::after{border-color:hsl(var(--ask) / .4)}\n.kw-decide{background:hsl(var(--decide-bg));color:hsl(var(--decide))}\n.kw-ask{background:hsl(var(--ask-bg));color:hsl(var(--ask))}\n.rule-row ul:has(> li:only-child){list-style:none;padding-left:0}\n\n/* ===== 第 7 版：执行配色、文件树、流程图视图 ===== */\n:root{--do:212 85% 42%;--do-bg:212 95% 95%;--do-dot:212 80% 55%}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--do:212 92% 70%;--do-bg:212 50% 16%;--do-dot:212 85% 62%}}\n:root[data-theme=\"dark\"]{--do:212 92% 70%;--do-bg:212 50% 16%;--do-dot:212 85% 62%}\n.k-do{background:hsl(var(--do-bg));color:hsl(var(--do))}\n.ix.t-do::before{background:hsl(var(--do-dot))}\n/* 左侧文件树 */\n.ftree,.ftree ul{list-style:none;margin:0;padding:0}\n.ftree ul{padding-left:15px}\n.ftree ul li{position:relative;padding-left:14px}\n.ftree ul li::before{content:\"\";position:absolute;left:0;top:0;bottom:0;border-left:1px solid hsl(var(--border))}\n.ftree ul li:last-child::before{bottom:auto;height:15px}\n.ftree ul li::after{content:\"\";position:absolute;left:0;top:15px;width:10px;border-top:1px solid hsl(var(--border))}\n.fn{display:flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap;color:hsl(var(--foreground))}\n.fn:hover{background:hsl(var(--accent))}\n.fn .ic{color:hsl(var(--muted-foreground))}\n.fn.dir{cursor:default;font-weight:500}\n.fn.dir:hover{background:none}\n\n\n\n/* 左侧步骤目录：编号列等宽，子步骤编号与上级标题左对齐 */\n.side .item{gap:8px;height:30px}\n.side .item .k{min-width:0;flex:none;font-variant-numeric:tabular-nums;text-align:left}\n.side .item:not(.l2){margin-top:6px;padding-left:8px}\n.side .item:not(.l2) .k{width:14px;color:hsl(var(--foreground));font-weight:600}\n.side .item:not(.l2) .t{font-weight:600}\n.side .item.l2{padding-left:30px}\n.side .item.l2 .k{width:22px}\n.side .item.l2 .t{color:hsl(var(--foreground) / .85)}\n.side .item.on .k,.side .item.on .t{color:hsl(var(--primary))}\n\n/* 资源面板：渲染后的文件内容 + 用到它的步骤 */\n.sheet.wide{width:min(780px,100%)}\n.res-used{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 24px 16px;border-bottom:1px solid hsl(var(--border))}\n.res-used .lbl{font-size:12.5px;color:hsl(var(--muted-foreground));margin-right:2px}\n.stepchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500;background:hsl(var(--primary-soft));color:hsl(var(--primary));cursor:pointer}\n.stepchip:hover{filter:brightness(.96)}\n.stepchip .ic{width:13px;height:13px}\n.res-miss{color:hsl(var(--muted-foreground))}\n.md{padding-top:6px;font-size:14px;line-height:1.8;color:hsl(var(--foreground))}\n.md h1{margin:18px 0 10px;font-size:20px;font-weight:700}\n.md h2{margin:24px 0 10px;padding-bottom:6px;font-size:16.5px;font-weight:650;border-bottom:1px solid hsl(var(--border))}\n.md h3{margin:18px 0 8px;font-size:15px;font-weight:600}\n.md p{margin:8px 0}\n.md ul,.md ol{margin:6px 0;padding-left:22px}\n.md li{margin:3px 0}\n.md code{padding:1px 5px;border-radius:4px;font-size:12.5px;background:hsl(var(--muted))}\n.md pre{margin:10px 0;padding:12px 14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.6;background:hsl(var(--muted))}\n.md pre code{padding:0;background:none}\n.md table{width:100%;margin:10px 0;border-collapse:collapse;font-size:13px}\n.md th,.md td{padding:7px 10px;border:1px solid hsl(var(--border));text-align:left;vertical-align:top}\n.md th{background:hsl(var(--muted));font-weight:600}\n.md input[type=checkbox]{margin:0 6px 0 0;vertical-align:-2px}\n.md strong{font-weight:650}\n\n/* 原文与脚本信息 */\n.src{margin:16px 0 0;padding:14px 16px;border-radius:10px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65;white-space:pre;background:hsl(var(--muted));color:hsl(var(--foreground))}\n.sc{margin-top:16px;border:1px solid hsl(var(--border));border-radius:12px;overflow:hidden}\n.sc-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid hsl(var(--border))}\n.sc-row:first-child{border-top:0}\n.sc-k{font-size:13px;font-weight:600;color:hsl(var(--muted-foreground));line-height:24px}\n.sc-v{font-size:14px;line-height:24px}\n.sc-flow{list-style:none;margin:0;padding:0;counter-reset:sc}\n.sc-flow li{position:relative;counter-increment:sc;padding:0 0 14px 34px;font-size:14px;line-height:24px}\n.sc-flow li::before{content:counter(sc);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:hsl(var(--do-bg));color:hsl(var(--do))}\n.sc-flow li::after{content:\"\";position:absolute;left:11.5px;top:26px;bottom:2px;width:1px;background:hsl(var(--do) / .3)}\n.sc-flow li:last-child{padding-bottom:0}\n.sc-flow li:last-child::after{display:none}\n.src-d{margin-top:16px}\n.src-d summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;color:hsl(var(--muted-foreground))}\n.src-d .src{margin-top:10px}\n\u003c/style>\n\u003cheader class=\"topbar\">\n  \u003cdiv class=\"logo\">\u003ci data-lucide=\"workflow\" class=\"ic\">\u003c/i>\u003c/div>\n  \u003cdiv class=\"title\">\u003cb id=\"skillName\">\u003c/b>\u003cspan id=\"skillDesc\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"tabs\">\u003cbutton class=\"tab on\" data-view=\"flow\">工作流\u003c/button>\u003cbutton class=\"tab\" data-view=\"text\">文字版\u003c/button>\u003c/div>\n  \u003cdiv class=\"grow\">\u003c/div>\n  \u003cspan class=\"vstat\" id=\"vstat\">\u003c/span>\n  \u003cspan class=\"sep\">\u003c/span>\n  \u003cbutton class=\"btn icon ghost\" id=\"themeBtn\" title=\"切换明暗\">\u003c/button>\n\u003c/header>\n\u003cdiv class=\"shell\" id=\"shell\">\n  \u003caside class=\"side\" id=\"side\">\u003c/aside>\n  \u003cmain class=\"main\">\u003cdiv class=\"content\">\n    \u003cul class=\"issues2\" id=\"issues\" style=\"display:none;margin:0 0 16px;padding:10px 14px 10px 32px;border-radius:10px;background:hsl(var(--danger-bg));color:hsl(var(--danger));font-size:13px\">\u003c/ul>\n    \u003csection class=\"view on\" id=\"v-flow\">\u003cdiv class=\"flow\" id=\"steps\">\u003c/div>\u003c/section>\n    \u003csection class=\"view\" id=\"v-text\">\u003cdiv class=\"card\">\u003cpre class=\"text\" id=\"wf\">\u003c/pre>\u003c/div>\u003c/section>\n  \u003c/div>\u003c/main>\n\u003c/div>\n\u003cdiv class=\"overlay\" id=\"overlay\">\u003c/div>\n\u003caside class=\"sheet\" id=\"sheet\">\u003c/aside>\n\u003cscript>\n/* FLOW_DATA_START —— 生成 skill-workflow.html 时，只替换这两行标记之间的内容 */\nconst FLOW = {\n  name: 'example-skill',\n  description: '当……时使用。例如“……”、“……”等。',\n  summary: '一段话说明这个 skill 做什么、交付什么。',\n  globalRules: [],\n  resources: [],\n  steps: [\n    { id: '1', title: '弄清用户要什么', body: [\n      { type: 'do', text: '读取用户提供的材料，整理出要完成的任务' },\n    ], next: { type: 'goto', to: '2' } },\n    { id: '2', title: '交付结果', body: [\n      { type: 'ask', text: '把结果交给用户确认，并给出你的建议。等待回复', branches: [\n        { when: '用户确认', then: [{ type: 'end', text: '结束本次任务，交付结果' }] },\n        { when: '用户提出修改', then: [{ type: 'do', text: '按意见修改' }, { type: 'retry', text: '再请用户确认' }] },\n      ] },\n    ] },\n  ],\n};\n/* FLOW_DATA_END */\n/* RES_CONTENT_START —— 由 scripts/embed-resources.py 写入引用文件的内容，不要手动修改 */\nconst RES_CONTENT = {};\n/* RES_CONTENT_END */\n\u003c/script>\n\u003cscript>\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"]/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst ic = (n, c = '') => `\u003ci data-lucide=\"${n}\" class=\"ic ${c}\">\u003c/i>`;\nconst icons = () => window.lucide && lucide.createIcons();\nconst FLOWS = ['goto', 'retry', 'end'];\nconst RES = FLOW.resources || [];\nconst resIcon = p => p.startsWith('scripts') ? 'file-code' : p.startsWith('assets') ? 'package' : 'file-text';\nconst fmt = s => esc(s).replace(/`([^`]+)`/g, (m, p) => RES.some(r => r.path === p)\n  ? `\u003cspan class=\"resx\" data-res=\"${esc(p)}\">${ic(resIcon(p), 'xs')}${esc(p)}\u003c/span>` : `\u003ccode>${p}\u003c/code>`);\n\nconst ALL = {}, ORDER = [];\n(function index(list, depth, parent){ list.forEach(s => { s.depth = depth; s.parent = parent; ALL[s.id] = s; ORDER.push(s.id); if (s.children) index(s.children, depth + 1, s.id); }); })(FLOW.steps, 1, null);\nconst LEAVES = ORDER.filter(id => !ALL[id].children);\nconst pos = id => ORDER.indexOf(id);\nconst isBack = (from, to) => pos(to) \u003c= pos(from);\nfunction walk(nodes, fn, sid){ (nodes || []).forEach(n => { fn(n, sid); (n.branches || []).forEach(b => walk(b.then, fn, sid)); }); }\nfunction eachNode(fn){ LEAVES.forEach(id => { walk(ALL[id].body, fn, id); if (ALL[id].next) fn(ALL[id].next, id); }); }\nconst pathsIn = t => (String(t || '').match(/`([^`]+)`/g) || []).map(x => x.slice(1, -1)).filter(x => /^(references|scripts|assets)\\//.test(x));\nconst INCOMING = {};\neachNode((n, sid) => { if (n.type === 'goto' && ALL[n.to]) { const a = INCOMING[n.to] = INCOMING[n.to] || []; if (!a.some(x => x[0] === sid)) a.push([sid, isBack(sid, n.to)]); } });\n\n/* ---- 校验（与模板一致） ---- */\nfunction terminates(b){ return (b.then || []).some(x => FLOWS.includes(x.type) || (x.type === 'ask' && x.branches && x.branches.every(terminates))); }\nfunction validate(){\n  const iss = [];\n  ORDER.forEach(id => { const s = ALL[id];\n    if (s.depth > 3) iss.push(`步骤 ${id} 超过三层`);\n    if (s.children && s.body) iss.push(`步骤 ${id} 同时包含指令和子步骤`);\n    if (!s.body) return;\n    s.body.forEach((n, i) => { if ((n.type === 'decide' || n.type === 'ask') && !(n.branches || []).length) iss.push(`步骤 ${id} 的第 ${i + 1} 条指令没有分支`); });\n    if (!s.next){ const last = s.body[s.body.length - 1]; if (!last || !last.branches || !last.branches.every(terminates)) iss.push(`步骤 ${id} 没有写完成后的去向`); } });\n  eachNode((n, sid) => { if (n.type === 'goto' && (!ALL[n.to] || ALL[n.to].children)) iss.push(`步骤 ${sid} 的跳转目标 ${n.to} 无效`);\n    [n.text, n.when].forEach(t => pathsIn(t).forEach(p => { if (!RES.some(r => r.path === p)) iss.push(`步骤 ${sid} 引用了未登记的资源 ${p}`); })); });\n  const seen = new Set(), st = [LEAVES[0]];\n  while (st.length){ const id = st.pop(); if (!id || seen.has(id) || !ALL[id]) continue; seen.add(id); walk(ALL[id].body, n => { if (n.type === 'goto') st.push(n.to); }); const nx = ALL[id].next; if (nx && nx.type === 'goto') st.push(nx.to); }\n  LEAVES.filter(id => !seen.has(id)).forEach(id => iss.push(`步骤 ${id} 从开始走不到`));\n  const el = $('#vstat');\n  el.innerHTML = iss.length ? `${ic('circle-alert', 'sm')}${iss.length} 个问题` : `${ic('circle-check', 'sm')}结构校验通过`;\n  el.classList.toggle('bad', !!iss.length);\n  $('#issues').innerHTML = iss.map(x => `\u003cli>${esc(x)}\u003c/li>`).join(''); $('#issues').style.display = iss.length ? 'block' : 'none';\n}\n\n/* ---- 元素标签 ---- */\nconst KIND = {do:['play', '执行', 'k-do'], check:['play', '执行', 'k-do'], decide:['git-branch', '判断', 'k-decide'], ask:['message-circle', '提问', 'k-ask']};\nconst kindTag = t => { const [i, l, c] = KIND[t] || KIND.do; return `\u003cspan class=\"kind ${c}\">${ic(i, 'xs')}${l}\u003c/span>`; };\n\n/* ---- 文案与文字版用同一套逻辑生成，只多了样式 ---- */\nfunction flowHTML(sid, f){\n  if (f.type === 'goto'){ const b = isBack(sid, f.to);\n    return `\u003cspan class=\"fc ${b ? 'back' : 'fwd'}\" data-go=\"${esc(f.to)}\">${ic(b ? 'undo-2' : 'arrow-right')}${b ? '回到' : '进入'}步骤 ${esc(f.to)}\u003c/span>${f.text ? '，' + fmt(f.text) : ''}`; }\n  if (f.type === 'retry') return `\u003cspan class=\"fc retry\">${ic('refresh-cw')}然后${fmt(f.text)}\u003c/span>`;\n  return `\u003cspan class=\"fc end\">${ic('flag')}${fmt(f.text)}\u003c/span>`;\n}\nfunction branchList(sid, branches, kind){\n  return `\u003cul class=\"bl bl-${kind}\">${branches.map(b => {\n    const parts = []; let nested = '';\n    (b.then || []).forEach(x => {\n      if (x.type === 'ask' && x.branches){ parts.push(fmt(x.text)); nested = branchList(sid, x.branches, 'ask'); }\n      else if (FLOWS.includes(x.type)) parts.push(flowHTML(sid, x));\n      else parts.push(fmt(x.text));\n    });\n    return `\u003cli>\u003cspan class=\"kw kw-${kind}\">如果\u003c/span>\u003cspan class=\"cond\">${fmt(b.when)}\u003c/span>，${parts.join('，')}${nested ? '：' + nested : '。'}\u003c/li>`;\n  }).join('')}\u003c/ul>`;\n}\nfunction insHTML(s, n){\n  const tail = n.branches || n.type === 'check' ? '：' : '。';\n  return `\u003cdiv class=\"ix t-${n.type === 'check' ? 'do' : n.type}\">\u003cp class=\"ix-p\">${kindTag(n.type)}\u003cspan>${fmt(n.text)}${tail}\u003c/span>\u003c/p>\n    ${n.type === 'check' ? `\u003cul class=\"chk2\">${n.items.map(x => `\u003cli>${ic('square', 'sm')}\u003cspan>${fmt(x)}\u003c/span>\u003c/li>`).join('')}\u003c/ul>` : ''}\n    ${n.branches ? branchList(s.id, n.branches, n.type) : ''}\u003c/div>`;\n}\nfunction leafHTML(s){\n  const rules = (s.rules || []).length ? `\u003cdiv class=\"ix t-rule\">\u003cdiv class=\"rule-row\">\u003cspan class=\"kind k-rule\">${ic('shield-alert', 'xs')}约束\u003c/span>\u003cul>${s.rules.map(r => `\u003cli>${fmt(r)}\u003c/li>`).join('')}\u003c/ul>\u003c/div>\u003c/div>` : '';\n  const nx = s.next ? `\u003cdiv class=\"ix t-flow\">\u003cp class=\"ix-p\">\u003cspan class=\"kind k-flow\">${ic('corner-down-right', 'xs')}流程\u003c/span>\u003cspan>${s.next.type === 'goto' ? '完成后' : ''}${flowHTML(s.id, s.next)}。\u003c/span>\u003c/p>\u003c/div>` : '';\n  return `\u003csection class=\"cardx\" id=\"s-${esc(s.id)}\">\u003cdiv class=\"cx-h\">\u003ch3>${esc(s.title)}\u003c/h3>\u003c/div>\n    \u003cdiv class=\"ins2\">${s.body.map(n => insHTML(s, n)).join('')}${nx}${rules}\u003c/div>\u003c/section>`;\n}\nfunction stepHTML(s){\n  const sub = s.depth > 1;\n  const node = `\u003cdiv>\u003cdiv class=\"node step-node\" data-go=\"${esc(s.id)}\">\u003cspan class=\"nw\">步骤\u003c/span>\u003cspan class=\"nn\">${esc(s.id)}\u003c/span>\u003c/div>\u003c/div>`;\n  if (s.children) return `\u003cdiv class=\"lane${sub ? ' sub' : ''}\">${node}${sub ? '\u003cdiv class=\"tick\">\u003c/div>' : ''}\u003cdiv class=\"secx\" id=\"s-${esc(s.id)}\">\u003ch2>${esc(s.title)}\u003c/h2>\u003c/div>\u003c/div>` + s.children.map(stepHTML).join('');\n  return `\u003cdiv class=\"lane${sub ? ' sub' : ''}\">${node}${sub ? '\u003cdiv class=\"tick\">\u003c/div>' : ''}${leafHTML(s)}\u003c/div>`;\n}\n\n/* ---- 页面 ---- */\nfunction render(){\n  document.title = `${FLOW.name} · 工作流`; $('#skillName').textContent = FLOW.name; $('#skillDesc').textContent = FLOW.description;\n  let ends = [], backs = [];\n  eachNode((n, sid) => { if (n.type === 'end') ends.push([sid, n]); if (n.type === 'goto' && ALL[n.to] && isBack(sid, n.to)) backs.push([sid, n]); });\n  $('#steps').innerHTML = `\u003cdiv class=\"lane start\">\u003cdiv>\u003cdiv class=\"node word\">开始\u003c/div>\u003c/div>\u003cdiv class=\"startx\">\u003ch2>${fmt(FLOW.description)}\u003c/h2>\u003cp>${fmt(FLOW.summary)}\u003c/p>\u003c/div>\u003c/div>`\n    + FLOW.steps.map(stepHTML).join('')\n    + `\u003cdiv class=\"lane end\">\u003cdiv>\u003cdiv class=\"node word\">结束\u003c/div>\u003c/div>\u003cdiv class=\"endx\">\u003cp>任务在交付时结束，也可能在某一步提前结束，结束的位置见各步骤中的绿色标记。\u003c/p>\u003c/div>\u003c/div>`;\n  const dirs = {}; RES.forEach(r => { const d = r.path.includes('/') ? r.path.split('/')[0] : ''; (dirs[d] = dirs[d] || []).push(r); });\n  const fileLi = r => `\u003cli>\u003cspan class=\"fn\" data-res=\"${esc(r.path)}\">${ic(resIcon(r.path), 'sm')}${esc(r.path.split('/').pop())}\u003c/span>\u003c/li>`;\n  $('#side').innerHTML = `\u003cdiv class=\"group\">\u003cdiv class=\"group-h\">步骤\u003c/div>${ORDER.map(id => `\u003cdiv class=\"item${ALL[id].depth > 1 ? ' l2' : ''}\" data-go=\"${esc(id)}\">\u003cspan class=\"k\">${esc(id)}\u003c/span>\u003cspan class=\"t\">${esc(ALL[id].title)}\u003c/span>\u003c/div>`).join('')}\u003c/div>\n    \u003cdiv class=\"group\">\u003cdiv class=\"group-h\">文件\u003c/div>\u003cul class=\"ftree\">\u003cli>\u003cspan class=\"fn dir\">${ic('folder-open', 'sm')}${esc(FLOW.name)}\u003c/span>\u003cul>\n      \u003cli>\u003cspan class=\"fn\" data-view=\"text\">${ic('file-text', 'sm')}SKILL.md\u003c/span>\u003c/li>\n      \u003cli>\u003cspan class=\"fn\" data-view=\"flow\">${ic('workflow', 'sm')}skill-workflow.html\u003c/span>\u003c/li>\n      ${(dirs[''] || []).map(fileLi).join('')}\n      ${Object.keys(dirs).filter(d => d).map(d => `\u003cli>\u003cspan class=\"fn dir\">${ic('folder', 'sm')}${esc(d)}\u003c/span>\u003cul>${dirs[d].map(fileLi).join('')}\u003c/ul>\u003c/li>`).join('')}\n    \u003c/ul>\u003c/li>\u003c/ul>\u003c/div>`;\n}\n\n\n/* ---- 文字版导出（与模板一致） ---- */\nfunction flowText(sid, f){ if (f.type === 'goto') return (isBack(sid, f.to) ? `回到步骤 ${f.to}` : `进入步骤 ${f.to}`) + (f.text ? `，${f.text}` : ''); if (f.type === 'retry') return `然后${f.text}`; return f.text; }\nfunction branchLines(sid, branches, ind){ return branches.map(b => { const parts = []; let nested = '';\n  (b.then || []).forEach(x => { if (x.type === 'ask' && x.branches){ parts.push(x.text); nested = '\\n' + branchLines(sid, x.branches, ind + '  '); } else if (FLOWS.includes(x.type)) parts.push(flowText(sid, x)); else parts.push(x.text); });\n  return `${ind}- 如果${b.when}，${parts.join('，')}${nested ? '：' + nested : '。'}`; }).join('\\n'); }\nfunction stepText(s){ const h = '#'.repeat(s.depth + 2) + ` 步骤 ${s.id}：${s.title}`;\n  if (s.children) return [h, ...s.children.map(stepText)].join('\\n\\n');\n  const paras = s.body.map(n => n.type === 'check' ? `${n.text}：\\n\\n` + n.items.map(x => `- [ ] ${x}`).join('\\n') : n.branches ? `${n.text}：\\n\\n` + branchLines(s.id, n.branches, '') : `${n.text}。`);\n  if (s.next) paras.push(s.next.type === 'goto' ? `完成后${flowText(s.id, s.next)}。` : `${flowText(s.id, s.next)}。`);\n  if ((s.rules || []).length) paras.push('约束：\\n\\n' + s.rules.map(r => `- ${r}`).join('\\n'));\n  return [h, ...paras].join('\\n\\n'); }\nfunction skillText(){ const g = (FLOW.globalRules || []).length ? ['约束：\\n\\n' + FLOW.globalRules.map(r => `- ${r}`).join('\\n')] : [];\n  return [`---\\nname: ${FLOW.name}\\ndescription: ${FLOW.description}\\n---`, `# ${FLOW.name}`, FLOW.summary, ...g, '## 工作流', ...FLOW.steps.map(stepText)].join('\\n\\n') + '\\n'; }\n\n/* ---- 交互 ---- */\nfunction showView(v){ document.querySelectorAll('.tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.view === v)); document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v)); }\nconst closeSheet = () => { $('#sheet').classList.remove('on'); $('#overlay').classList.remove('on'); };\nfunction focusStep(id){ closeSheet(); showView('flow'); const el = document.getElementById('s-' + id); if (!el) return; el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');\n  document.querySelectorAll('.item.on').forEach(n => n.classList.remove('on')); const n = document.querySelector(`.item[data-go=\"${CSS.escape(id)}\"]`); n && n.classList.add('on'); }\n/* 脚本：展示做什么、输入、输出和核心流程 */\nfunction scriptCard(r){\n  const row = (k, v) => v ? `\u003cdiv class=\"sc-row\">\u003cdiv class=\"sc-k\">${k}\u003c/div>\u003cdiv class=\"sc-v\">${fmt(v)}\u003c/div>\u003c/div>` : '';\n  return `\u003cdiv class=\"sc\">${row('做什么', r.purpose)}${row('输入', r.input)}${row('输出', r.output)}\n    ${(r.steps || []).length ? `\u003cdiv class=\"sc-row\">\u003cdiv class=\"sc-k\">核心流程\u003c/div>\u003col class=\"sc-flow\">${r.steps.map(x => `\u003cli>${fmt(x)}\u003c/li>`).join('')}\u003c/ol>\u003c/div>` : ''}\u003c/div>`;\n}\nfunction openRes(p){\n  const r = RES.find(x => x.path === p); if (!r) return;\n  const steps = LEAVES.filter(id => { let hit = false; walk(ALL[id].body, n => { if (pathsIn(n.text).includes(p)) hit = true; }); return hit; });\n  const c = RES_CONTENT[p];\n  const src = c == null ? '' : `\u003cpre class=\"src\">${esc(c)}\u003c/pre>`;\n  const body = p.startsWith('scripts/') ? scriptCard(r) + (src ? `\u003cdetails class=\"src-d\">\u003csummary>${ic('code', 'xs')}源码\u003c/summary>${src}\u003c/details>` : '')\n    : c == null ? `\u003cp class=\"res-miss\">没有读取到文件内容\u003c/p>`\n    : p.endsWith('.md') ? `\u003carticle class=\"md\">${typeof marked !== 'undefined' ? marked.parse(c) : src}\u003c/article>`\n    : src;\n  $('#sheet').innerHTML = `\u003cdiv class=\"sheet-h\">\u003cdiv class=\"tt\">\u003ch4>${esc(r.title)}\u003c/h4>\u003cp>\u003ccode>${esc(r.path)}\u003c/code>\u003c/p>\u003c/div>\u003cbutton class=\"btn icon ghost\" data-close>${ic('x')}\u003c/button>\u003c/div>\n    \u003cdiv class=\"res-used\">\u003cspan class=\"lbl\">用到它的步骤\u003c/span>${steps.map(id => `\u003cspan class=\"stepchip\" data-go=\"${esc(id)}\">步骤 ${esc(id)}　${esc(ALL[id].title)}${ic('arrow-up-right', 'xs')}\u003c/span>`).join('')}\u003c/div>\n    \u003cdiv class=\"sheet-b\">${body}\u003c/div>`;\n  icons(); $('#sheet').classList.add('on', 'wide'); $('#overlay').classList.add('on');\n}\ndocument.addEventListener('click', e => { const t = e.target;\n  if (t.closest('[data-close]') || t.closest('#overlay')){ closeSheet(); return; }\n  const fv = t.closest('.fn[data-view]'); if (fv){ showView(fv.dataset.view); return; }\n  const r = t.closest('[data-res]'); if (r){ openRes(r.dataset.res); return; }\n  const g = t.closest('[data-go]'); if (g){ focusStep(g.dataset.go); } });\ndocument.addEventListener('mouseover', e => { document.querySelectorAll('.cardx.hl').forEach(c => c.classList.remove('hl')); const g = e.target.closest('.flowx[data-go]'); if (g){ const c = document.getElementById('s-' + g.dataset.go); c && c.classList.add('hl'); } });\ndocument.querySelectorAll('.tabs .tab').forEach(t => t.onclick = () => showView(t.dataset.view));\nconst THEMES = [['', 'monitor'], ['light', 'sun'], ['dark', 'moon']];\nfunction setTheme(t){ t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'); $('#themeBtn').innerHTML = ic(THEMES.find(x => x[0] === t)[1]); icons(); try { localStorage.setItem('skill-flow-theme', t); } catch (e) {} }\n$('#themeBtn').onclick = () => { const c = document.documentElement.getAttribute('data-theme') || ''; setTheme(THEMES[(THEMES.findIndex(x => x[0] === c) + 1) % 3][0]); };\n\nrender(); validate(); $('#wf').textContent = skillText();\nlet th = ''; try { th = localStorage.getItem('skill-flow-theme') || ''; } catch (e) {}\nconst q = new URLSearchParams(location.search).get('theme'); if (q === 'light' || q === 'dark') th = q; setTheme(th);\nif (location.hash === '#text') showView('text'); const rh = location.hash.match(/^#res=(.+)/); if (rh) openRes(decodeURIComponent(rh[1]));\nicons();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "references/writing.md": "# 写成 SKILL.md\n\n把用户确认的流程图 `skill-workflow.html` 写成 SKILL.md 时，按以下规则转换，不得增加流程图上没有的步骤、分支或去向。\n\n- **以导出的文字版为初稿。** 流程图的“文字版”已按 SKILL.md 的格式排好，只做串联和措辞整理。\n- **SKILL.md 依次包含三部分。** frontmatter 中的 `name` 和 `description` 取自流程图顶部；开头一段说明这个 skill 做什么、交付什么，有全局约束时紧接着写在“约束：”下面；最后是“工作流”，步骤编号与流程图一致。\n- **正文与流程图保持一致。** 修改正文时，同步修改 `skill-workflow.html` 中的流程数据。\n", "scripts/embed-resources.py": "#!/usr/bin/env python3\n\"\"\"把流程图中登记的引用文件内容写入 skill-workflow.html。\n\n用法：python3 embed-resources.py \u003cskill-workflow.html 的路径>\n\n读取 FLOW_DATA_START 与 FLOW_DATA_END 之间登记的 resources 路径，\n按相对于 skill-workflow.html 所在目录的位置读取文件，\n把内容写入 RES_CONTENT_START 与 RES_CONTENT_END 之间。\n有文件找不到时，列出这些文件并以状态 1 退出。\n\"\"\"\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\n\ndef main() -> int:\n    if len(sys.argv) != 2:\n        print(\"用法：python3 embed-resources.py \u003cskill-workflow.html 的路径>\")\n        return 2\n\n    page = Path(sys.argv[1])\n    text = page.read_text(encoding=\"utf-8\")\n\n    data = re.search(r\"/\\* FLOW_DATA_START.*?/\\* FLOW_DATA_END \\*/\", text, re.S)\n    block = re.search(r\"(/\\* RES_CONTENT_START[^\\n]*\\n)(.*?)(\\n/\\* RES_CONTENT_END \\*/)\", text, re.S)\n    if not data or not block:\n        print(\"没有找到 FLOW_DATA 或 RES_CONTENT 标记，请确认页面由模板生成。\")\n        return 2\n\n    paths = re.findall(r\"\"\"path:\\s*['\"]([^'\"]+)['\"]\"\"\", data.group(0))\n    content, missing = {}, []\n    for rel in paths:\n        file = page.parent / rel\n        if file.is_file():\n            content[rel] = file.read_text(encoding=\"utf-8\")\n        else:\n            missing.append(rel)\n\n    # 把 \u003c 转义，避免文件中的 \u003c/script>、\u003c!-- 等片段打断页面脚本\n    blob = json.dumps(content, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\")\n    text = text[: block.start(2)] + \"const RES_CONTENT = \" + blob + \";\" + text[block.end(2):]\n    page.write_text(text, encoding=\"utf-8\")\n\n    print(f\"已写入 {len(content)} 个文件的内容。\")\n    for rel in missing:\n        print(f\"未找到：{rel}\")\n    return 1 if missing else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "references/walkthrough.md": "# 走查 SKILL.md\n\n走查写好的 SKILL.md 时，逐项完成以下检查，确认两件事：正文忠实于流程图；AI 只拿到正文时，能按流程图执行。\n\n## 1. 走查项目\n\n- [ ] **对照流程图**：逐步核对每个步骤、分支和去向都能在正文中找到，并且正文里没有图上没有的路径。\n- [ ] **实际执行**：只把 SKILL.md 和实例的输入交给子代理执行，观察它走的路线和结果是否符合流程图；没有子代理时，自己只看正文逐步推演。\n- [ ] **触发检查**：只看触发描述，判断实例应该触发；再用一个相近但不该触发的请求，确认不会被误触发。\n- [ ] **修订时的复现检查**：用复现请求确认原来的问题不再出现。\n- [ ] **修订时的回归检查**：用一个与改动无关的请求，确认原有行为没有被破坏。\n\n## 2. 交给子代理时\n\n- 只提供 SKILL.md 的路径和实例的输入，不附流程图、预期结果或你的推理，否则测不出正文本身是否够用。\n\n## 3. 走查结果\n\n走查结果列出每个走查项目是否通过；没有通过的，写明出现在哪一步、实际怎么走的、和流程图有什么不同。\n"};
/* RES_CONTENT_END */
</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (n, c = '') => `<i data-lucide="${n}" class="ic ${c}"></i>`;
const icons = () => window.lucide && lucide.createIcons();
const FLOWS = ['goto', 'retry', 'end'];
const RES = FLOW.resources || [];
const resIcon = p => p.startsWith('scripts') ? 'file-code' : p.startsWith('assets') ? 'package' : 'file-text';
const fmt = s => esc(s).replace(/`([^`]+)`/g, (m, p) => RES.some(r => r.path === p)
  ? `<span class="resx" data-res="${esc(p)}">${ic(resIcon(p), 'xs')}${esc(p)}</span>` : `<code>${p}</code>`);

const ALL = {}, ORDER = [];
(function index(list, depth, parent){ list.forEach(s => { s.depth = depth; s.parent = parent; ALL[s.id] = s; ORDER.push(s.id); if (s.children) index(s.children, depth + 1, s.id); }); })(FLOW.steps, 1, null);
const LEAVES = ORDER.filter(id => !ALL[id].children);
const pos = id => ORDER.indexOf(id);
const isBack = (from, to) => pos(to) <= pos(from);
function walk(nodes, fn, sid){ (nodes || []).forEach(n => { fn(n, sid); (n.branches || []).forEach(b => walk(b.then, fn, sid)); }); }
function eachNode(fn){ LEAVES.forEach(id => { walk(ALL[id].body, fn, id); if (ALL[id].next) fn(ALL[id].next, id); }); }
const pathsIn = t => (String(t || '').match(/`([^`]+)`/g) || []).map(x => x.slice(1, -1)).filter(x => /^(references|scripts|assets)\//.test(x));
const INCOMING = {};
eachNode((n, sid) => { if (n.type === 'goto' && ALL[n.to]) { const a = INCOMING[n.to] = INCOMING[n.to] || []; if (!a.some(x => x[0] === sid)) a.push([sid, isBack(sid, n.to)]); } });

/* ---- 校验（与模板一致） ---- */
function terminates(b){ return (b.then || []).some(x => FLOWS.includes(x.type) || (x.type === 'ask' && x.branches && x.branches.every(terminates))); }
function validate(){
  const iss = [];
  ORDER.forEach(id => { const s = ALL[id];
    if (s.depth > 3) iss.push(`步骤 ${id} 超过三层`);
    if (s.children && s.body) iss.push(`步骤 ${id} 同时包含指令和子步骤`);
    if (!s.body) return;
    s.body.forEach((n, i) => { if ((n.type === 'decide' || n.type === 'ask') && !(n.branches || []).length) iss.push(`步骤 ${id} 的第 ${i + 1} 条指令没有分支`); });
    if (!s.next){ const last = s.body[s.body.length - 1]; if (!last || !last.branches || !last.branches.every(terminates)) iss.push(`步骤 ${id} 没有写完成后的去向`); } });
  eachNode((n, sid) => { if (n.type === 'goto' && (!ALL[n.to] || ALL[n.to].children)) iss.push(`步骤 ${sid} 的跳转目标 ${n.to} 无效`);
    [n.text, n.when].forEach(t => pathsIn(t).forEach(p => { if (!RES.some(r => r.path === p)) iss.push(`步骤 ${sid} 引用了未登记的资源 ${p}`); })); });
  const seen = new Set(), st = [LEAVES[0]];
  while (st.length){ const id = st.pop(); if (!id || seen.has(id) || !ALL[id]) continue; seen.add(id); walk(ALL[id].body, n => { if (n.type === 'goto') st.push(n.to); }); const nx = ALL[id].next; if (nx && nx.type === 'goto') st.push(nx.to); }
  LEAVES.filter(id => !seen.has(id)).forEach(id => iss.push(`步骤 ${id} 从开始走不到`));
  const el = $('#vstat');
  el.innerHTML = iss.length ? `${ic('circle-alert', 'sm')}${iss.length} 个问题` : `${ic('circle-check', 'sm')}结构校验通过`;
  el.classList.toggle('bad', !!iss.length);
  $('#issues').innerHTML = iss.map(x => `<li>${esc(x)}</li>`).join(''); $('#issues').style.display = iss.length ? 'block' : 'none';
}

/* ---- 元素标签 ---- */
const KIND = {do:['play', '执行', 'k-do'], check:['play', '执行', 'k-do'], decide:['git-branch', '判断', 'k-decide'], ask:['message-circle', '提问', 'k-ask']};
const kindTag = t => { const [i, l, c] = KIND[t] || KIND.do; return `<span class="kind ${c}">${ic(i, 'xs')}${l}</span>`; };

/* ---- 文案与文字版用同一套逻辑生成，只多了样式 ---- */
function flowHTML(sid, f){
  if (f.type === 'goto'){ const b = isBack(sid, f.to);
    return `<span class="fc ${b ? 'back' : 'fwd'}" data-go="${esc(f.to)}">${ic(b ? 'undo-2' : 'arrow-right')}${b ? '回到' : '进入'}步骤 ${esc(f.to)}</span>${f.text ? '，' + fmt(f.text) : ''}`; }
  if (f.type === 'retry') return `<span class="fc retry">${ic('refresh-cw')}然后${fmt(f.text)}</span>`;
  return `<span class="fc end">${ic('flag')}${fmt(f.text)}</span>`;
}
function branchList(sid, branches, kind){
  return `<ul class="bl bl-${kind}">${branches.map(b => {
    const parts = []; let nested = '';
    (b.then || []).forEach(x => {
      if (x.type === 'ask' && x.branches){ parts.push(fmt(x.text)); nested = branchList(sid, x.branches, 'ask'); }
      else if (FLOWS.includes(x.type)) parts.push(flowHTML(sid, x));
      else parts.push(fmt(x.text));
    });
    return `<li><span class="kw kw-${kind}">如果</span><span class="cond">${fmt(b.when)}</span>，${parts.join('，')}${nested ? '：' + nested : '。'}</li>`;
  }).join('')}</ul>`;
}
function insHTML(s, n){
  const tail = n.branches || n.type === 'check' ? '：' : '。';
  return `<div class="ix t-${n.type === 'check' ? 'do' : n.type}"><p class="ix-p">${kindTag(n.type)}<span>${fmt(n.text)}${tail}</span></p>
    ${n.type === 'check' ? `<ul class="chk2">${n.items.map(x => `<li>${ic('square', 'sm')}<span>${fmt(x)}</span></li>`).join('')}</ul>` : ''}
    ${n.branches ? branchList(s.id, n.branches, n.type) : ''}</div>`;
}
function leafHTML(s){
  const rules = (s.rules || []).length ? `<div class="ix t-rule"><div class="rule-row"><span class="kind k-rule">${ic('shield-alert', 'xs')}约束</span><ul>${s.rules.map(r => `<li>${fmt(r)}</li>`).join('')}</ul></div></div>` : '';
  const nx = s.next ? `<div class="ix t-flow"><p class="ix-p"><span class="kind k-flow">${ic('corner-down-right', 'xs')}流程</span><span>${s.next.type === 'goto' ? '完成后' : ''}${flowHTML(s.id, s.next)}。</span></p></div>` : '';
  return `<section class="cardx" id="s-${esc(s.id)}"><div class="cx-h"><h3>${esc(s.title)}</h3></div>
    <div class="ins2">${s.body.map(n => insHTML(s, n)).join('')}${nx}${rules}</div></section>`;
}
function stepHTML(s){
  const sub = s.depth > 1;
  const node = `<div><div class="node step-node" data-go="${esc(s.id)}"><span class="nw">步骤</span><span class="nn">${esc(s.id)}</span></div></div>`;
  if (s.children) return `<div class="lane${sub ? ' sub' : ''}">${node}${sub ? '<div class="tick"></div>' : ''}<div class="secx" id="s-${esc(s.id)}"><h2>${esc(s.title)}</h2></div></div>` + s.children.map(stepHTML).join('');
  return `<div class="lane${sub ? ' sub' : ''}">${node}${sub ? '<div class="tick"></div>' : ''}${leafHTML(s)}</div>`;
}

/* ---- 页面 ---- */
function render(){
  document.title = `${FLOW.name} · 工作流`; $('#skillName').textContent = FLOW.name; $('#skillDesc').textContent = FLOW.description;
  let ends = [], backs = [];
  eachNode((n, sid) => { if (n.type === 'end') ends.push([sid, n]); if (n.type === 'goto' && ALL[n.to] && isBack(sid, n.to)) backs.push([sid, n]); });
  $('#steps').innerHTML = `<div class="lane start"><div><div class="node word">开始</div></div><div class="startx"><h2>${fmt(FLOW.description)}</h2><p>${fmt(FLOW.summary)}</p></div></div>`
    + FLOW.steps.map(stepHTML).join('')
    + `<div class="lane end"><div><div class="node word">结束</div></div><div class="endx"><p>任务在交付时结束，也可能在某一步提前结束，结束的位置见各步骤中的绿色标记。</p></div></div>`;
  const dirs = {}; RES.forEach(r => { const d = r.path.includes('/') ? r.path.split('/')[0] : ''; (dirs[d] = dirs[d] || []).push(r); });
  const fileLi = r => `<li><span class="fn" data-res="${esc(r.path)}">${ic(resIcon(r.path), 'sm')}${esc(r.path.split('/').pop())}</span></li>`;
  $('#side').innerHTML = `<div class="group"><div class="group-h">步骤</div>${ORDER.map(id => `<div class="item${ALL[id].depth > 1 ? ' l2' : ''}" data-go="${esc(id)}"><span class="k">${esc(id)}</span><span class="t">${esc(ALL[id].title)}</span></div>`).join('')}</div>
    <div class="group"><div class="group-h">文件</div><ul class="ftree"><li><span class="fn dir">${ic('folder-open', 'sm')}${esc(FLOW.name)}</span><ul>
      <li><span class="fn" data-view="text">${ic('file-text', 'sm')}SKILL.md</span></li>
      <li><span class="fn" data-view="flow">${ic('workflow', 'sm')}skill-workflow.html</span></li>
      ${(dirs[''] || []).map(fileLi).join('')}
      ${Object.keys(dirs).filter(d => d).map(d => `<li><span class="fn dir">${ic('folder', 'sm')}${esc(d)}</span><ul>${dirs[d].map(fileLi).join('')}</ul></li>`).join('')}
    </ul></li></ul></div>`;
}


/* ---- 文字版导出（与模板一致） ---- */
function flowText(sid, f){ if (f.type === 'goto') return (isBack(sid, f.to) ? `回到步骤 ${f.to}` : `进入步骤 ${f.to}`) + (f.text ? `，${f.text}` : ''); if (f.type === 'retry') return `然后${f.text}`; return f.text; }
function branchLines(sid, branches, ind){ return branches.map(b => { const parts = []; let nested = '';
  (b.then || []).forEach(x => { if (x.type === 'ask' && x.branches){ parts.push(x.text); nested = '\n' + branchLines(sid, x.branches, ind + '  '); } else if (FLOWS.includes(x.type)) parts.push(flowText(sid, x)); else parts.push(x.text); });
  return `${ind}- 如果${b.when}，${parts.join('，')}${nested ? '：' + nested : '。'}`; }).join('\n'); }
function stepText(s){ const h = '#'.repeat(s.depth + 2) + ` 步骤 ${s.id}：${s.title}`;
  if (s.children) return [h, ...s.children.map(stepText)].join('\n\n');
  const paras = s.body.map(n => n.type === 'check' ? `${n.text}：\n\n` + n.items.map(x => `- [ ] ${x}`).join('\n') : n.branches ? `${n.text}：\n\n` + branchLines(s.id, n.branches, '') : `${n.text}。`);
  if (s.next) paras.push(s.next.type === 'goto' ? `完成后${flowText(s.id, s.next)}。` : `${flowText(s.id, s.next)}。`);
  if ((s.rules || []).length) paras.push('约束：\n\n' + s.rules.map(r => `- ${r}`).join('\n'));
  return [h, ...paras].join('\n\n'); }
function skillText(){ const g = (FLOW.globalRules || []).length ? ['约束：\n\n' + FLOW.globalRules.map(r => `- ${r}`).join('\n')] : [];
  return [`---\nname: ${FLOW.name}\ndescription: ${FLOW.description}\n---`, `# ${FLOW.name}`, FLOW.summary, ...g, '## 工作流', ...FLOW.steps.map(stepText)].join('\n\n') + '\n'; }

/* ---- 交互 ---- */
function showView(v){ document.querySelectorAll('.tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.view === v)); document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v)); }
const closeSheet = () => { $('#sheet').classList.remove('on'); $('#overlay').classList.remove('on'); };
function focusStep(id){ closeSheet(); showView('flow'); const el = document.getElementById('s-' + id); if (!el) return; el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  document.querySelectorAll('.item.on').forEach(n => n.classList.remove('on')); const n = document.querySelector(`.item[data-go="${CSS.escape(id)}"]`); n && n.classList.add('on'); }
/* 脚本：展示做什么、输入、输出和核心流程 */
function scriptCard(r){
  const row = (k, v) => v ? `<div class="sc-row"><div class="sc-k">${k}</div><div class="sc-v">${fmt(v)}</div></div>` : '';
  return `<div class="sc">${row('做什么', r.purpose)}${row('输入', r.input)}${row('输出', r.output)}
    ${(r.steps || []).length ? `<div class="sc-row"><div class="sc-k">核心流程</div><ol class="sc-flow">${r.steps.map(x => `<li>${fmt(x)}</li>`).join('')}</ol></div>` : ''}</div>`;
}
function openRes(p){
  const r = RES.find(x => x.path === p); if (!r) return;
  const steps = LEAVES.filter(id => { let hit = false; walk(ALL[id].body, n => { if (pathsIn(n.text).includes(p)) hit = true; }); return hit; });
  const c = RES_CONTENT[p];
  const src = c == null ? '' : `<pre class="src">${esc(c)}</pre>`;
  const body = p.startsWith('scripts/') ? scriptCard(r) + (src ? `<details class="src-d"><summary>${ic('code', 'xs')}源码</summary>${src}</details>` : '')
    : c == null ? `<p class="res-miss">没有读取到文件内容</p>`
    : p.endsWith('.md') ? `<article class="md">${typeof marked !== 'undefined' ? marked.parse(c) : src}</article>`
    : src;
  $('#sheet').innerHTML = `<div class="sheet-h"><div class="tt"><h4>${esc(r.title)}</h4><p><code>${esc(r.path)}</code></p></div><button class="btn icon ghost" data-close>${ic('x')}</button></div>
    <div class="res-used"><span class="lbl">用到它的步骤</span>${steps.map(id => `<span class="stepchip" data-go="${esc(id)}">步骤 ${esc(id)}　${esc(ALL[id].title)}${ic('arrow-up-right', 'xs')}</span>`).join('')}</div>
    <div class="sheet-b">${body}</div>`;
  icons(); $('#sheet').classList.add('on', 'wide'); $('#overlay').classList.add('on');
}
document.addEventListener('click', e => { const t = e.target;
  if (t.closest('[data-close]') || t.closest('#overlay')){ closeSheet(); return; }
  const fv = t.closest('.fn[data-view]'); if (fv){ showView(fv.dataset.view); return; }
  const r = t.closest('[data-res]'); if (r){ openRes(r.dataset.res); return; }
  const g = t.closest('[data-go]'); if (g){ focusStep(g.dataset.go); } });
document.addEventListener('mouseover', e => { document.querySelectorAll('.cardx.hl').forEach(c => c.classList.remove('hl')); const g = e.target.closest('.flowx[data-go]'); if (g){ const c = document.getElementById('s-' + g.dataset.go); c && c.classList.add('hl'); } });
document.querySelectorAll('.tabs .tab').forEach(t => t.onclick = () => showView(t.dataset.view));
const THEMES = [['', 'monitor'], ['light', 'sun'], ['dark', 'moon']];
function setTheme(t){ t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'); $('#themeBtn').innerHTML = ic(THEMES.find(x => x[0] === t)[1]); icons(); try { localStorage.setItem('skill-flow-theme', t); } catch (e) {} }
$('#themeBtn').onclick = () => { const c = document.documentElement.getAttribute('data-theme') || ''; setTheme(THEMES[(THEMES.findIndex(x => x[0] === c) + 1) % 3][0]); };

render(); validate(); $('#wf').textContent = skillText();
let th = ''; try { th = localStorage.getItem('skill-flow-theme') || ''; } catch (e) {}
const q = new URLSearchParams(location.search).get('theme'); if (q === 'light' || q === 'dark') th = q; setTheme(th);
if (location.hash === '#text') showView('text'); const rh = location.hash.match(/^#res=(.+)/); if (rh) openRes(decodeURIComponent(rh[1]));
icons();
</script>
</body>
