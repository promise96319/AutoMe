const $ = id => document.getElementById(id);
const kidsOf = item => item.ans || item.br;
const OFF = kind => ['back','fail','jump','exit'].includes(kind);
const outcome = (id,tag) => STEPS[id].outcomes.find(o => o.tag === tag);
function walkBranches(items,visit) {
  for (const item of items || []) {
    visit(item);
    walkBranches(kidsOf(item),visit);
  }
}
function usedTags(id) {
  const used=new Set();
  for (const a of STEPS[id].acts) walkBranches(kidsOf(a), b => { if(b.out) used.add(b.out); });
  return used;
}


function routeText(o){
  if (o.kind === 'fail' || o.kind === 'exit') return o.res;
  if (o.to === 'end') return o.res || '结束并交付 ' + TERMS.end.sub;
  if (o.kind === 'back') return `回到步骤 ${o.to} ${o.res}`;
  return `进入步骤 ${o.to}`;
}
function branchLines(sid, list, ind){
  return list.map(b => {
    const p = [], k = kidsOf(b);
    if (b.then) p.push(b.then);
    if (b.ask) p.push(b.ans ? `${b.ask}，等待回复` : `${b.ask}，等待回复后${b.goText || '继续'}`);
    else if (b.goText) p.push(b.goText);
    if (b.out) p.push(routeText(outcome(sid, b.out)));
    const line = `${ind}- 如果${b.when}，${p.join('，')}${k ? '：' : '。'}`;
    return k ? line + '\n' + branchLines(sid, k, ind + '  ') : line;
  }).join('\n');
}

function fileView(){
  const host=$('file-data');const tree=el('div','tree');
  tree.append(button('tree-row',[icon('file-text'),el('b','mono','SKILL.md'),el('span','meta','正文')],()=>selectView('text',{reset:true})));
  for(const [type,dir] of Object.entries({reference:'references/',script:'scripts/',asset:'assets/'})){
    tree.append(el('div','tree-row',icon('folder'),el('b','mono',dir)));
    for(const r of RESOURCES.filter(r=>r.type===type))tree.append(button('tree-row file',[icon(types[type][1]),el('span','mono',r.path.split('/').pop()),el('span','meta',resourceStatus(r))],()=>openResource(r)));
  }
  const matrix=el('table','matrix'),head=el('thead'),body=el('tbody');matrix.setAttribute('aria-label','资源与步骤的引用矩阵');
  head.append(el('tr','',el('th','','资源'),...ids.map(id=>el('th','','步骤 '+id))));matrix.append(head,body);
  for(const r of RESOURCES){
    const row=el('tr','',el('th','',chip(r)));
    for(const id of ids){const used=r.usedBy.filter(u=>u.step===id),cell=el('td');
      if(used.length)for(const u of used)cell.append(button('cell',[String(u.act+1)],()=>focusNode($(actId(id,u.act))),{title:'动作 '+(u.act+1)+' · '+u.how,'aria-label':r.title+'，步骤 '+id+'，动作 '+(u.act+1)}));
      else cell.append(el('span','muted','—'));row.append(cell)}
    body.append(row);
  }
  host.append(el('h2','section-heading','包目录'),tree,el('h2','section-heading','资源 × 步骤'),el('p','file-note','数字是动作序号，可直接定位。虚线标记建议拆分的资源。'),el('div','table-scroll',matrix));
}
function applyWalk(scroll=true){
  const host=$('reader'),bar=$('walkbar');host.classList.toggle('walking',!!scenario);bar.hidden=!scenario||view!=='flow';
  host.querySelectorAll('.visited,.current,.passed').forEach(n=>n.classList.remove('visited','current','passed'));
  $('prev').disabled=!scenario||position===0;$('next').disabled=!scenario||position>=((SCENARIOS[scenario]?.path.length||1)-1);
  if(!scenario){bar.replaceChildren();return}
  const sample=SCENARIOS[scenario],path=sample.path;
  for(const [key] of path.slice(0,position+1)){
    const seen=targets.get(key);if(!seen)continue;
    seen.closest('.step-card')?.classList.add('visited');
    if(key.includes('/'))seen.classList.add('passed');
  }
  const [key,why]=path[position],target=targets.get(key),card=target?.closest('.step-card');
  bar.replaceChildren(el('div','walk-caption',sample.name+' · '+(position+1)+' / '+path.length+'　'+sample.req),el('div','',el('b','','本例'),why));
  if(target&&card){card.classList.add('visited','current');if(key.includes('/'))target.classList.add('current');markNav(card.dataset.step);
    if(scroll){const where=key.includes('/')?target:card;where.scrollIntoView({block:key.includes('/')?'center':'start'})}}
}
function move(delta){
  if(!scenario)return;const next=Math.min(Math.max(position+delta,0),SCENARIOS[scenario].path.length-1);
  if(position!==next){position=next;selectView('flow');applyWalk()}
}
function applyTheme(value,save){
  const theme=['system','light','dark'].includes(value)?value:'system';
  document.documentElement.dataset.theme=theme;$('theme').value=theme;
  $('theme-icon').replaceChildren(icon({system:'monitor',light:'sun',dark:'moon'}[theme]));
  if(save){try{localStorage.setItem('autome-codex-theme',theme)}catch{}}
}
function setup(){
  document.querySelectorAll('[data-icon]').forEach(n=>n.append(icon(n.dataset.icon)));
  $('name').textContent=FLOW.name;$('trigger').textContent=FLOW.description;
  for(const [key,[label,ic]] of Object.entries(presentation)){
    const b=button('tab',[icon(ic),label],()=>selectView(key,{reset:true}),{id:'tab-'+key,role:'tab','aria-controls':key});
    $('tabs').append(b);tabButtons.set(key,b);
  }
  $('tabs').addEventListener('keydown',e=>{
    const keys=[...tabButtons.keys()];let i=keys.indexOf(view);
    if(e.key==='ArrowRight')i=(i+1)%keys.length;else if(e.key==='ArrowLeft')i=(i+keys.length-1)%keys.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=keys.length-1;else return;
    e.preventDefault();e.stopPropagation();selectView(keys[i],{reset:true});tabButtons.get(keys[i]).focus();
  });
  renderWorkflow();renderIndex($('index'));renderIndex($('mobile-index'));fileView();
  const issues=[...validation().values()].flat();
  $('status').append(icon(issues.length?'circle-alert':'shield-check'),issues.length?issues.length+' 个结构问题':'结构校验通过');$('status').classList.toggle('bad',!!issues.length);
  $('status').onclick=showValidation;
  if(issues.length){try{$('markdown').textContent=skillText()}catch{$('markdown').textContent='流程数据存在错误，请查看结构校验。'}}else $('markdown').textContent=skillText();
  $('full').onclick=()=>setFull(!full);
  for(const [id,s] of Object.entries(SCENARIOS))$('scenario').add(new Option(s.name,id));
  $('scenario').onchange=()=>{scenario=$('scenario').value;position=0;selectView('flow');applyWalk();if(scenario)$('next').focus({preventScroll:true})};
  $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
  document.addEventListener('keydown',e=>{
    if(!scenario||view!=='flow'||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||document.querySelector('dialog[open]')||e.target.closest('input,select,textarea,[contenteditable="true"],[role="tablist"]'))return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}
  });
  $('menu').onclick=()=>$('nav-drawer').showModal();
  for(const d of document.querySelectorAll('dialog')){
    d.querySelector('[data-close]').onclick=()=>d.close();
    d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()});
  }
  applyTheme(document.documentElement.dataset.theme,false);$('theme').onchange=()=>applyTheme($('theme').value,true);
  selectView(['files','text'].includes(location.hash.slice(1))?location.hash.slice(1):'flow');applyWalk(false);markNav('1');
}
setup();


</script></body></html>
