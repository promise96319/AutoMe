<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>create-skill · 流程审阅</title>
    <script>
      const colorMode = matchMedia('(prefers-color-scheme: dark)');
      function readTheme() {
        try {
          return localStorage.getItem('create-skill-g6-theme');
        } catch {
          return null;
        }
      }
      const storedTheme = readTheme();
      let theme = ['light', 'dark', 'system'].includes(storedTheme) ? storedTheme : 'system';
      function applyTheme() {
        document.documentElement.dataset.theme =
          theme === 'system' ? (colorMode.matches ? 'dark' : 'light') : theme;
      }
      applyTheme();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --surface: #fff;
        --ink: #1d212a;
        --text: #404651;
        --muted: #626977;
        --line: #dee1e8;
        --soft: #f2f3f6;
        --brand: #365cc9;
        --accent: #eaf0ff;
        --grid: #d5dbe6;
        --shadow: 0 2px 8px #1e294014;
        --radius: 8px;
        font:
          14px/1.55 'Geist',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #15171c;
        --surface: #1d1f25;
        --ink: #eef0f5;
        --text: #cbd0da;
        --muted: #a5adbb;
        --line: #363a44;
        --soft: #292c33;
        --brand: #9cb6ff;
        --accent: #293655;
        --grid: #313742;
        --shadow: 0 2px 10px #0004;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button {
        background: none;
        border: 0;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:not(:disabled):hover,
      .idx button:hover,
      summary:hover {
        background: var(--soft);
      }
      [hidden] {
        display: none !important;
      }
      .icon {
        width: 17px;
        height: 17px;
        display: inline-block;
        flex: none;
        vertical-align: -3px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #app {
        height: 100vh;
        height: 100dvh;
        min-height: 530px;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 26px;
        height: 59px;
        flex: none;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand,
      .brand > span,
      .header-actions,
      .btn,
      .tabs,
      .tools,
      .tool-group,
      .switch,
      .panel-head,
      .zoom,
      .walknav,
      .badge,
      .index-label,
      .section-title,
      .legend-trigger,
      .case-name {
        display: flex;
        align-items: center;
      }
      .brand {
        gap: 10px;
        font-weight: 650;
        white-space: nowrap;
      }
      .mark {
        width: 29px;
        height: 29px;
        border-radius: 8px;
        color: white;
        background: #3459c6;
        display: grid !important;
        place-items: center;
      }
      .mark .icon {
        width: 19px;
        height: 19px;
      }
      .crumb {
        border-left: 1px solid var(--line);
        padding-left: 13px;
        margin-left: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .header-actions {
        gap: 14px;
      }
      .tabs {
        gap: 2px;
        background: var(--soft);
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 9px;
      }
      .tabs button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .tabs button[aria-selected='true'] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 4px #13162619;
      }
      .select-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .select-wrap > .icon:last-child {
        position: absolute;
        right: 9px;
        width: 13px;
        pointer-events: none;
      }
      .select-wrap select {
        appearance: none;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px 27px 6px 10px;
        font-size: 12px;
      }
      .theme > .icon:first-child {
        position: absolute;
        left: 9px;
        width: 15px;
        pointer-events: none;
      }
      .theme select {
        padding-left: 31px;
      }
      .intro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 20px 28px 18px;
        background: var(--surface);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(25px, 2.1vw, 34px);
        font-weight: 660;
        letter-spacing: -1.2px;
        line-height: 1.2;
      }
      .intro p {
        color: var(--muted);
        margin-top: 5px;
        font-size: 13px;
      }
      .metrics {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--muted);
        font-size: 12px;
      }
      .metrics span + span {
        border-left: 1px solid var(--line);
        padding-left: 16px;
      }
      .metrics b {
        color: var(--ink);
        font:
          600 15px ui-monospace,
          monospace;
        margin-right: 4px;
      }
      #work {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(278px, 24vw, 355px);
        border-top: 1px solid var(--line);
      }
      .workspace {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .tools {
        padding: 9px 16px;
        justify-content: space-between;
        gap: 9px;
        flex-wrap: wrap;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        z-index: 2;
      }
      .tool-group {
        gap: 6px;
      }
      .btn {
        justify-content: center;
        gap: 6px;
        color: var(--text);
        padding: 5px 9px;
        font-size: 12px;
        min-height: 30px;
        white-space: nowrap;
        border-radius: 6px;
      }
      .btn.outline {
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .btn .icon {
        width: 15px;
        height: 15px;
      }
      .sep {
        height: 17px;
        border-left: 1px solid var(--line);
        margin: 0 4px;
      }
      .switch {
        gap: 7px;
        font-size: 12px;
        border-radius: 6px;
        padding: 6px;
        color: var(--text);
        white-space: nowrap;
      }
      .toggle {
        width: 25px;
        height: 15px;
        background: var(--muted);
        border-radius: 16px;
        position: relative;
        opacity: 0.64;
      }
      .toggle:after {
        content: '';
        display: block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #fff;
        position: absolute;
        top: 2px;
        left: 2px;
      }
      .switch[aria-checked='true'] .toggle {
        background: #365cc9;
        opacity: 1;
      }
      .switch[aria-checked='true'] .toggle:after {
        left: 12px;
      }
      .walk-select {
        position: relative;
      }
      .walk-select > .icon:first-child {
        position: absolute;
        left: 9px;
        color: var(--brand);
        width: 15px;
        pointer-events: none;
      }
      .walk-select select {
        padding-left: 31px;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        isolation: isolate;
        background-color: var(--bg);
        background-image: radial-gradient(var(--grid) 0.8px, transparent 1px);
        background-size: 16px 16px;
        overflow: hidden;
      }
      #surface,
      #canvas,
      #fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #surface {
        touch-action: none;
        cursor: grab;
        outline-offset: -3px;
      }
      #surface.drag {
        cursor: grabbing;
      }
      #canvas,
      #fallback {
        pointer-events: none;
      }
      #canvas canvas {
        display: block;
      }
      .float {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: var(--shadow);
      }
      .zoom {
        position: absolute;
        left: 15px;
        bottom: 15px;
        gap: 1px;
        padding: 3px;
      }
      .square {
        width: 29px;
        height: 29px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        border-radius: 5px;
        color: var(--text);
      }
      .square .icon {
        width: 15px;
        height: 15px;
      }
      #percent {
        font:
          11px ui-monospace,
          monospace;
        color: var(--muted);
        min-width: 41px;
        text-align: center;
      }
      .mapbox {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 128px;
        overflow: hidden;
      }
      .mapbox summary,
      .legend summary {
        list-style: none;
      }
      .mapbox summary::-webkit-details-marker,
      .legend summary::-webkit-details-marker {
        display: none;
      }
      .mapbox summary {
        padding: 5px 8px;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .mapbox summary .icon {
        width: 13px;
        height: 13px;
      }
      .mapbox svg#mini {
        width: 100%;
        height: 75px;
        display: block;
        border-top: 1px solid var(--line);
        touch-action: none;
        cursor: crosshair;
        background: var(--bg);
      }
      .mapbox:not([open]) {
        width: auto;
      }
      .legend {
        position: absolute;
        top: 12px;
        left: 14px;
        max-width: calc(100% - 28px);
      }
      .legend summary {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 6px 10px;
        color: var(--text);
        border-radius: 8px;
      }
      .legend summary .icon {
        width: 14px;
        height: 14px;
      }
      .legend-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px 15px;
        padding: 10px 13px 14px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .legend-grid span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .sample {
        display: inline-block;
        flex: none;
        width: 20px;
        height: 13px;
        border: 1.5px solid var(--c);
        background: var(--f);
        border-radius: 4px;
      }
      .sample.diamond {
        width: 12px;
        height: 12px;
        transform: rotate(45deg);
        margin: 0 4px;
        border-radius: 2px;
      }
      .sample.dot {
        width: 10px;
        height: 10px;
        margin: 0 5px;
        border-radius: 50%;
      }
      .sample.pill {
        border-radius: 10px;
      }
      .sample.wire {
        height: 0;
        border: 0;
        border-top: 2px dashed var(--c);
        border-radius: 0;
      }
      .sample.solid {
        border-top-style: solid;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 15px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        font-size: 11px;
        color: var(--muted);
      }
      .status > span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status .icon {
        width: 12px;
        height: 12px;
      }
      aside {
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--surface);
        overflow: hidden;
      }
      .panel-head {
        height: 48px;
        min-height: 48px;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 0 17px;
      }
      .panel-head > span {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 620;
        font-size: 13px;
      }
      .panel-head .icon {
        width: 15px;
      }
      #detail {
        overflow: auto;
        flex: 1;
        padding: 20px;
        overscroll-behavior: contain;
      }
      .badge {
        width: max-content;
        max-width: 100%;
        font-size: 11px;
        color: var(--brand);
        background: var(--accent);
        gap: 5px;
        padding: 2px 7px;
        border-radius: 5px;
        font-weight: 600;
      }
      .badge .icon {
        width: 13px;
        height: 13px;
      }
      h2 {
        font-size: 21px;
        line-height: 1.4;
        letter-spacing: -0.5px;
        margin: 10px 0 8px;
      }
      h3 {
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .detail-section {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        margin-top: 15px;
      }
      .detail-section p,
      .para {
        font-size: 13px;
        color: var(--text);
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .raw {
        white-space: pre-wrap;
      }
      .idx {
        display: grid;
        gap: 2px;
      }
      .idx button,
      .navline {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 7px 5px;
        border-radius: 5px;
        font-size: 13px;
        color: var(--text);
      }
      .idx .nested {
        padding-left: 19px;
      }
      .index-label {
        justify-content: center;
        min-width: 29px;
        height: 21px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font:
          11px/1 ui-monospace,
          monospace;
        color: var(--brand);
      }
      .navline .icon {
        width: 14px;
        height: 14px;
        color: var(--brand);
      }
      .idx .icon:last-child {
        width: 12px;
        margin-left: auto;
        color: var(--muted);
      }
      .notes {
        padding-left: 17px;
        margin: 0;
        color: var(--text);
        font-size: 13px;
        line-height: 1.75;
      }
      .notes li + li {
        margin-top: 7px;
      }
      .notes small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .checklist {
        display: grid;
        gap: 9px;
        margin-top: 9px;
      }
      .checklist label {
        cursor: pointer;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
      }
      .checklist input {
        accent-color: var(--brand);
        margin: 4px 0 0;
      }
      .checklist label:has(:checked) span {
        color: var(--muted);
      }
      .detail-section .muted,
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      code {
        font:
          0.9em ui-monospace,
          monospace;
        background: var(--soft);
        padding: 1px 4px;
        border-radius: 3px;
      }
      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0 0;
      }
      #walk {
        padding: 13px 18px;
        background: var(--accent);
        border-bottom: 1px solid var(--line);
        max-height: 35%;
        overflow: auto;
      }
      .case-name {
        font-size: 12px;
        color: var(--brand);
        font-weight: 650;
        gap: 6px;
      }
      .case-name .icon {
        width: 14px;
        height: 14px;
      }
      .walknav {
        justify-content: space-between;
        gap: 6px;
        margin-top: 8px;
      }
      .walknav span {
        color: var(--muted);
        font:
          11px ui-monospace,
          monospace;
      }
      #case-note {
        font-size: 13px;
        margin-top: 6px;
      }
      #case-request {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      #textview {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 24px clamp(15px, 6vw, 90px);
        border-top: 1px solid var(--line);
      }
      #textview article {
        max-width: 980px;
        margin: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      #textview h2 {
        font:
          600 14px ui-monospace,
          monospace;
        background: var(--soft);
        margin: 0;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
      }
      pre {
        margin: 0;
        padding: 23px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          13px/1.85 'SFMono-Regular',
          Consolas,
          'PingFang SC',
          monospace;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
        overflow: hidden;
      }
      @media (max-width: 920px) {
        .metrics {
          display: none;
        }
        .tools {
          padding: 6px;
          gap: 4px;
        }
        .tool-group {
          gap: 2px;
        }
        .btn {
          padding: 4px 5px;
        }
        .intro {
          padding: 13px 17px;
        }
        .mapbox {
          width: 98px;
        }
        .mapbox svg#mini {
          height: 55px;
        }
        #detail {
          padding: 14px;
        }
        .crumb {
          display: none;
        }
      }
      @media (max-width: 720px) {
        #app {
          height: auto;
          min-height: 100dvh;
        }
        header {
          height: auto;
          min-height: 52px;
          padding: 7px 10px;
          gap: 4px;
          flex-wrap: wrap;
        }
        .brand {
          gap: 6px;
          font-size: 12px;
        }
        .header-actions {
          gap: 4px;
        }
        .theme select {
          width: 35px;
          color: transparent;
          padding: 5px;
        }
        .theme > .icon:last-child {
          display: none;
        }
        .tabs button {
          padding: 4px 7px;
        }
        .intro p {
          font-size: 12px;
        }
        .intro {
          padding: 12px;
        }
        #work {
          display: flex;
          flex-direction: column;
        }
        .workspace {
          height: 66dvh;
          min-height: 390px;
          flex: none;
        }
        .tools {
          padding: 5px;
        }
        .status {
          font-size: 10px;
          padding: 3px 8px;
        }
        .zoom {
          left: 7px;
          bottom: 8px;
        }
        .mapbox {
          right: 7px;
          bottom: 8px;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        #detail {
          overflow: visible;
        }
        #walk {
          max-height: none;
        }
        .panel-head {
          height: 39px;
          min-height: 39px;
        }
        #textview {
          overflow: visible;
          padding: 12px;
        }
        pre {
          padding: 13px;
        }
        .sep {
          margin: 0 2px;
        }
      }
    </style>
  </head>

    <script>
const FLOW = {
  name:'create-skill',
  description:'当用户需要创建新的 skill，或修改已有 skill 的触发条件、执行流程或规则时使用。',
  intro:['把用户的需求或一个已有的 skill，做成 Agent 能直接照着执行的 skill。先弄清用户真正要什么，再画出 skill 的流程图请用户确认，最后按流程图写成 SKILL.md 并检查。用户确认过的流程图是唯一依据：正文与流程图不一致时，以流程图为准。',
         '用户给出的通常只是一条主线，你要把它补成一份完整、可执行的 skill。每一步要写清：从哪里拿输入，可能出现哪些情况，每种情况去哪里，哪里需要用户参与，什么时候结束。你补出来的内容要明确标出来，让用户能看到、能核对，不要等用户逐条指出。'],
};
const STEPS = {
  '1': {title:'明确要开发什么样的 skill', input:'用户请求、相关对话和用户提供的材料',
    acts:[{t:'先收集材料：读完用户的请求和相关对话，用户提供的文档、示例和现有做法也要完整读取'},
          {t:'然后判断用户的真实意图', br:[
            {when:'用户要修订已有的 skill（点名了某个 skill、给出了路径，或说“刚才那个”）', out:'修订'},
            {when:'用户要新建，但这个需求不适合做成 skill', ask:'向用户说明原因并推荐更合适的做法', ans:[
              {when:'用户接受建议', out:'改用其他方式'},
              {when:'用户仍要做成 skill', out:'新建'}]},
            {when:'用户要新建，并且适合做成 skill', out:'新建'}]}],
    rules:[{t:'以下需求不适合做成 skill：只做一次的任务，直接完成即可；只适用于某个项目的约定，写进项目说明文件，如 CLAUDE.md 或 AGENTS.md；需要在某个事件发生时自动执行的行为，用 hook 配置；能用脚本或校验规则强制执行的机械约束，写成脚本或校验'}],
    outcomes:[{tag:'修订', kind:'sub', to:'1.1'}, {tag:'新建', kind:'sub', to:'1.2'},
              {tag:'改用其他方式', kind:'exit', res:'按建议处理，结束本次任务'}],
    kids:['1.1','1.2','1.3']},
  '1.1': {title:'找到并读懂要修订的 skill', input:'用户请求',
    acts:[{t:'在个人 skill 目录、当前项目的 skill 目录和已安装的插件中，查找要修订的 skill', br:[
            {when:'用户的描述对应多个 skill，或一个都对不上', ask:'列出最接近的候选请用户指认', goText:'重新查找'},
            {when:'确实没有这个 skill', ask:'告诉用户，并询问是否改为新建', ans:[
              {when:'用户同意', out:'改为新建'},
              {when:'用户不同意', out:'不再修订'}]},
            {when:'找到了', then:'完整读取它的 SKILL.md、引用的文件和脚本，以及同目录下的流程图 `flow.html`（如果有）'}]},
          {t:'确定要修改的文件', br:[
            {when:'找到的 skill 位于插件缓存等由别人维护的位置', ask:'说明直接修改会在插件更新时被覆盖，给出“复制到个人 skill 目录后再改”和“仍在原处改”两个选项，推荐前者', goText:'按用户的选择确定'},
            {when:'它位于个人或项目的 skill 目录', then:'直接修改原文件'}]},
          {t:'然后把用户的修改要求落到具体行为上：写清这个 skill 现在会怎样、改完应该怎样，并找一个能复现现状的具体请求'}],
    out:'原 skill 的内容、要修改的文件、现状 → 期望、复现请求',
    rules:[{t:'只依据读到的原文理解现有 skill，不要凭记忆或摘要', why:'否则容易误判要改的范围'}],
    outcomes:[{tag:'修订依据就绪', kind:'next', to:'1.3'},
              {tag:'改为新建', kind:'jump', to:'1.2', res:'改走新建路径', lane:0},
              {tag:'不再修订', kind:'exit', res:'结束本次任务'}]},
  '1.2': {title:'确认新 skill 的定位', input:'用户请求',
    acts:[{t:'在已安装的 skill 中查找用途相近的', br:[
            {when:'找到了', ask:'说明它们和这次需求的异同，给出“修订已有的”和“新建”两个选项并标出推荐', ans:[
              {when:'用户选修订', out:'改为修订'},
              {when:'用户选新建', then:'继续本步'}]},
            {when:'没有找到', then:'继续本步'}]},
          {t:'确定新 skill 存放在哪里', br:[
            {when:'用户已经指明', then:'按用户说的'},
            {when:'当前项目已有存放 skill 的约定', then:'按约定'},
            {when:'都没有', ask:'询问用户，推荐只在本项目用的放项目目录，跨项目用的放个人目录', goText:'按回复确定'}]}],
    out:'确认要新建，以及存放位置',
    outcomes:[{tag:'定位已确认', kind:'next', to:'1.3'},
              {tag:'改为修订', kind:'jump', to:'1.1', res:'改走修订路径', lane:1}]},
  '1.3': {title:'核对需求是否完整', input:'步骤 1.1 或 1.2 的产出、对话和材料',
    acts:[{t:'对照下面的清单逐项核对。能从对话、材料、项目文件或原 skill 中找到答案的，直接补上，不要拿去问用户', list:[
            '解决什么问题：这个 skill 要解决的问题，以及没有它时 AI 通常会怎么做错',
            '什么时候用：谁会在什么情况下用它，哪些相近的请求不该触发它',
            '输入和交付：它拿到什么输入，交付什么结果，做到什么程度算完成',
            '具体实例：至少一个真实的输入和期望的结果；修订时还要有能复现现状的请求',
            '约束：必须遵守或不能做的事，可以使用的工具和环境',
            '用户参与：哪些地方需要用户提供信息或做确认']},
          {t:'根据核对结果', br:[
            {when:'还有会影响流程走向的点不清楚', ask:'把这些点一次性问用户。每个问题说明你目前的理解，给出 2～3 个可选答案并标出推荐项；用户没给实例时，自拟一个放进问题里请用户确认', goText:'补全理解，再核对一遍'},
            {when:'剩下的都不影响流程走向', then:'按最合理的方式自行补全，记下你的选择', out:'需求明确'}]}],
    out:'需求摘要',
    rules:[{t:'提问要集中，一次问清，不要零碎地反复追问'}],
    outcomes:[{tag:'需求明确', kind:'next', to:'2'}]},
  '2': {title:'生成或更新流程图', nest:'画的是目标 skill', input:'需求摘要、具体实例；修订时还有原 skill 和已有流程图',
    acts:[{t:'按 `references/flowchart.md` 的规则，生成或更新目标 skill 的流程图，保存为 skill 目录下的 `flow.html`', br:[
            {when:'是新建', then:'以实例为线索，从输入一路推到交付结果，画出主线。再挑一两个会走不同路线的情况推一遍，例如输入缺失、中途失败、用户否决，把分支补上'},
            {when:'是修订', then:'在已有流程图上修改。没有流程图时，先把原 SKILL.md 如实还原成流程图，标出原文含糊或自相矛盾的地方，再只改受影响的部分，并在图上标出改动'}]},
          {t:'流程图顶部写名称、触发描述、一句话用途，以及步骤 1 得到的需求摘要。每个步骤写清输入、动作、产出、可能的结果和各自的去向。画的时候，主动补全用户没有说到的部分', list:[
            '每个输入从哪里来，拿不到时怎么办',

const outcome = (sid, tag) => STEPS[sid].outcomes.find(o => o.tag === tag);
const kidsOf = b => b.ans || b.br;
const OFF = k => ['back','fail','jump','exit'].includes(k);
function usedTags(sid) {

  function visit(item) {
    if (item.out) tags.add(item.out);
    (kidsOf(item) || []).forEach(visit);
  }
  STEPS[sid].acts.forEach(visit);
  return tags;
}

function routeText(o){
  if (o.kind === 'fail' || o.kind === 'exit') return o.res;
  if (o.to === 'end') return o.res || '结束并交付 ' + TERMS.end.sub;
  if (o.kind === 'back') return `回到步骤 ${o.to} ${o.res}`;
  return `进入步骤 ${o.to}`;
}
function branchLines(sid, list, ind){
  return list.map(b => {
    const p = [], k = kidsOf(b);
    if (b.then) p.push(b.then);
    if (b.ask) p.push(b.ans ? `${b.ask}，等待回复` : `${b.ask}，等待回复后${b.goText || '继续'}`);
    else if (b.goText) p.push(b.goText);
    if (b.out) p.push(routeText(outcome(sid, b.out)));
    const line = `${ind}- 如果${b.when}，${p.join('，')}${k ? '：' : '。'}`;
    return k ? line + '\n' + branchLines(sid, k, ind + '  ') : line;
  }).join('\n');
}
function stepText(sid, level){
  const s = STEPS[sid]; const paras = []; let buf = '';
  s.acts.forEach(a => {
    const sentence = a.ask ? `${a.ask}，等待回复` : a.t, k = kidsOf(a);
    if (a.para && buf){ paras.push(buf); buf = ''; }
    if (a.list){ paras.push(buf + sentence + '：\n' + a.list.map(x => `- ${x}。`).join('\n')); buf = ''; }
    else if (k){ paras.push(buf + sentence + '：\n' + branchLines(sid, k, '')); buf = ''; }
    else buf += sentence + '。';
  });
  const used = usedTags(sid), rest = s.outcomes.filter(o => !used.has(o.tag) && !OFF(o.kind) || !used.has(o.tag) && o.when);
  if (rest.length === 1 && !rest[0].when){ const tail = `完成后${routeText(rest[0])}。`; if (buf) buf += tail; else paras.push(tail); }
  if (buf) paras.push(buf);
  rest.filter(o => o.when).forEach(o => paras.push(`如果${o.when}，${routeText(o)}。`));
  if (s.rules && s.rules.length) paras.push('要求：\n' + s.rules.map(r => `- ${r.t}${r.why ? '，' + r.why : ''}。`).join('\n'));
  let out = `${'#'.repeat(level)} 步骤 ${sid}：${s.title}\n\n${paras.join('\n\n')}`;
  if (s.kids) out += '\n\n' + s.kids.map(k => stepText(k, level + 1)).join('\n\n');
  return out;
}

}
