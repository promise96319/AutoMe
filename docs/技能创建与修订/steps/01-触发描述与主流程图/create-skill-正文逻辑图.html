  "source": "---\nname: create-skill\ndescription: 当用户需要创建新的 skill，或修改已有 skill 的触发条件、执行流程或规则时使用。\n---\n\n# create-skill\n\n把用户的需求或一个已有的 skill，做成 Agent 能直接照着执行的 skill。先弄清用户真正要什么，再画出 skill 的流程图请用户确认，最后按流程图写成 SKILL.md 并检查。用户确认过的流程图是唯一依据：正文与流程图不一致时，以流程图为准。\n\n用户给出的通常只是一条主线，你要把它补成一份完整、可执行的 skill。每一步要写清：从哪里拿输入，可能出现哪些情况，每种情况去哪里，哪里需要用户参与，什么时候结束。你补出来的内容要明确标出来，让用户能看到、能核对，不要等用户逐条指出。\n\n## 工作流\n\n### 步骤 1：明确要开发什么样的 skill\n\n先收集材料：读完用户的请求和相关对话，用户提供的文档、示例和现有做法也要完整读取。然后判断用户的真实意图：\n- 如果用户要修订已有的 skill（点名了某个 skill、给出了路径，或说“刚才那个”），进入步骤 1.1。\n- 如果用户要新建，但这个需求不适合做成 skill，向用户说明原因并推荐更合适的做法，等待回复：\n  - 如果用户接受建议，按建议处理，结束本次任务。\n  - 如果用户仍要做成 skill，进入步骤 1.2。\n- 如果用户要新建，并且适合做成 skill，进入步骤 1.2。\n\n要求：\n- 以下需求不适合做成 skill：只做一次的任务，直接完成即可；只适用于某个项目的约定，写进项目说明文件，如 CLAUDE.md 或 AGENTS.md；需要在某个事件发生时自动执行的行为，用 hook 配置；能用脚本或校验规则强制执行的机械约束，写成脚本或校验。\n\n#### 步骤 1.1：找到并读懂要修订的 skill\n\n在个人 skill 目录、当前项目的 skill 目录和已安装的插件中，查找要修订的 skill：\n- 如果用户的描述对应多个 skill，或一个都对不上，列出最接近的候选请用户指认，等待回复后重新查找。\n- 如果确实没有这个 skill，告诉用户，并询问是否改为新建，等待回复：\n  - 如果用户同意，进入步骤 1.2。\n  - 如果用户不同意，结束本次任务。\n- 如果找到了，完整读取它的 SKILL.md、引用的文件和脚本，以及同目录下的流程图 `flow.html`（如果有）。\n\n确定要修改的文件：\n- 如果找到的 skill 位于插件缓存等由别人维护的位置，说明直接修改会在插件更新时被覆盖，给出“复制到个人 skill 目录后再改”和“仍在原处改”两个选项，推荐前者，等待回复后按用户的选择确定。\n- 如果它位于个人或项目的 skill 目录，直接修改原文件。\n\n然后把用户的修改要求落到具体行为上：写清这个 skill 现在会怎样、改完应该怎样，并找一个能复现现状的具体请求。完成后进入步骤 1.3。\n\n要求：\n- 只依据读到的原文理解现有 skill，不要凭记忆或摘要，否则容易误判要改的范围。\n\n#### 步骤 1.2：确认新 skill 的定位\n\n在已安装的 skill 中查找用途相近的：\n- 如果找到了，说明它们和这次需求的异同，给出“修订已有的”和“新建”两个选项并标出推荐，等待回复：\n  - 如果用户选修订，进入步骤 1.1。\n  - 如果用户选新建，继续本步。\n- 如果没有找到，继续本步。\n\n确定新 skill 存放在哪里：\n- 如果用户已经指明，按用户说的。\n- 如果当前项目已有存放 skill 的约定，按约定。\n- 如果都没有，询问用户，推荐只在本项目用的放项目目录，跨项目用的放个人目录，等待回复后按回复确定。\n\n完成后进入步骤 1.3。\n\n#### 步骤 1.3：核对需求是否完整\n\n对照下面的清单逐项核对。能从对话、材料、项目文件或原 skill 中找到答案的，直接补上，不要拿去问用户：\n- 解决什么问题：这个 skill 要解决的问题，以及没有它时 AI 通常会怎么做错。\n- 什么时候用：谁会在什么情况下用它，哪些相近的请求不该触发它。\n- 输入和交付：它拿到什么输入，交付什么结果，做到什么程度算完成。\n- 具体实例：至少一个真实的输入和期望的结果；修订时还要有能复现现状的请求。\n- 约束：必须遵守或不能做的事，可以使用的工具和环境。\n- 用户参与：哪些地方需要用户提供信息或做确认。\n\n根据核对结果：\n- 如果还有会影响流程走向的点不清楚，把这些点一次性问用户。每个问题说明你目前的理解，给出 2～3 个可选答案并标出推荐项；用户没给实例时，自拟一个放进问题里请用户确认，等待回复后补全理解，再核对一遍。\n- 如果剩下的都不影响流程走向，按最合理的方式自行补全，记下你的选择，进入步骤 2。\n\n要求：\n- 提问要集中，一次问清，不要零碎地反复追问。\n\n### 步骤 2：生成或更新流程图\n\n按 `references/flowchart.md` 的规则，生成或更新目标 skill 的流程图，保存为 skill 目录下的 `flow.html`：\n- 如果是新建，以实例为线索，从输入一路推到交付结果，画出主线。再挑一两个会走不同路线的情况推一遍，例如输入缺失、中途失败、用户否决，把分支补上。\n- 如果是修订，在已有流程图上修改。没有流程图时，先把原 SKILL.md 如实还原成流程图，标出原文含糊或自相矛盾的地方，再只改受影响的部分，并在图上标出改动。\n\n流程图顶部写名称、触发描述、一句话用途，以及步骤 1 得到的需求摘要。每个步骤写清输入、动作、产出、可能的结果和各自的去向。画的时候，主动补全用户没有说到的部分：\n- 每个输入从哪里来，拿不到时怎么办。\n- 动作失败或得到意外结果时去哪里。\n- 需要用户参与的地方，以及用户每种回复的去向。\n- 每个循环回到哪里、什么时候结束。可能反复多次的，写明最多几次，超过后怎么办。\n- 异常结束时告诉用户什么，留下什么。\n\n补全时遇到拿不准的地方，分两类处理：\n- 如果是方向性的问题，也就是有几种合理做法、选哪种结果明显不同，向用户提问：说明问题和取舍，给出 2～3 个建议做法并标出推荐项，等待回复后按用户的选择画进图里。\n- 如果只是局部细节，自行决定，并在图上标出你的选择，留给用户检查时一并核对。\n\n画完后先自查：每个结果都有去向，每个步骤从开始都走得到，每个循环都有退出条件，用实例沿着图走一遍能到达期望结果。发现问题先改好。\n\n然后把流程图交给用户检查：告诉用户文件位置，概括主线、关键判断和你自行决定的细节；修订时说明改了哪里，等待回复：\n- 如果用户确认，进入步骤 3。\n- 如果问题出在需求理解上，回到步骤 1.3 纠正理解，更新需求摘要，再修改流程图中受影响的部分，自查后重新请用户检查。\n- 如果问题出在流程图本身，按意见修改，自查后再请用户检查。\n- 如果用户要暂停，保存当前流程图，告诉用户下次从哪里继续，结束本次任务。\n\n要求：\n- 名称用“动词原形 + 对象”，只用小写字母、数字和连字符，如 `fix-bug`，让人看名字就知道它做什么。\n- 触发描述用第三人称，写成“当用户……时使用”，只写什么时候用，不写怎么做。和已安装的相近 skill 有重叠时，写出能区分的场景。\n- 会改变走向的规则写成动作里的条件，其余约束写在对应步骤旁边。\n- 补全以实例和常见变化中真会遇到的情况为限，不为罕见的假想情况添加规则。\n- 参考资料类 skill 的流程可以很短，不要为了画图编造步骤。\n\n### 步骤 3：按流程图写成 skill\n\n按用户确认的流程图写出 SKILL.md。frontmatter 的 name 和 description 取自流程图顶部；正文开头用一段话说明这个 skill 做什么、交付什么；然后在“工作流”模块下按流程图逐步写出每个步骤，步骤编号与流程图一致。修订时只改受影响的部分，其余原文保持不变。\n\n写约束时，按它要防止的问题选择写法：\n- 防止明知规则仍会违反，就写成明确的禁令，并说明理由。\n- 防止产出的形式走样，就正面写清产出由哪几部分组成、按什么顺序排列。\n- 防止漏掉某个要素，就在模板或清单里给它留出必填项。\n- 行为要视情况而定的，写成以可观察的条件开头的条件句，不要写“除非……”式的例外。\n\n写完后做两项检查。第一，对照流程图逐步核对，确认每个步骤、分支和去向都能在正文中找到，并且正文里没有图上没有的路径。第二，只看 SKILL.md，用实例走一遍：有子代理时，只把 SKILL.md 和实例的输入交给子代理去执行，观察它走的路线和结果；没有子代理时，自己逐步推演。另外，用一个相近但不该触发的请求检查触发描述。修订时，还要用复现请求确认原问题不再出现，并用一个与改动无关的请求确认原有行为没有被破坏。根据检查结果：\n- 如果正文与流程图不一致，或者执行时因为正文含糊而走错，修改正文，再检查一遍。\n- 如果发现流程图本身有问题，回到步骤 2 修改流程图，经用户确认后再改正文。\n- 如果触发判断有误，修改触发描述，同步到流程图顶部，再检查一遍。\n- 如果检查都通过，向用户交付：说明文件位置、这个 skill 的主线、你在写作中自行做的选择、检查结果和仍待用户决定的事项，然后结束本次任务。\n\n要求：\n- 一级步骤写“步骤 1”，子步骤写“步骤 2.1”，跳转和回退写明目标步骤。\n- 每个步骤写成连贯的段落，分支用无序列表列出各种情况。\n- 用指令式语言写清依据什么、做什么、不同情况分别去哪里，需要等待或终止时也写明；循环写明回到哪里、什么时候结束。\n- 把约束写进它生效的那一步，不要集中堆在开头或末尾。\n- 不要把并列的条件写成先后步骤，也不要用重复说明和琐碎步骤盖过主线。\n- 交给子代理检查时，不要附上流程图或你的推理，否则测不出正文本身是否够用。\n",

<script>
'use strict';
const data=JSON.parse(document.querySelector('#model').textContent);
const nodes=data.nodes, examples=data.scenarios;
const phases=['全程地图','明确需求','确认流程图','编写与检查'];
const starts=['intent','intent','draw','write'];
const phaseTitle=['','需求与定位','绘图与确认','写作与检查'];
const kinds={next:['继续','→'],wait:['等待用户','◷'],back:['回到','↶'],switch:['切换路径','⇄'],exit:['结束','■']};
const $=id=>document.getElementById(id);
const make=(tag,cls,content)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.textContent=content;return el};
const state={node:'intent',mode:'overview',trail:[],session:null};
function choose(id,mode='local',record=true){
  if(!nodes[id])return;
  if(record && (id!==state.node||mode!==state.mode))state.trail.push([state.node,state.mode]);
  state.node=id;state.mode=mode;render();
}
function explore(id){state.session=null;choose(id);}
function button(label,fn,cls=''){const b=make('button',cls,label);b.addEventListener('click',fn);return b}
function render(){
 const n=nodes[state.node], overview=state.mode==='overview';
 $('overview').hidden=!overview;$('local').hidden=overview;$('mapTitle').textContent=overview?'全程地图':phaseTitle[n.phase]+' · 条件与去向';
 $('back').disabled=!state.trail.length;
 [...$('phases').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===(overview?0:n.phase))));
 if(!overview)renderLocal(n);
 renderDetail(n);renderWalk();
}
function renderLocal(n){
 const select=$('nodeSelect');select.replaceChildren();
 for(const [id,v] of Object.entries(nodes)){if(v.phase!==n.phase)continue;const opt=make('option','',v.section+' · '+v.title);opt.value=id;select.append(opt)}
 select.value=state.node;
 const here=make('div','currentbox');here.append(make('span','',n.section==='结束'?'流程出口':'步骤 '+n.section),make('strong','',n.title));
 const list=make('div',n.routes.length?'branchlist':'finished');
 for(const r of n.routes){
   const t=nodes[r.to],b=button('',()=>explore(r.to),'branchrow'),body=make('div'),dest=make('div','target '+r.kind);
   body.append(make('span','condition',r.when),make('span','effect',r.result));
   dest.append(make('i','',kinds[r.kind].join(' ')),make('span','',(t.section==='结束'?'':t.section+' · ')+t.title));
   b.append(body,dest);list.append(b);
 }
 if(!n.routes.length)list.textContent='■　'+n.output;
 $('localGraph').replaceChildren(here,list);
}
function renderDetail(n){
 const id=make('span','idtag',n.section==='结束'?'流程出口':'步骤 '+n.section+' / '+phaseTitle[n.phase]),title=make('h2','',n.title),dl=make('dl','io');
 for(const [label,key] of [['输入','input'],['执行','action'],['产出','output']])dl.append(make('dt','',label),make('dd','',n[key]));
 const content=[id,title,dl];
 if(n.rules.length){const box=make('section','rules'),ul=make('ul');for(const r of n.rules)ul.append(make('li','',r));box.append(make('h3','','本步规则'),ul);content.push(box)}
 if(state.mode==='overview'){const box=make('div','links');box.append(button('展开这个判断的 '+n.routes.length+' 条去向 →',()=>explore(state.node),'small'));content.push(box)}
 content.push(make('p','view-note','正文第 '+n.lines[0]+'–'+n.lines[1]+' 行'));
 $('detail').replaceChildren(...content);
}
const ns='http://www.w3.org/2000/svg';
function svg(tag,attrs,txt){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(txt!=null)el.textContent=txt;return el}
function buildGraph(){
 const g=$('graph'),compact=window.matchMedia('(max-width:690px)').matches;g.replaceChildren();g.setAttribute('viewBox',compact?'0 0 360 425':'0 0 730 465');const defs=svg('defs',{});for(const [id,c] of [['forward','#43735b'],['return','#ab6547']]){const m=svg('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});m.append(svg('path',{d:'M0 0L10 5L0 10Z',fill:c}));defs.append(m)}g.append(defs);
 function line(d,back=false){g.append(svg('path',{class:'wire'+(back?' return':''),d,'marker-end':'url(#'+(back?'return':'forward')+')'}))}
 function label(x,y,value,isBack=false){g.append(svg('text',{x,y,class:'edge-text'+(isBack?' back-text':''),'text-anchor':'middle'},value))}
 function box(id,x,y,w,h,number,name,sub='',terminal=false){
  const gr=svg('g',{class:'svg-node'+(terminal?' end':'')+(id===state.node?' active':''),role:'button',tabindex:'0','aria-label':number+' '+name+'，展开判断'});gr.append(svg('rect',{x,y,width:w,height:h,rx:8}));if(number)gr.append(svg('text',{x:x+13,y:y+17,class:'num'},number));
  gr.append(svg('text',{x:x+w/2,y:y+(sub?31: h/2+6),'text-anchor':'middle'},name));if(sub)gr.append(svg('text',{x:x+w/2,y:y+h-9,'text-anchor':'middle',class:'sub'},sub));gr.addEventListener('click',()=>explore(id));gr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();explore(id)}});g.append(gr);
 }
 if(compact){
  line('M163 50V65H82V79');line('M163 65H242V79');
  line('M82 123V143H163V162');line('M242 123V143H163V162');
  line('M163 206V232');line('M163 276V302');line('M163 346V373');
  line('M245 242H340V178H245',true);line('M245 326H306V264H245',true);
  label(292,171,'需求有误',true);label(278,318,'图有误',true);label(197,295,'已确认');label(201,365,'检查通过');
  box('intent',81,6,164,44,'1','判断开发意图');
  box('locate',12,79,139,44,'1.1','查找修订对象');box('position',174,79,139,44,'1.2','确认新建定位');
  box('needs',81,162,164,44,'1.3','核对完整需求');box('draw',81,232,164,44,'2','设计并确认流程图');
  box('write',81,302,164,44,'3','按图编写并检查');box('delivered',90,373,146,37,'','交付目标 skill','',true);
  return;
 }
 line('M320 58V75H174V94');line('M320 75H468V94');
 line('M174 145V166H320V185');line('M468 145V166H320V185');
 line('M320 235V263');line('M320 313V341');line('M320 391V419');
 line('M252 115H386',true);line('M388 131H253',true);
 line('M428 275H626V204H428',true);line('M428 365H571V300H428',true);
 label(320,109,'同意改新建',true);label(320,149,'选择修订',true);
 label(544,197,'需求理解有误',true);label(511,359,'发现图有误',true);
 label(363,332,'用户确认');label(360,409,'检查通过');
 box('intent',215,8,210,50,'1','判断开发意图');
 box('locate',92,94,160,51,'1.1','查找修订对象');
 box('position',388,94,160,51,'1.2','确认新建定位');
 box('needs',212,185,216,50,'1.3','核对需求完整性');
 box('draw',212,263,216,50,'2','设计并确认流程图');
 box('write',212,341,216,50,'3','按图编写并检查');
 box('delivered',244,419,152,34,'','交付目标 skill','',true);
}
function renderWalk(){
 const s=state.session;$('play').hidden=!s;$('walk').textContent=s?'重新开始':'开始走查';
 if(!s)return;
 const ex=examples[s.which];$('prev').disabled=s.index===0;$('next').disabled=s.index===ex.path.length-1;$('walkIndex').textContent=(s.index+1)+' / '+ex.path.length;
 if(!s.index){$('walkNote').textContent=ex.note;return}
 const from=nodes[ex.path[s.index-1]],to=ex.path[s.index];const condition=ex.via?.[s.index];const route=from.routes.find(r=>r.to===to&&(!condition||r.when===condition));
 $('walkNote').textContent=route.when+' → '+route.result+'。';
}
function moveWalk(i){
 const s=state.session;if(!s)return;const ex=examples[s.which];s.index=Math.max(0,Math.min(i,ex.path.length-1));choose(ex.path[s.index],'local',false);
}
const lines=data.source.trimEnd().split('\n');
function showSource(part){
 const n=nodes[state.node],lo=part?n.lines[0]:1,hi=part?n.lines[1]:lines.length;
 $('sourceTitle').textContent=data.filename+(part?' · 第 '+lo+'–'+hi+' 行':'');
 const frag=document.createDocumentFragment();
 for(let i=lo;i<=hi;i++){const row=make('div','line'+(part&&i===lo?' mark':''));row.append(make('em','',String(i)),make('span','',lines[i-1]));frag.append(row)}
 $('sourceLines').replaceChildren(frag);$('source').showModal();$('source').scrollTop=0;
}
phases.forEach((v,i)=>{const b=button('',()=>{state.session=null;choose(starts[i],i?'local':'overview')},'phase');if(i)b.append(make('span','','0'+i));b.append(document.createTextNode(v));$('phases').append(b)});
$('nodeSelect').onchange=e=>explore(e.target.value);
$('back').onclick=()=>{const old=state.trail.pop();if(old){state.session=null;choose(old[0],old[1],false)}};
examples.forEach((s,i)=>{const opt=make('option','',s.name);opt.value=i;$('scenario').append(opt)});
$('scenario').onchange=()=>{state.session=null;renderWalk()};
$('walk').onclick=()=>{state.trail.push([state.node,state.mode]);state.session={which:Number($('scenario').value),index:0};moveWalk(0)};
$('prev').onclick=()=>moveWalk(state.session.index-1);$('next').onclick=()=>moveWalk(state.session.index+1);
$('endWalk').onclick=()=>{state.session=null;render()};
$('allSource').onclick=()=>showSource(false);$('nodeSource').onclick=()=>showSource(true);$('closeSource').onclick=()=>$('source').close();
$('source').onclick=e=>{if(e.target===$('source')){const b=$('source').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('source').close()}};
$('introText').textContent=data.source.split('\n').find(line=>line.startsWith('description:')).slice('description:'.length).trim();
$('credit').textContent='依据 '+data.filename+' 生成 · 原文快照 '+data.sha.slice(0,10);
window.matchMedia('(max-width:690px)').addEventListener('change',buildGraph);buildGraph();render();
</script></body></html>
