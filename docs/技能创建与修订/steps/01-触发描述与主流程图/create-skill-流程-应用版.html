<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>create-skill 流程</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --subtle:#f8f9fb; --hover:#f1f3f6; --border:#e5e8ec; --border-strong:#d3d8de;
  --text:#1b1f24; --text-2:#4b5563; --text-3:#8a93a0;
  --accent:#2563eb; --accent-soft:#eef3ff;
  --green:#15803d; --green-soft:#ecf8f0; --amber:#b45309; --amber-soft:#fff6e8;
  --violet:#6d28d9; --violet-soft:#f4f0ff; --blue:#1d4ed8; --blue-soft:#edf2ff; --red:#b91c1c; --red-soft:#fdeeee;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a20; --subtle:#1c2027; --hover:#222731; --border:#2a2f38; --border-strong:#363c47;
    --text:#e7eaee; --text-2:#b3bac4; --text-3:#7d8693;
    --accent:#6b9bff; --accent-soft:#1c2740;
    --green:#4ade80; --green-soft:#15291d; --amber:#f5b25a; --amber-soft:#2e2414;
    --violet:#b69cff; --violet-soft:#251f3a; --blue:#8fb1ff; --blue-soft:#1b2440; --red:#f87171; --red-soft:#341a1a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a20; --subtle:#1c2027; --hover:#222731; --border:#2a2f38; --border-strong:#363c47;
  --text:#e7eaee; --text-2:#b3bac4; --text-3:#7d8693;
  --accent:#6b9bff; --accent-soft:#1c2740;
  --green:#4ade80; --green-soft:#15291d; --amber:#f5b25a; --amber-soft:#2e2414;
  --violet:#b69cff; --violet-soft:#251f3a; --blue:#8fb1ff; --blue-soft:#1b2440; --red:#f87171; --red-soft:#341a1a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
code,.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px}

/* ---------- 顶栏 ---------- */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-size:15px}
.brand span{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:520px}
.tabs{display:flex;gap:2px;background:var(--subtle);border:1px solid var(--border);border-radius:9px;padding:2px;margin-left:8px}
.tab{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:13px;color:var(--text-2);cursor:pointer}
.tab.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.grow{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--green)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.bad{color:var(--red)}
.ctrl{display:flex;align-items:center;gap:6px}
.btn{height:30px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{width:30px;padding:0;justify-content:center}
select.btn{padding-right:8px;color:var(--text);background:var(--surface)}
select.btn option{color:var(--text);background:var(--surface)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--border-strong);position:relative;transition:.15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--accent)} .switch.on i::after{left:14px}

/* ---------- 主体三栏 ---------- */
.shell{flex:1;display:grid;grid-template-columns:248px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--border);overflow:auto;padding:16px 10px 32px}
.side h6{margin:18px 10px 6px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.side h6:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{min-width:26px;font-size:12px;font-weight:600;color:var(--text-3)}
.nav.on .n{color:var(--accent)}
.nav .t{overflow:hidden;text-overflow:ellipsis}
.nav .r{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.nav.l2{padding-left:26px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.main{overflow:auto;position:relative}
.wrap{max-width:860px;margin:0 auto;padding:24px 28px 80px}

/* ---------- 概览 ---------- */
.summary{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden}
.stat{padding:14px 20px;border-left:1px solid var(--border)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:22px;font-weight:650;line-height:1.2;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--text-3)}
.banner{display:none;align-items:center;gap:12px;background:var(--accent-soft);color:var(--text);border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:13px}
.banner.on{display:flex}
.banner .step{font-weight:650;color:var(--accent);white-space:nowrap}

/* ---------- 步骤卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;scroll-margin:20px;transition:box-shadow .2s,opacity .2s}
.card-h{display:flex;align-items:center;gap:14px;padding:16px 22px}
.num{flex:none;min-width:34px;height:34px;padding:0 9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:700;display:grid;place-items:center;letter-spacing:-.01em}
.card.sub .num{background:var(--subtle);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border)}
.card-t{flex:1;min-width:0;font-size:16.5px;font-weight:650;letter-spacing:-.005em}
.card-t small{display:block;font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px}
.meta{display:flex;gap:6px}
.chipbtn{height:28px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{background:var(--hover);color:var(--text)}
.chipbtn.on{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chipbtn .cnt{min-width:18px;height:18px;border-radius:999px;background:var(--subtle);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.chipbtn.on .cnt{background:transparent}
.spec{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--subtle)}
.spec.one{grid-template-columns:1fr}
.spec > div{padding:10px 22px;min-width:0}
.spec > div + div{border-left:1px solid var(--border)}
.spec small{display:block;font-size:11.5px;font-weight:600;color:var(--text-3);margin-bottom:2px}
.spec span{font-size:13px;color:var(--text-2)}
.rules{display:none;padding:12px 22px 14px;border-bottom:1px solid var(--border);background:var(--amber-soft);font-size:13px}
.rules.on{display:block}
.rules h5{margin:0 0 6px;font-size:12px;color:var(--amber);font-weight:650}
.rules ol{margin:0;padding-left:20px}
.rules li{margin:4px 0;color:var(--text)}
.rules .why{display:block;color:var(--text-3);font-size:12px}
.note{display:none;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--accent-soft);font-size:13px}
.card.cur > .note{display:block}
.note::before{content:"本例  ";font-weight:650;color:var(--accent)}

/* 动作时间线 */
.acts{position:relative;padding:18px 22px 14px}
.acts::before{content:"";position:absolute;left:36px;top:32px;bottom:30px;width:2px;background:var(--border);border-radius:2px}
.act{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:14px;padding:5px 0 9px}
.idx{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--border-strong);font-size:12px;font-weight:700;color:var(--text-2);display:grid;place-items:center}
.act.decide .idx{box-shadow:0 0 0 2px var(--violet);color:var(--violet)}
.act.ask .idx{box-shadow:0 0 0 2px var(--amber);color:var(--amber);font-size:13px}
.a-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:28px}
.a-name{font-size:14.5px;font-weight:600}
.kind{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px}
.kind.decide{color:var(--violet);background:var(--violet-soft)}
.kind.ask{color:var(--amber);background:var(--amber-soft)}
.a-full{display:none;margin-top:3px;font-size:13px;color:var(--text-2);line-height:1.65}
body.detail .a-full,.act.open > div > .a-full{display:block}
.a-name.click{cursor:pointer}
.a-name.click:hover{color:var(--accent)}
.res{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text-2)}
.res:hover{border-color:var(--accent);color:var(--accent)}
.res.proposed{border-style:dashed}
.res .ic{font-size:11px}
.listbtn{height:24px;display:inline-flex;align-items:center;padding:0 9px;border-radius:7px;font-size:12px;color:var(--text-2);cursor:pointer;background:var(--subtle)}
.listbtn:hover{color:var(--accent)}
.checklist{display:none;margin:10px 0 0;padding:10px 14px;list-style:none;background:var(--subtle);border-radius:10px;font-size:13px}
.checklist.on,body.detail .checklist{display:block}
.checklist li{padding:3px 0 3px 22px;position:relative;color:var(--text-2)}
.checklist li::before{content:"";position:absolute;left:2px;top:9px;width:10px;height:10px;border:1.5px solid var(--text-3);border-radius:3px}

/* 分支：条件 / 处理 / 去向 */
.br{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) 128px;margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;background:var(--surface)}
.br > div{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:38px}
.br > .th{min-height:0;padding:6px 12px;border-top:0;background:var(--subtle);font-size:11.5px;font-weight:600;color:var(--text-3)}
.br .c{color:var(--text);font-weight:500}
.br .c .tag{font-size:11px;font-weight:600;color:var(--text-3);background:var(--subtle);border-radius:4px;padding:0 5px}
.br .c.reply{font-weight:400;color:var(--text-2)}
.br .c .ar{color:var(--text-3)}
.br .f{display:none;width:100%;font-size:12px;font-weight:400;color:var(--text-3);line-height:1.5}
body.detail .br .f{display:block}
.br .h{color:var(--text-2)}
.br .d{justify-content:flex-end}
.br .hl{background:var(--accent-soft)!important}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.go{cursor:pointer}
.pill.next,.pill.sub{background:var(--green-soft);color:var(--green)}
.pill.back{background:var(--amber-soft);color:var(--amber)}
.pill.jump{background:var(--violet-soft);color:var(--violet)}
.pill.exit{background:var(--blue-soft);color:var(--blue)}
.pill.fail{background:var(--red-soft);color:var(--red)}
.pill.loop{background:transparent;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.pill.cont{background:transparent;color:var(--text-3);padding:0 4px}
.pill.go:hover{filter:brightness(.97);box-shadow:0 0 0 2px var(--border)}
.task{display:inline-flex;align-items:center;gap:4px}
.task.ask{color:var(--amber);font-weight:500}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 22px;border-top:1px solid var(--border);background:var(--subtle);font-size:13px;color:var(--text-3)}
.vis{display:inline-flex;gap:3px;margin-left:8px;vertical-align:2px}
.vis span{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.shell.scen .card:not(.visited){opacity:.45}
.card.cur{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.flash{animation:flash 1.2s}
@keyframes flash{0%,50%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:var(--shadow)}}

/* 步骤之间 */
.link{display:flex;justify-content:center;height:30px;position:relative}
.link::before{content:"";width:2px;height:100%;background:var(--border-strong)}
.link::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--border-strong);border-bottom:0}
.subgroup{margin:14px 0 0 17px;padding:4px 0 0 25px;border-left:2px solid var(--border)}
.subgroup-h{font-size:12px;font-weight:600;color:var(--text-3);margin:0 0 10px}
.subgroup .card + .card{margin-top:14px}
.endcard{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:14px;background:var(--green-soft);color:var(--text-2);font-size:13px}
.endcard b{color:var(--green)}
.themebtn{min-width:96px;justify-content:center}

/* ---------- 文件结构视图 ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px}
.panel-h b{font-size:15px}
.panel-h span{font-size:12.5px;color:var(--text-3)}
.tree{padding:10px 12px}
.trow{display:grid;grid-template-columns:minmax(260px,1fr) 1.2fr;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;cursor:pointer}
.trow:hover{background:var(--hover)}
.trow .p{display:flex;align-items:center;gap:8px}
.trow .p .in{display:inline-block}
.trow .d{font-size:12.5px;color:var(--text-2)}
.badge{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px}
.badge.reference{background:var(--blue-soft);color:var(--blue)} .badge.script{background:var(--green-soft);color:var(--green)} .badge.asset{background:var(--violet-soft);color:var(--violet)} .badge.main{background:var(--subtle);color:var(--text-2);border:1px solid var(--border)}
.badge.proposed{background:transparent;color:var(--text-3);border:1px dashed var(--border-strong)}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:center}
.matrix th{font-size:12px;font-weight:600;color:var(--text-3);background:var(--subtle)}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix tr:last-child td{border-bottom:0}
.matrix .m{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer}
.legend-line{display:flex;gap:14px;flex-wrap:wrap;padding:10px 20px 14px;font-size:12px;color:var(--text-3)}

/* ---------- 右侧详情面板 ---------- */
.drawer{position:fixed;top:56px;right:0;bottom:0;width:400px;background:var(--surface);border-left:1px solid var(--border);box-shadow:none;transform:translateX(100%);transition:transform .2s ease;overflow:auto;z-index:20}
.drawer.on{transform:none;box-shadow:-8px 0 24px rgba(16,24,40,.08)}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.drawer-h .tt{flex:1;min-width:0}
.drawer-h .tt b{display:block;font-size:15px}
.drawer-h .tt code{color:var(--text-3)}
.drawer-b{padding:16px 20px 32px;font-size:13.5px}
.drawer-b h5{margin:16px 0 6px;font-size:12px;font-weight:600;color:var(--text-3)}
.drawer-b h5:first-child{margin-top:0}
.drawer-b ul{margin:0;padding-left:18px;color:var(--text-2)}
.drawer-b li{margin:3px 0}
.use{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer}
.use:hover{border-color:var(--accent)}
.use small{color:var(--text-3)}
.callout{padding:8px 12px;border-radius:8px;background:var(--subtle);color:var(--text-2);font-size:12.5px}

#textView{display:none}
#wf{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;white-space:pre-wrap;font:13.5px/1.8 "SF Mono",ui-monospace,Menlo,"PingFang SC",monospace;margin:0}
.view{display:none} .view.on{display:block}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><b id="skillName"></b><span id="skillDesc"></span></div>
  <div class="tabs"><button class="tab on" data-view="flow">流程</button><button class="tab" data-view="files">文件结构</button><button class="tab" data-view="text">文字版</button></div>
  <div class="grow"></div>
  <span class="status" id="status"></span>
  <label class="switch" id="detailSw"><i></i>显示完整文字</label>
  <button class="btn themebtn" id="themeBtn"></button>
  <div class="ctrl">
    <select class="btn" id="scenSel"><option value="">示例走查：不选</option></select>
    <button class="btn icon" id="prev" title="上一步">‹</button><button class="btn icon" id="next" title="下一步">›</button>
  </div>
</header>
<div class="shell" id="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <div class="wrap">
      <section class="view on" id="v-flow">
        <div class="summary" id="summary"></div>
        <div class="banner" id="banner"></div>
        <div id="cards"></div>
      </section>
      <section class="view" id="v-files"></section>
      <section class="view" id="v-text"><pre id="wf"></pre></section>
    </div>
  </main>
</div>
<aside class="drawer" id="drawer"></aside>

<script>
const FLOW = {
  name:'create-skill',
  description:'当用户需要创建新的 skill，或修改已有 skill 的触发条件、执行流程或规则时使用。',
  intro:['把用户的需求或一个已有的 skill，做成 Agent 能直接照着执行的 skill。先弄清用户真正要什么，再画出 skill 的流程图请用户确认，最后按流程图写成 SKILL.md 并检查。用户确认过的流程图是唯一依据：正文与流程图不一致时，以流程图为准。',
         '用户给出的通常只是一条主线，你要把它补成一份完整、可执行的 skill。每一步要写清：从哪里拿输入，可能出现哪些情况，每种情况去哪里，哪里需要用户参与，什么时候结束。你补出来的内容要明确标出来，让用户能看到、能核对，不要等用户逐条指出。'],
};
const STEPS = {
  '1': {title:'明确要开发什么样的 skill', input:'用户请求、相关对话和用户提供的材料',
    acts:[{t:'先收集材料：读完用户的请求和相关对话，用户提供的文档、示例和现有做法也要完整读取'},
          {t:'然后判断用户的真实意图', br:[
            {when:'用户要修订已有的 skill（点名了某个 skill、给出了路径，或说“刚才那个”）', out:'修订'},
            {when:'用户要新建，但这个需求不适合做成 skill', ask:'向用户说明原因并推荐更合适的做法', ans:[
              {when:'用户接受建议', out:'改用其他方式'},
              {when:'用户仍要做成 skill', out:'新建'}]},
            {when:'用户要新建，并且适合做成 skill', out:'新建'}]}],

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const OFF = k => ['back','fail','jump','exit'].includes(k);
const outcome = (sid, tag) => STEPS[sid].outcomes.find(o => o.tag === tag);
const kidsOf = b => b.ans || b.br;
const byId = id => document.querySelector(`[data-id="${CSS.escape(id)}"]`);
const lab = (sid, type, key) => (LABELS[sid] && LABELS[sid][type] && LABELS[sid][type][key]) || null;
const allSteps = () => { const a = []; const add = id => { a.push(id); (STEPS[id].kids || []).forEach(add); }; ORDER.filter(id => STEPS[id]).forEach(add); return a; };
const parentOf = id => id.includes('.') ? id.split('.').slice(0, -1).join('.') : null;
function walkBranches(sid, fn){
  const walk = (list, path) => (list || []).forEach(b => { fn(b, [...path, b.when]); walk(kidsOf(b), [...path, b.when]); });
  STEPS[sid].acts.forEach(a => walk(kidsOf(a), []));
}
const usedTags = sid => { const u = new Set(); walkBranches(sid, b => b.out && u.add(b.out)); return u; };
const RES_IC = {reference:'📘', script:'⚙️', asset:'🧩'};
const RES_TYPE = {reference:'参考资料', script:'脚本', asset:'素材'};
const resOf = (sid, i) => RESOURCES.filter(r => r.usedBy.some(u => u.step === sid && u.act === i));
const allOutcomes = () => Object.entries(STEPS).flatMap(([sid, s]) => s.outcomes.map(o => ({sid, o})));

function validate(){
  const issues = [];
  for (const [sid, s] of Object.entries(STEPS)){
    walkBranches(sid, b => { if (b.out && !outcome(sid, b.out)) issues.push(`步骤 ${sid} 引用了未定义的结果「${b.out}」`); });
    for (const o of s.outcomes){
      if (o.to && o.to !== 'end' && !STEPS[o.to]) issues.push(`步骤 ${sid} 指向不存在的步骤 ${o.to}`);
      if (OFF(o.kind) && !o.res) issues.push(`步骤 ${sid} 的「${o.tag}」没写之后做什么`);
    }
    s.acts.forEach((a, i) => { if (!lab(sid, 'acts', i)) issues.push(`步骤 ${sid} 的动作 ${i + 1} 缺少简短名称`); });
  }
  RESOURCES.forEach(r => { if (!r.usedBy.length) issues.push(`${r.path} 没有被任何步骤使用`);
    r.usedBy.forEach(u => { if (!STEPS[u.step] || !STEPS[u.step].acts[u.act]) issues.push(`${r.path} 指向不存在的动作`); }); });
  const seen = new Set(), st = ['1'];
  while (st.length){ const id = st.pop(); if (seen.has(id) || !STEPS[id]) continue; seen.add(id); STEPS[id].outcomes.forEach(o => o.to && st.push(o.to)); }
  Object.keys(STEPS).filter(id => !seen.has(id)).forEach(id => issues.push(`步骤 ${id} 从开始走不到`));
  const el = $('#status');
  el.textContent = issues.length ? `${issues.length} 个问题` : '结构校验通过';
  el.title = issues.join('\n');
  el.classList.toggle('bad', !!issues.length);
}

/* ================= 去向 ================= */
let occ = {};
function destHTML(sid, tag){
  const o = outcome(sid, tag), key = `${sid}/${tag}`;
  occ[key] = (occ[key] || 0) + 1;
  const id = occ[key] > 1 ? `${key}@${occ[key]}` : key;
  let t;
  if (o.kind === 'fail') t = '✕ 终止';
  else if (o.kind === 'exit') t = '⇥ 结束任务';
  else if (o.to === 'end') t = '✓ 交付';
  else if (o.kind === 'back') t = `↺ 回到 ${o.to}`;
  else if (o.kind === 'jump') t = `↪ 转到 ${o.to}`;
  else t = `→ 步骤 ${o.to}`;
  const go = o.to && o.to !== 'end';
  return `<span class="pill ${o.kind}${go ? ' go' : ''}" data-id="${id}"${go ? ` data-to="${o.to}"` : ''} title="${esc(o.res || '')}">${t}</span>`;
}

/* ================= 分支表格 ================= */
function branchRows(sid, list, path, depth, reply){
  const rows = [];
  list.forEach((b, i) => {
    const key = path ? `${path}.${i}` : `${i}`, k = kidsOf(b);
    const cs = lab(sid, reply ? 'ans' : 'br', key) || b.when;
    const cond = `${depth ? '<span class="ar">↳</span>' : ''}${reply ? '<span class="tag">用户</span>' : ''}<span>${fmt(cs)}</span>${cs !== b.when ? `<span class="f">${fmt(b.when)}</span>` : ''}`;
    const h = [];
    if (b.then && b.then !== '继续本步'){ const s = lab(sid, 'then', key); h.push(`<span class="task">${fmt(s || b.then)}</span>${s && s !== b.then ? `<span class="f">${fmt(b.then)}</span>` : ''}`); }
    if (b.ask){ const s = lab(sid, 'ask', key); h.push(`<span class="task ask">👤 ${fmt(s || b.ask)}</span>${s && s !== b.ask ? `<span class="f">${fmt(b.ask)}</span>` : ''}`); }
    let d = '';
    if (b.out) d = destHTML(sid, b.out);
    else if (b.goText && !b.ans) d = `<span class="pill loop">↻ ${fmt(b.goText)}</span>`;
    else if (!k) d = `<span class="pill cont">↓ 继续</span>`;
    rows.push({depth, reply, cond, h:h.join(''), d});
    if (k) rows.push(...branchRows(sid, k, key, depth + 1, !!b.ans));
  });
  return rows;
}
function branchTable(rows, askFirst){
  return `<div class="br"><div class="th">${askFirst ? '用户回复' : '情况'}</div><div class="th">处理</div><div class="th" style="justify-content:flex-end">去向</div>${rows.map(r =>
    `<div class="c${r.reply ? ' reply' : ''}" style="padding-left:${12 + r.depth * 20}px">${r.cond}</div><div class="h">${r.h}</div><div class="d">${r.d}</div>`).join('')}</div>`;
}

/* ================= 步骤卡片 ================= */
function cardHTML(sid){
  const s = STEPS[sid], sub = sid.includes('.');
  const acts = s.acts.map((a, i) => {
    const k = kidsOf(a), name = lab(sid, 'acts', i) || a.t || a.ask, full = a.t || a.ask;
    const cls = a.ask ? 'ask' : k ? 'decide' : '';
    const kind = a.ask ? '<span class="kind ask">等待回复</span>' : k ? '<span class="kind decide">判断</span>' : '';
    const res = resOf(sid, i).map(r => `<span class="res${r.status === 'proposed' ? ' proposed' : ''}" data-res="${esc(r.path)}" title="${esc(r.title)}"><span class="ic">${RES_IC[r.type]}</span>${esc(r.path.split('/').pop())}</span>`).join('');
    const list = a.list ? `<span class="listbtn" data-list>清单 · ${a.list.length} 项</span>` : '';
    return `<div class="act ${cls}"><div class="idx">${a.ask ? '👤' : i + 1}</div><div>
      <div class="a-head"><span class="a-name click">${fmt(name)}</span>${kind}${list}${res}</div>
      <div class="a-full">${fmt(full)}</div>
      ${a.list ? `<ul class="checklist">${a.list.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : ''}
      ${k ? branchTable(branchRows(sid, k, `${i}`, 0, !!a.ans), !!a.ans) : ''}</div></div>`;
  }).join('');
  const used = usedTags(sid);
  const fin = s.outcomes.filter(o => !used.has(o.tag)).map(o => `<div class="card-f"><span>${o.when ? esc(o.when) : '完成后'}</span>${destHTML(sid, o.tag)}</div>`).join('');
  const rules = s.rules && s.rules.length ? `<div class="rules"><h5>约束</h5><ol>${s.rules.map(r => `<li>${fmt(r.t)}${r.why ? `<span class="why">${fmt(r.why)}</span>` : ''}</li>`).join('')}</ol></div>` : '';
  const card = `<section class="card${sub ? ' sub' : ''}" data-id="${sid}" id="s-${sid}">
    <div class="card-h"><span class="num">${sid}</span><div class="card-t">${esc(s.title)}<span class="vis"></span>${sub ? `<small>步骤 ${parentOf(sid)} 的子步骤</small>` : ''}</div>
      <div class="meta">${s.rules && s.rules.length ? `<button class="chipbtn" data-rules>约束<span class="cnt">${s.rules.length}</span></button>` : ''}</div></div>
    <div class="spec${s.out ? '' : ' one'}"><div><small>输入</small><span>${fmt(s.input)}</span></div>${s.out ? `<div><small>产出</small><span>${fmt(s.out)}</span></div>` : ''}</div>
    ${rules}<div class="note"></div>
    <div class="acts">${acts}</div>${fin}</section>`;
  return card + (s.kids ? `<div class="subgroup"><div class="subgroup-h">步骤 ${sid} 的子步骤</div>${s.kids.map(cardHTML).join('')}</div>` : '');
}
/* ================= 侧栏与概览 ================= */
function renderSide(){
  const steps = allSteps().map(id => `<div class="nav${id.includes('.') ? ' l2' : ''}" data-nav="${id}"><span class="n">${id}</span><span class="t">${esc(STEPS[id].title)}</span></div>`).join('');
  const ends = allOutcomes().filter(x => x.o.to === 'end' || ['exit','fail'].includes(x.o.kind))
    .sort((a, b) => (b.o.to === 'end') - (a.o.to === 'end'))
    .map(({sid, o}) => `<div class="nav" data-line="${sid}/${o.tag}"><span class="dot" style="background:var(--${o.to === 'end' ? 'green' : o.kind === 'fail' ? 'red' : 'blue'})"></span><span class="t">${o.to === 'end' ? '交付' : esc(o.tag)}</span><span class="r">步骤 ${sid}</span></div>`).join('');
  const loops = allOutcomes().filter(x => ['back','jump'].includes(x.o.kind))
    .map(({sid, o}) => `<div class="nav" data-line="${sid}/${o.tag}"><span class="dot" style="background:var(--${o.kind === 'back' ? 'amber' : 'violet'})"></span><span class="t">${esc(o.tag)}</span><span class="r">${sid} → ${o.to}</span></div>`).join('');
  const res = RESOURCES.map(r => `<div class="nav" data-res="${esc(r.path)}"><span>${RES_IC[r.type]}</span><span class="t mono">${esc(r.path)}</span></div>`).join('');
  $('#side').innerHTML = `<h6>步骤</h6>${steps}<h6>终点</h6>${ends}<h6>回退与转到</h6>${loops}<h6>引用的资源</h6>${res}`;
}
function renderSummary(){
  const outs = allOutcomes();
  let asks = 0; Object.keys(STEPS).forEach(sid => { STEPS[sid].acts.forEach(a => { if (a.ask) asks++; }); walkBranches(sid, b => { if (b.ask) asks++; }); });
  const stat = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;
  $('#summary').innerHTML = stat(allSteps().length, '个步骤') + stat(asks, '处等待用户') +
    stat(`${outs.filter(x => x.o.to === 'end').length} / ${outs.filter(x => ['exit','fail'].includes(x.o.kind)).length}`, '交付 / 提前结束') + stat(RESOURCES.length, '个引用资源');
}

/* ================= 文字版（与其他版本相同） ================= */
function routeText(o){
  if (o.kind === 'fail' || o.kind === 'exit') return o.res;
  if (o.to === 'end') return o.res || '结束并交付 ' + TERMS.end.sub;
  if (o.kind === 'back') return `回到步骤 ${o.to} ${o.res}`;
  return `进入步骤 ${o.to}`;
}
function branchLines(sid, list, ind){
  return list.map(b => {
    const p = [], k = kidsOf(b);
    if (b.then) p.push(b.then);
    if (b.ask) p.push(b.ans ? `${b.ask}，等待回复` : `${b.ask}，等待回复后${b.goText || '继续'}`);
    else if (b.goText) p.push(b.goText);
    if (b.out) p.push(routeText(outcome(sid, b.out)));
    const line = `${ind}- 如果${b.when}，${p.join('，')}${k ? '：' : '。'}`;
    return k ? line + '\n' + branchLines(sid, k, ind + '  ') : line;
  }).join('\n');
}
function stepText(sid, level){
  const s = STEPS[sid]; const paras = []; let buf = '';
  s.acts.forEach(a => {
    const sentence = a.ask ? `${a.ask}，等待回复` : a.t, k = kidsOf(a);
    if (a.para && buf){ paras.push(buf); buf = ''; }
    if (a.list){ paras.push(buf + sentence + '：\n' + a.list.map(x => `- ${x}。`).join('\n')); buf = ''; }
    else if (k){ paras.push(buf + sentence + '：\n' + branchLines(sid, k, '')); buf = ''; }
    else buf += sentence + '。';
  });
  const used = usedTags(sid), rest = s.outcomes.filter(o => !used.has(o.tag) && !OFF(o.kind) || !used.has(o.tag) && o.when);
  if (rest.length === 1 && !rest[0].when){ const tail = `完成后${routeText(rest[0])}。`; if (buf) buf += tail; else paras.push(tail); }
  if (buf) paras.push(buf);
  rest.filter(o => o.when).forEach(o => paras.push(`如果${o.when}，${routeText(o)}。`));
  if (s.rules && s.rules.length) paras.push('要求：\n' + s.rules.map(r => `- ${r.t}${r.why ? '，' + r.why : ''}。`).join('\n'));
  let out = `${'#'.repeat(level)} 步骤 ${sid}：${s.title}\n\n${paras.join('\n\n')}`;
  if (s.kids) out += '\n\n' + s.kids.map(k => stepText(k, level + 1)).join('\n\n');
  return out;
}
function skillText(){
  return [`---\nname: ${FLOW.name}\ndescription: ${FLOW.description}\n---`, `# ${FLOW.name}`, ...FLOW.intro, '## 工作流',
    ...ORDER.filter(id => STEPS[id]).map(id => stepText(id, 3))].join('\n\n');
}

/* ================= 交互 ================= */
function showView(v){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
}
function focusStep(id){
  showView('flow');
  const c = byId(id); if (!c) return;
  c.scrollIntoView({behavior:'smooth', block:'start'});
  c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  document.querySelectorAll('.nav.on').forEach(n => n.classList.remove('on'));
  const n = document.querySelector(`.nav[data-nav="${CSS.escape(id)}"]`); n && n.classList.add('on');
}
function focusLine(id){
  showView('flow');
  const el = byId(id); if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  const row = [el.parentElement, el.parentElement.previousElementSibling, el.parentElement.previousElementSibling && el.parentElement.previousElementSibling.previousElementSibling].filter(Boolean);
  row.forEach(x => x.classList.add('hl')); setTimeout(() => row.forEach(x => x.classList.remove('hl')), 1600);
}
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]')){ $('#drawer').classList.remove('on'); return; }
  const r = t.closest('[data-res]'); if (r){ openRes(r.dataset.res); return; }
  const g = t.closest('.pill.go'); if (g){ focusStep(g.dataset.to); return; }
  const n = t.closest('[data-nav]'); if (n){ focusStep(n.dataset.nav); return; }
  const l = t.closest('[data-line]'); if (l){ focusLine(l.dataset.line); return; }
  const rb = t.closest('[data-rules]'); if (rb){ const box = rb.closest('.card').querySelector(':scope > .rules'); box.classList.toggle('on'); rb.classList.toggle('on'); return; }
  const lb = t.closest('[data-list]'); if (lb){ lb.closest('.act').querySelector('.checklist').classList.toggle('on'); return; }
  const an = t.closest('.a-name.click'); if (an){ an.closest('.act').classList.toggle('open'); return; }
});
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showView(t.dataset.view));
$('#detailSw').onclick = () => { $('#detailSw').classList.toggle('on'); document.body.classList.toggle('detail'); };

/* ================= 示例走查 ================= */
let cur = null, idx = 0;
function apply(scroll = true){
  document.querySelectorAll('.card.visited,.card.cur').forEach(c => c.classList.remove('visited', 'cur'));
  document.querySelectorAll('.vis').forEach(v => v.innerHTML = '');
  document.querySelectorAll('.br .hl').forEach(x => x.classList.remove('hl'));
  $('#shell').classList.toggle('scen', !!cur);
  const bn = $('#banner');
  if (!cur){ bn.classList.remove('on'); $('#prev').disabled = $('#next').disabled = true; return; }
  const path = SCENARIOS[cur].path;
  path.forEach(([id], j) => { if (id.includes('/')) return; const c = byId(id); c.classList.add('visited'); const p = parentOf(id); if (p) byId(p).classList.add('visited');
    c.querySelector('.vis').insertAdjacentHTML('beforeend', `<span>${j + 1}</span>`); });
  const [cid, note] = path[idx], el = byId(cid);
  const card = cid.includes('/') ? el.closest('.card') : el;
  card.classList.add('cur'); card.querySelector(':scope > .note').textContent = note;
  if (cid.includes('/')){ const d = el.parentElement; [d, d.previousElementSibling, d.previousElementSibling.previousElementSibling].forEach(x => x.classList.add('hl')); }
  bn.classList.add('on');
  bn.innerHTML = `<span class="step">第 ${idx + 1} / ${path.length} 步</span><span>请求：“${esc(SCENARIOS[cur].req)}”</span>`;
  $('#prev').disabled = idx === 0; $('#next').disabled = idx === path.length - 1;
  if (scroll) (cid.includes('/') ? el : card).scrollIntoView({behavior:'smooth', block:'center'});
}
$('#scenSel').innerHTML += Object.entries(SCENARIOS).map(([k, s]) => `<option value="${k}">示例走查：${s.name}</option>`).join('');
$('#scenSel').onchange = e => { cur = e.target.value || null; idx = 0; showView('flow'); apply(); };
$('#prev').onclick = () => { if (idx > 0){ idx--; apply(); } };
$('#next').onclick = () => { if (cur && idx < SCENARIOS[cur].path.length - 1){ idx++; apply(); } };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft') $('#prev').click(); if (e.key === 'Escape') $('#drawer').classList.remove('on'); });

/* ================= 明暗切换 ================= */
const THEMES = [['', '◐ 跟随系统'], ['light', '☀ 浅色'], ['dark', '☾ 深色']];
function setTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  $('#themeBtn').textContent = THEMES.find(x => x[0] === t)[1];
  try { localStorage.setItem('skill-flow-theme', t); } catch (e) {}
}
$('#themeBtn').onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || ''; const i = THEMES.findIndex(x => x[0] === cur); setTheme(THEMES[(i + 1) % THEMES.length][0]); };
(() => { let t = ''; try { t = localStorage.getItem('skill-flow-theme') || ''; } catch (e) {}
  const q = new URLSearchParams(location.search).get('theme'); if (q === 'light' || q === 'dark') t = q;
  setTheme(t); })();

/* ================= 启动 ================= */
$('#skillName').textContent = FLOW.name;
$('#skillDesc').textContent = FLOW.description;
occ = {}; $('#cards').innerHTML = ORDER.filter(id => STEPS[id]).map(cardHTML).join('<div class="link"></div>') + `<div class="link"></div><div class="endcard"><b>✓ 交付</b><span>${esc(TERMS.end.sub)}</span></div>`;
renderSide(); renderSummary(); renderFiles(); validate();
$('#wf').textContent = skillText();
(() => {
  const h = location.hash;
  if (h === '#files') showView('files');
  if (h === '#text') showView('text');
  if (h === '#detail') $('#detailSw').click();
  if (h.startsWith('#res=')) openRes(decodeURIComponent(h.slice(5)));
  const m = h.match(/^#(\w+):(\d+)$/);
  if (m && SCENARIOS[m[1]]){ cur = m[1]; idx = +m[2] - 1; $('#scenSel').value = cur; }
  apply(false);
})();
</script>
</body>
