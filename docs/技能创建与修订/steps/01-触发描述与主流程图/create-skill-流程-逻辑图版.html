<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>create-skill 逻辑图</title>
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1f2a24; --muted:#67756c; --line:#d8dfdb; --soft:#f1f4f2; --spine:#b9d3c3;
  --green:#2f7d4f; --green-ink:#1f5c39; --green-soft:#e6f3ea;
  --amber:#a8670a; --amber-soft:#fdf2df; --red:#b4372f; --red-soft:#fbe8e6;
  --blue:#2d5f9a; --blue-soft:#e6eef8; --violet:#6a4fb0; --violet-soft:#efeafb;
  --dec:#5b4a9a; --dec-soft:#f1eefa; --hl:#fff1b8; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --panel:#1a201c; --ink:#dfe7e2; --muted:#93a198; --line:#2d3631; --soft:#1f2621; --spine:#2f5a41;
    --green:#5bbd82; --green-ink:#a3dcb8; --green-soft:#1a2c21;
    --amber:#e2a24c; --amber-soft:#2d2414; --red:#e8776d; --red-soft:#351b19;
    --blue:#82abe0; --blue-soft:#1a2534; --violet:#b39df0; --violet-soft:#241f33;
    --dec:#c2b3f5; --dec-soft:#231f33; --hl:#3a3420; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201c; --ink:#dfe7e2; --muted:#93a198; --line:#2d3631; --soft:#1f2621; --spine:#2f5a41;
  --green:#5bbd82; --green-ink:#a3dcb8; --green-soft:#1a2c21;
  --amber:#e2a24c; --amber-soft:#2d2414; --red:#e8776d; --red-soft:#351b19;
  --blue:#82abe0; --blue-soft:#1a2534; --violet:#b39df0; --violet-soft:#241f33;
  --dec:#c2b3f5; --dec-soft:#231f33; --hl:#3a3420; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
.page{max-width:1080px;margin:0 auto;padding:22px 22px 80px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:2px 0 12px;font-size:13.5px}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:2px 11px}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)} .seg button:last-child{border-right:0}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.4;cursor:default}
.valid{font-size:12.5px;padding:1px 10px;border-radius:999px;border:1px solid var(--green);color:var(--green-ink);background:var(--green-soft)}
.valid.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.sp{flex:1}
.lbl{font-size:12.5px;color:var(--muted)}
.issues{margin:0 0 10px;padding:6px 12px 6px 28px;background:var(--red-soft);color:var(--red);display:none;border-radius:8px}

/* 去向标记 */
.to{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;border:1.5px solid;white-space:nowrap;cursor:pointer;line-height:1.5}
.to.next,.to.sub{color:var(--green-ink);border-color:var(--green);background:var(--green-soft)}
.to.back{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.to.jump{color:var(--violet);border-color:var(--violet);background:var(--violet-soft)}
.to.exit{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.to.fail{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.to.cont{color:var(--muted);border-color:var(--line);background:var(--panel);cursor:default;font-weight:600}
.to.loop{color:var(--green-ink);border:1.5px dashed var(--green);background:var(--panel);cursor:default}
.to:not(.cont):not(.loop):hover{box-shadow:0 0 0 3px var(--line)}
.why-to{color:var(--muted);font-size:12px;margin-left:4px}

/* 骨架条 */
.skel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:18px}
.skel h3{font-size:12.5px;color:var(--muted);margin:0 0 8px;font-weight:700}
.track{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{display:inline-flex;flex-direction:column;align-items:flex-start;border:1.5px solid var(--green);border-radius:10px;padding:2px 10px;background:var(--panel);cursor:pointer;line-height:1.35}
.pill b{font-size:11.5px;color:var(--green-ink)} .pill span{font-size:12.5px}
.pill:hover{background:var(--green-soft)}
.pill.term{background:var(--green);color:#fff;border-color:var(--green);border-radius:999px;padding:4px 12px}
.pill.term b{color:#fff}
.alt{display:inline-flex;flex-direction:column;gap:4px;border-left:2px solid var(--spine);border-right:2px solid var(--spine);border-radius:8px;padding:2px 6px}
.ar{color:var(--muted)}
.ends{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:12.5px;align-items:center}
.ends .k{color:var(--muted);font-weight:650}
.ends .v{display:flex;flex-wrap:wrap;gap:4px 8px}

/* 步骤卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow);scroll-margin:16px}
.card > .hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 16px 6px}
.sno{font-weight:700;font-size:12.5px;color:#fff;background:var(--green);border-radius:6px;padding:1px 8px}
.ttl{font-weight:700;font-size:16px}
.tag-nest{font-size:11.5px;border-radius:999px;padding:0 8px;background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.rbtn{margin-left:auto;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted);cursor:pointer;background:var(--soft)}
.rbtn:hover{color:var(--ink)}
.vis{display:inline-flex;gap:3px}
.vis span{background:var(--blue);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.sig{padding:0 16px 8px;font-size:12.8px;color:var(--muted)}
.sig b{color:var(--ink);font-weight:600}
.rules{display:none;margin:0 16px 10px;padding:8px 12px;background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;font-size:13px}
.rules.open{display:block}
.rules ul{margin:0;padding-left:18px} .rules li{margin:2px 0}
.rules .why{color:var(--muted);font-size:12px}

/* 主干 */
.spine{position:relative;margin:2px 16px 14px 30px;padding-left:22px;border-left:2px solid var(--spine)}
.it{position:relative;margin:0 0 10px}
.it::before{content:"";position:absolute;left:-29px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--green)}
.it.decide::before{border-radius:2px;transform:rotate(45deg);border-color:var(--dec);background:var(--dec-soft)}
.it.ask::before{border-color:var(--amber);background:var(--amber-soft)}
.it.end::before{background:var(--green);border-color:var(--green)}
.nd{display:inline-block;border:1.5px solid var(--line);border-radius:9px;padding:3px 11px;background:var(--panel);cursor:pointer;max-width:100%}
.nd:hover{border-color:var(--green)}
.nd .no{color:var(--green-ink);font-weight:700;margin-right:5px}
.nd .short{font-weight:650}
.nd .full{display:none;font-weight:400;color:var(--ink);font-size:13.2px;margin-top:2px}
.nd.open .full,body.detail .nd .full{display:block}
.nd .more{color:var(--muted);font-size:11px;margin-left:6px}
.nd.open .more,body.detail .nd .more{display:none}
.decide > .nd{border-color:var(--dec);background:var(--dec-soft)}
.decide > .nd .short::before{content:"◇ ";color:var(--dec)}
.nd.askn{border:1.5px dashed var(--amber);background:var(--amber-soft)}
.nd.askn .short::before{content:"👤 ";}
.nd.small{padding:1px 9px;font-size:13px;border-radius:8px}
.lstb{display:inline-block;margin-left:8px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 9px;cursor:pointer;background:var(--soft)}
.lst{display:none;margin:6px 0 0;padding:6px 12px 6px 28px;background:var(--soft);border-radius:8px;font-size:13px}
.lst.open,body.detail .lst{display:block}

/* 分支行：如果［条件］→ 做什么 → 去哪里 */
.rows{margin:6px 0 2px 6px}
.row{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 0 3px 18px}
.row::before{content:"";position:absolute;left:0;top:15px;width:12px;border-top:2px solid var(--line)}
.rows{border-left:2px solid var(--line);padding-left:0}
.cond{font-size:12.8px;font-weight:650;color:var(--dec);background:var(--dec-soft);border-radius:6px;padding:1px 8px;cursor:pointer}
.cond .cf{display:none;font-weight:400}
.cond.open .cs,body.detail .cond .cs{display:none}
.cond.open .cf,body.detail .cond .cf{display:inline}
.arrow{color:var(--muted);font-size:12px}
.sub-rows{width:100%;margin:2px 0 2px 26px}
.flash{animation:flash 1.3s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:none}}
.cur{box-shadow:0 0 0 3px var(--blue)!important}
.layout.scen .card:not(.visited){opacity:.4}
.note{display:none;margin:0 16px 10px;background:var(--blue-soft);border-left:3px solid var(--blue);padding:5px 10px;border-radius:6px;font-size:13px}
.note::before{content:"本例：";font-weight:700;color:var(--blue)}
.card.curcard > .note{display:block}
.kids{margin:0 16px 14px 30px;padding-left:16px;border-left:2px dashed var(--line)}
.kids-hd{font-size:12px;color:var(--muted);font-weight:650;margin:0 0 8px}
.kids .card{box-shadow:none}
code{font:12.5px "SF Mono",Menlo,monospace;background:var(--soft);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.endcap{display:flex;justify-content:flex-start;margin:4px 0 16px}
.endcap .pill{cursor:default}

#textView{display:none}
#wf{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;white-space:pre-wrap;font:13.5px/1.75 "SF Mono",Menlo,"PingFang SC",monospace;margin:0}
body.text #textView{display:block} body.text #graphView,body.text .viewctl,body.text .scen{display:none}
</style>
</head>
<body>
<div class="page">
  <h1>create-skill</h1>
  <div class="sub" id="desc"></div>
  <div class="top">
    <span class="seg"><button data-v="graph" class="on">逻辑图</button><button data-v="text">文字版</button></span>
    <span class="seg viewctl"><button data-m="brief" class="on">简洁</button><button data-m="detail">显示完整文字</button></span>
    <span class="valid" id="valid"></span>
    <span class="sp"></span>
    <span class="scen"><span class="lbl">示例走查</span> <span id="scenBtns"></span> <button id="prev">◀</button> <button id="next">▶</button></span>
  </div>
  <ul class="issues" id="issues"></ul>
  <div id="graphView">
    <section class="skel" id="skel"></section>
    <div class="layout" id="layout"></div>
  </div>
  <div id="textView"><pre id="wf"></pre></div>
</div>
<script>
const FLOW = {
  name:'create-skill',
  description:'当用户需要创建新的 skill，或修改已有 skill 的触发条件、执行流程或规则时使用。',
  intro:['把用户的需求或一个已有的 skill，做成 Agent 能直接照着执行的 skill。先弄清用户真正要什么，再画出 skill 的流程图请用户确认，最后按流程图写成 SKILL.md 并检查。用户确认过的流程图是唯一依据：正文与流程图不一致时，以流程图为准。',
         '用户给出的通常只是一条主线，你要把它补成一份完整、可执行的 skill。每一步要写清：从哪里拿输入，可能出现哪些情况，每种情况去哪里，哪里需要用户参与，什么时候结束。你补出来的内容要明确标出来，让用户能看到、能核对，不要等用户逐条指出。'],
};
const STEPS = {
  '1': {title:'明确要开发什么样的 skill', input:'用户请求、相关对话和用户提供的材料',
    acts:[{t:'先收集材料：读完用户的请求和相关对话，用户提供的文档、示例和现有做法也要完整读取'},
          {t:'然后判断用户的真实意图', br:[
            {when:'用户要修订已有的 skill（点名了某个 skill、给出了路径，或说“刚才那个”）', out:'修订'},
            {when:'用户要新建，但这个需求不适合做成 skill', ask:'向用户说明原因并推荐更合适的做法', ans:[
              {when:'用户接受建议', out:'改用其他方式'},
              {when:'用户仍要做成 skill', out:'新建'}]},
            {when:'用户要新建，并且适合做成 skill', out:'新建'}]}],
    rules:[{t:'以下需求不适合做成 skill：只做一次的任务，直接完成即可；只适用于某个项目的约定，写进项目说明文件，如 CLAUDE.md 或 AGENTS.md；需要在某个事件发生时自动执行的行为，用 hook 配置；能用脚本或校验规则强制执行的机械约束，写成脚本或校验'}],
    outcomes:[{tag:'修订', kind:'sub', to:'1.1'}, {tag:'新建', kind:'sub', to:'1.2'},
              {tag:'改用其他方式', kind:'exit', res:'按建议处理，结束本次任务'}],
    kids:['1.1','1.2','1.3']},
  '1.1': {title:'找到并读懂要修订的 skill', input:'用户请求',
    acts:[{t:'在个人 skill 目录、当前项目的 skill 目录和已安装的插件中，查找要修订的 skill', br:[
            {when:'用户的描述对应多个 skill，或一个都对不上', ask:'列出最接近的候选请用户指认', goText:'重新查找'},
            {when:'确实没有这个 skill', ask:'告诉用户，并询问是否改为新建', ans:[
              {when:'用户同意', out:'改为新建'},
              {when:'用户不同意', out:'不再修订'}]},
            {when:'找到了', then:'完整读取它的 SKILL.md、引用的文件和脚本，以及同目录下的流程图 `flow.html`（如果有）'}]},
          {t:'确定要修改的文件', br:[
            {when:'找到的 skill 位于插件缓存等由别人维护的位置', ask:'说明直接修改会在插件更新时被覆盖，给出“复制到个人 skill 目录后再改”和“仍在原处改”两个选项，推荐前者', goText:'按用户的选择确定'},
            {when:'它位于个人或项目的 skill 目录', then:'直接修改原文件'}]},
          {t:'然后把用户的修改要求落到具体行为上：写清这个 skill 现在会怎样、改完应该怎样，并找一个能复现现状的具体请求'}],
    out:'原 skill 的内容、要修改的文件、现状 → 期望、复现请求',
    rules:[{t:'只依据读到的原文理解现有 skill，不要凭记忆或摘要', why:'否则容易误判要改的范围'}],
    outcomes:[{tag:'修订依据就绪', kind:'next', to:'1.3'},
              {tag:'改为新建', kind:'jump', to:'1.2', res:'改走新建路径', lane:0},
              {tag:'不再修订', kind:'exit', res:'结束本次任务'}]},
  '1.2': {title:'确认新 skill 的定位', input:'用户请求',
    acts:[{t:'在已安装的 skill 中查找用途相近的', br:[
            {when:'找到了', ask:'说明它们和这次需求的异同，给出“修订已有的”和“新建”两个选项并标出推荐', ans:[
              {when:'用户选修订', out:'改为修订'},
              {when:'用户选新建', then:'继续本步'}]},
            {when:'没有找到', then:'继续本步'}]},
          {t:'确定新 skill 存放在哪里', br:[
            {when:'用户已经指明', then:'按用户说的'},
            {when:'当前项目已有存放 skill 的约定', then:'按约定'},
            {when:'都没有', ask:'询问用户，推荐只在本项目用的放项目目录，跨项目用的放个人目录', goText:'按回复确定'}]}],
    out:'确认要新建，以及存放位置',
    outcomes:[{tag:'定位已确认', kind:'next', to:'1.3'},
              {tag:'改为修订', kind:'jump', to:'1.1', res:'改走修订路径', lane:1}]},
  '1.3': {title:'核对需求是否完整', input:'步骤 1.1 或 1.2 的产出、对话和材料',
    acts:[{t:'对照下面的清单逐项核对。能从对话、材料、项目文件或原 skill 中找到答案的，直接补上，不要拿去问用户', list:[
            '解决什么问题：这个 skill 要解决的问题，以及没有它时 AI 通常会怎么做错',
            '什么时候用：谁会在什么情况下用它，哪些相近的请求不该触发它',
            '输入和交付：它拿到什么输入，交付什么结果，做到什么程度算完成',
            '具体实例：至少一个真实的输入和期望的结果；修订时还要有能复现现状的请求',
            '约束：必须遵守或不能做的事，可以使用的工具和环境',
            '用户参与：哪些地方需要用户提供信息或做确认']},
          {t:'根据核对结果', br:[
            {when:'还有会影响流程走向的点不清楚', ask:'把这些点一次性问用户。每个问题说明你目前的理解，给出 2～3 个可选答案并标出推荐项；用户没给实例时，自拟一个放进问题里请用户确认', goText:'补全理解，再核对一遍'},
            {when:'剩下的都不影响流程走向', then:'按最合理的方式自行补全，记下你的选择', out:'需求明确'}]}],
    out:'需求摘要',
    rules:[{t:'提问要集中，一次问清，不要零碎地反复追问'}],
    outcomes:[{tag:'需求明确', kind:'next', to:'2'}]},
  '2': {title:'生成或更新流程图', nest:'画的是目标 skill', input:'需求摘要、具体实例；修订时还有原 skill 和已有流程图',
    acts:[{t:'按 `references/flowchart.md` 的规则，生成或更新目标 skill 的流程图，保存为 skill 目录下的 `flow.html`', br:[
            {when:'是新建', then:'以实例为线索，从输入一路推到交付结果，画出主线。再挑一两个会走不同路线的情况推一遍，例如输入缺失、中途失败、用户否决，把分支补上'},
            {when:'是修订', then:'在已有流程图上修改。没有流程图时，先把原 SKILL.md 如实还原成流程图，标出原文含糊或自相矛盾的地方，再只改受影响的部分，并在图上标出改动'}]},
          {t:'流程图顶部写名称、触发描述、一句话用途，以及步骤 1 得到的需求摘要。每个步骤写清输入、动作、产出、可能的结果和各自的去向。画的时候，主动补全用户没有说到的部分', list:[
            '每个输入从哪里来，拿不到时怎么办',
            '动作失败或得到意外结果时去哪里',
            '需要用户参与的地方，以及用户每种回复的去向',
            '每个循环回到哪里、什么时候结束。可能反复多次的，写明最多几次，超过后怎么办',
            '异常结束时告诉用户什么，留下什么']},
          {t:'补全时遇到拿不准的地方，分两类处理', br:[
            {when:'是方向性的问题，也就是有几种合理做法、选哪种结果明显不同', ask:'向用户提问：说明问题和取舍，给出 2～3 个建议做法并标出推荐项', goText:'按用户的选择画进图里'},
            {when:'只是局部细节', then:'自行决定，并在图上标出你的选择，留给用户检查时一并核对'}]},
          {t:'画完后先自查：每个结果都有去向，每个步骤从开始都走得到，每个循环都有退出条件，用实例沿着图走一遍能到达期望结果。发现问题先改好'},
          {para:true, ask:'然后把流程图交给用户检查：告诉用户文件位置，概括主线、关键判断和你自行决定的细节；修订时说明改了哪里', ans:[

/* =================== 工具 =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const CIRC = '①②③④⑤⑥⑦⑧⑨';
const OFF = k => ['back','fail','jump','exit'].includes(k);
const outcome = (sid, tag) => STEPS[sid].outcomes.find(o => o.tag === tag);
const kidsOf = b => b.ans || b.br;
const byId = id => document.querySelector(`[data-id="${CSS.escape(id)}"]`);
function walkBranches(sid, fn){
  const walk = (list, path) => (list || []).forEach(b => { fn(b, [...path, b.when]); walk(kidsOf(b), [...path, b.when]); });
  STEPS[sid].acts.forEach(a => walk(kidsOf(a), []));
}
const usedTags = sid => { const u = new Set(); walkBranches(sid, b => b.out && u.add(b.out)); return u; };
const lab = (sid, type, key) => (LABELS[sid] && LABELS[sid][type] && LABELS[sid][type][key]) || null;

function validate(){
  const issues = [];
  for (const [sid, s] of Object.entries(STEPS)){
    walkBranches(sid, b => { if (b.out && !outcome(sid, b.out)) issues.push(`步骤 ${sid} 引用了未定义的结果「${b.out}」`); });
    for (const o of s.outcomes){
      if (o.to && o.to !== 'end' && !STEPS[o.to]) issues.push(`步骤 ${sid} 指向不存在的步骤 ${o.to}`);
      if (OFF(o.kind) && !o.res) issues.push(`步骤 ${sid} 的「${o.tag}」没写之后做什么`);
    }
    s.acts.forEach((a, i) => { if (!lab(sid, 'acts', i)) issues.push(`步骤 ${sid} 的动作 ${i + 1} 缺少简短名称`); });
  }
  const seen = new Set(), stack = ['1'];
  while (stack.length){ const id = stack.pop(); if (seen.has(id) || !STEPS[id]) continue; seen.add(id); STEPS[id].outcomes.forEach(o => o.to && stack.push(o.to)); }
  Object.keys(STEPS).filter(id => !seen.has(id)).forEach(id => issues.push(`步骤 ${id} 从开始走不到`));
  const v = $('#valid');
  v.textContent = issues.length ? `校验：${issues.length} 个问题` : '校验：✔ 每条路都有去处，每一步都走得到';
  v.classList.toggle('bad', !!issues.length);
  const ul = $('#issues'); ul.innerHTML = issues.map(i => `<li>${esc(i)}</li>`).join(''); ul.style.display = issues.length ? 'block' : 'none';
}

/* =================== 去向标记 =================== */
let occ = {};
function toHTML(sid, tag){
  const o = outcome(sid, tag), key = `${sid}/${tag}`;
  occ[key] = (occ[key] || 0) + 1;
  const id = occ[key] > 1 ? `${key}@${occ[key]}` : key;
  let t, why = '';
  if (o.kind === 'fail'){ t = '✖ 终止'; why = o.res; }
  else if (o.kind === 'exit'){ t = '⇥ 结束'; why = o.res; }
  else if (o.to === 'end'){ t = '✔ 交付，结束'; }
  else if (o.kind === 'back'){ t = `↺ 回到步骤 ${o.to}`; why = o.res; }
  else if (o.kind === 'jump'){ t = `↪ 转到步骤 ${o.to}`; }
  else t = `→ 步骤 ${o.to}`;
  return `<span class="to ${o.kind}" data-id="${id}" data-to="${o.to && o.to !== 'end' ? o.to : ''}" title="${esc(o.res || '')}">${t}</span>${why ? `<span class="why-to">${fmt(why)}</span>` : ''}`;
}
const nodeHTML = (short, full, cls = '') => `<span class="nd ${cls}">${short ? `<span class="short">${fmt(short)}</span>${full && full !== short ? '<span class="more">▸</span>' : ''}` : `<span class="short">${fmt(full)}</span>`}${short && full && full !== short ? `<span class="full">${fmt(full)}</span>` : ''}</span>`;
const condHTML = (short, full) => `<span class="cond">如果 <span class="cs">${fmt(short || full)}</span><span class="cf">${fmt(full)}</span></span>`;
const ARROW = '<span class="arrow">→</span>';

/* 一行分支：如果［条件］→ 做什么 → 去哪里；回复分支缩进在下面 */
function rowsHTML(sid, list, path, isReply){
  return `<div class="rows">${list.map((b, i) => {
    const key = path ? `${path}.${i}` : `${i}`;
    const seq = [];
    if (b.then && b.then !== '继续本步') seq.push(nodeHTML(lab(sid, 'then', key), b.then, 'small'));
    if (b.ask) seq.push(nodeHTML(lab(sid, 'ask', key), b.ask, 'small askn'));
    if (b.goText && !b.ans) seq.push(`<span class="to loop">↻ ${fmt(b.goText)}</span>`);
    if (b.out) seq.push(toHTML(sid, b.out));
    const k = kidsOf(b);
    if (!b.out && !b.goText && !k) seq.push('<span class="to cont">↓ 继续本步</span>');
    const label = lab(sid, isReply ? 'ans' : 'br', key);
    return `<div class="row">${isReply ? `<span class="cond">用户：<span class="cs">${fmt(label || b.when)}</span><span class="cf">${fmt(b.when)}</span></span>` : condHTML(label, b.when)}${seq.length ? ARROW + seq.join(ARROW) : ''}${k ? `<div class="sub-rows">${rowsHTML(sid, k, key, !!b.ans)}</div>` : ''}</div>`;
  }).join('')}</div>`;
}
function cardHTML(sid){
  const s = STEPS[sid];
  const items = s.acts.map((a, i) => {
    const short = lab(sid, 'acts', i), k = kidsOf(a);
    const cls = a.ask ? 'ask' : k ? 'decide' : '';
    const nd = `<span class="nd ${a.ask ? 'askn' : ''}"><span class="no">${CIRC[i]}</span><span class="short">${fmt(short || a.t || a.ask)}</span><span class="more">▸</span><span class="full">${fmt(a.t || a.ask)}</span></span>`;
    const list = a.list ? `<span class="lstb">清单 ${a.list.length} 项</span><ul class="lst">${a.list.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : '';
    const rows = k ? rowsHTML(sid, k, `${i}`, !!a.ans) : '';
    return `<div class="it ${cls}">${nd}${list}${rows}</div>`;
  }).join('');
  const used = usedTags(sid);
  const ends = s.outcomes.filter(o => !used.has(o.tag)).map(o => `<div class="it end"><span class="lbl">${o.when ? esc(o.when) : '完成后'}</span> ${toHTML(sid, o.tag)}</div>`).join('');
  const rules = s.rules && s.rules.length ? `<div class="rules"><ul>${s.rules.map(r => `<li>${fmt(r.t)}${r.why ? `<span class="why">（${fmt(r.why)}）</span>` : ''}</li>`).join('')}</ul></div>` : '';
  const kids = s.kids ? `<div class="kids"><div class="kids-hd">子步骤</div>${s.kids.map(cardHTML).join('')}</div>` : '';
  return `<section class="card" data-id="${sid}" id="s-${sid}">
    <div class="hd"><span class="sno">步骤 ${sid}</span><span class="ttl">${esc(s.title)}</span>${s.nest ? `<span class="tag-nest">嵌套：${esc(s.nest)}</span>` : ''}<span class="vis"></span>${rules ? `<span class="rbtn">约束 ${s.rules.length} ▸</span>` : ''}</div>
    <div class="sig"><b>输入</b> ${fmt(s.input)}${s.out ? `　→　<b>产出</b> ${fmt(s.out)}` : ''}</div>
    ${rules}<div class="note"></div>
    <div class="spine">${items}${ends}</div>${kids}</section>`;
}

/* =================== 骨架条 =================== */
function renderSkel(){
  const pill = id => `<span class="pill" data-go="${id}"><b>步骤 ${id}</b><span>${esc(STEPS[id].title)}</span></span>`;
  const AR = '<span class="ar">→</span>';
  const track = [`<span class="pill term"><b>开始</b></span>`];
  ORDER.filter(id => STEPS[id]).forEach(id => {
    const s = STEPS[id];
    track.push(pill(id));
    if (s.kids){
      const alts = s.kids.filter(k => s.outcomes.some(o => o.to === k && o.kind === 'sub'));
      const rest = s.kids.filter(k => !alts.includes(k));
      track.push(`<span class="alt">${alts.map(pill).join('')}</span>`);
      rest.forEach(k => track.push(pill(k)));
    }
  });
  track.push(`<span class="pill term"><b>交付，结束</b></span>`);
  const all = Object.entries(STEPS).flatMap(([sid, s]) => s.outcomes.map(o => ({sid, o})));
  const chip = ({sid, o}, t) => `<span class="to ${o.kind}" data-line="${sid}/${o.tag}">${t}</span>`;
  const loops = all.filter(x => ['back','jump'].includes(x.o.kind)).map(x => chip(x, `${x.o.kind === 'back' ? '↺' : '↪'} ${x.sid} → ${x.o.to}　${x.o.tag}`)).join('');
  const ends = all.filter(x => x.o.to === 'end').map(x => chip(x, `✔ 交付　步骤 ${x.sid}`)).concat(
               all.filter(x => ['exit','fail'].includes(x.o.kind)).map(x => chip(x, `${x.o.kind === 'fail' ? '✖' : '⇥'} ${x.o.tag}　步骤 ${x.sid}`))).join('');
  $('#skel').innerHTML = `<h3>骨架：主线从左到右，点任一步跳过去</h3><div class="track">${track.join(AR)}</div>
    <div class="ends"><span class="k">所有终点</span><span class="v">${ends}</span><span class="k">回退与转到</span><span class="v">${loops}</span></div>`;
}
function render(){
  occ = {};
  $('#desc').innerHTML = `触发：${esc(FLOW.description)}`;
  $('#layout').innerHTML = ORDER.filter(id => STEPS[id]).map(cardHTML).join('') + `<div class="endcap"><span class="pill term"><b>交付，结束</b>&nbsp;${esc(TERMS.end.sub)}</span></div>`;
  renderSkel();
}

/* =================== 文字版（与其他版本相同） =================== */
function routeText(o){
  if (o.kind === 'fail' || o.kind === 'exit') return o.res;
  if (o.to === 'end') return o.res || '结束并交付 ' + TERMS.end.sub;
  if (o.kind === 'back') return `回到步骤 ${o.to} ${o.res}`;
  return `进入步骤 ${o.to}`;
}
function branchLines(sid, list, ind){
  return list.map(b => {
    const p = [], k = kidsOf(b);
    if (b.then) p.push(b.then);
    if (b.ask) p.push(b.ans ? `${b.ask}，等待回复` : `${b.ask}，等待回复后${b.goText || '继续'}`);
    else if (b.goText) p.push(b.goText);
    if (b.out) p.push(routeText(outcome(sid, b.out)));
    const line = `${ind}- 如果${b.when}，${p.join('，')}${k ? '：' : '。'}`;
    return k ? line + '\n' + branchLines(sid, k, ind + '  ') : line;
  }).join('\n');
}
function stepText(sid, level){
  const s = STEPS[sid]; const paras = []; let buf = '';
  s.acts.forEach(a => {
    const sentence = a.ask ? `${a.ask}，等待回复` : a.t, k = kidsOf(a);
    if (a.para && buf){ paras.push(buf); buf = ''; }
    if (a.list){ paras.push(buf + sentence + '：\n' + a.list.map(x => `- ${x}。`).join('\n')); buf = ''; }
    else if (k){ paras.push(buf + sentence + '：\n' + branchLines(sid, k, '')); buf = ''; }
    else buf += sentence + '。';
  });
  const used = usedTags(sid), rest = s.outcomes.filter(o => !used.has(o.tag) && !OFF(o.kind) || !used.has(o.tag) && o.when);
  if (rest.length === 1 && !rest[0].when){ const tail = `完成后${routeText(rest[0])}。`; if (buf) buf += tail; else paras.push(tail); }
  if (buf) paras.push(buf);
  rest.filter(o => o.when).forEach(o => paras.push(`如果${o.when}，${routeText(o)}。`));
  if (s.rules && s.rules.length) paras.push('要求：\n' + s.rules.map(r => `- ${r.t}${r.why ? '，' + r.why : ''}。`).join('\n'));
  let out = `${'#'.repeat(level)} 步骤 ${sid}：${s.title}\n\n${paras.join('\n\n')}`;
  if (s.kids) out += '\n\n' + s.kids.map(k => stepText(k, level + 1)).join('\n\n');
  return out;
}
function skillText(){
  return [`---\nname: ${FLOW.name}\ndescription: ${FLOW.description}\n---`, `# ${FLOW.name}`, ...FLOW.intro, '## 工作流',
    ...ORDER.filter(id => STEPS[id]).map(id => stepText(id, 3))].join('\n\n');
}

/* =================== 交互 =================== */
function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
document.addEventListener('click', e => {
  const t = e.target.closest('.to[data-to]'); if (t && t.dataset.to){ const c = byId(t.dataset.to); c.scrollIntoView({behavior:'smooth', block:'start'}); flash(c); return; }
  const g = e.target.closest('[data-go]'); if (g){ const c = byId(g.dataset.go); c.scrollIntoView({behavior:'smooth', block:'start'}); flash(c); return; }
  const l = e.target.closest('[data-line]'); if (l){ const c = byId(l.dataset.line); c.scrollIntoView({behavior:'smooth', block:'center'}); flash(c); return; }
  const r = e.target.closest('.rbtn'); if (r){ const box = r.closest('.card').querySelector(':scope > .rules'); box.classList.toggle('open'); r.textContent = r.textContent.replace(/[▸▾]/, box.classList.contains('open') ? '▾' : '▸'); return; }
  const lb = e.target.closest('.lstb'); if (lb){ lb.nextElementSibling.classList.toggle('open'); return; }
  const c = e.target.closest('.cond'); if (c){ c.classList.toggle('open'); return; }
  const n = e.target.closest('.nd'); if (n){ n.classList.toggle('open'); }
});
document.querySelectorAll('.viewctl button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.viewctl button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('detail', b.dataset.m === 'detail');
});
document.querySelectorAll('.top .seg:first-child button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.top .seg:first-child button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('text', b.dataset.v === 'text');
});

/* =================== 示例走查 =================== */
let cur = null, idx = 0;
function setScenario(k){ cur = k; idx = 0; document.querySelectorAll('#scenBtns button').forEach(b => b.classList.toggle('on', b.dataset.k === (k || ''))); apply(false); }
function apply(scroll = true){
  document.querySelectorAll('.visited,.cur,.curcard').forEach(e => e.classList.remove('visited', 'cur', 'curcard'));
  document.querySelectorAll('.vis').forEach(v => v.innerHTML = '');
  document.querySelectorAll('.note').forEach(n => n.textContent = '');
  $('#layout').classList.toggle('scen', !!cur);
  if (!cur){ $('#prev').disabled = $('#next').disabled = true; return; }
  const path = SCENARIOS[cur].path;
  path.forEach(([id], j) => { if (id.includes('/')) return; const c = byId(id); c.classList.add('visited');
    let p = c.parentElement.closest('.card'); while (p){ p.classList.add('visited'); p = p.parentElement.closest('.card'); }
    c.querySelector('.vis').insertAdjacentHTML('beforeend', `<span>${j + 1}</span>`); });
  const [cid, note] = path[idx], el = byId(cid);
  if (cid.includes('/')){ el.classList.add('cur'); const card = el.closest('.card'); card.classList.add('curcard'); card.querySelector(':scope > .note').textContent = note; }
  else { el.classList.add('curcard'); el.querySelector(':scope > .note').textContent = note; }
  $('#prev').disabled = idx === 0; $('#next').disabled = idx === path.length - 1;
  if (scroll) el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* =================== 启动 =================== */
render(); validate();
$('#wf').textContent = skillText();
$('#scenBtns').innerHTML = `<button data-k="" class="on">不选</button> ` + Object.entries(SCENARIOS).map(([k, s]) => `<button data-k="${k}">${s.name}</button>`).join(' ');
$('#scenBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setScenario(b.dataset.k || null); });
$('#prev').onclick = () => { if (idx > 0){ idx--; apply(); } };
$('#next').onclick = () => { if (cur && idx < SCENARIOS[cur].path.length - 1){ idx++; apply(); } };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft') $('#prev').click(); });
(() => {
  const h = location.hash;
  if (h === '#text') document.querySelector('[data-v="text"]').click();
  if (h === '#detail') document.querySelector('[data-m="detail"]').click();
  const m = h.match(/^#(\w+):(\d+)$/);
  if (m && SCENARIOS[m[1]]){ cur = m[1]; idx = Math.min(+m[2] - 1, SCENARIOS[m[1]].path.length - 1); document.querySelectorAll('#scenBtns button').forEach(b => b.classList.toggle('on', b.dataset.k === cur)); apply(false); }
  else setScenario(null);
})();
</script>
