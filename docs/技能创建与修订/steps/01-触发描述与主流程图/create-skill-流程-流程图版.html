<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>create-skill 流程图</title>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#1d2a22; --muted:#5f6e65; --line:#d6ded8; --soft:#f3f6f3;
  --green:#2f7d4f; --green-ink:#1f5c39; --green-soft:#e8f4ec; --term:#2f7d4f;
  --amber:#a8670a; --amber-soft:#fdf3e1; --red:#b4372f; --red-soft:#fbe8e6;
  --blue:#2d5f9a; --blue-soft:#e6eef8; --violet:#6a4fb0; --violet-soft:#efeafb;
  --hl:#2d5f9a; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --panel:#18201b; --ink:#e2eae4; --muted:#9aaa9f; --line:#2e3a32; --soft:#141b16;
    --green:#5bbd82; --green-ink:#a3dcb8; --green-soft:#1a2c21; --term:#2b7448;
    --amber:#e2a24c; --amber-soft:#2d2414; --red:#e8776d; --red-soft:#351b19;
    --blue:#82abe0; --blue-soft:#1a2534; --violet:#b39df0; --violet-soft:#241f33; --hl:#82abe0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#18201b; --ink:#e2eae4; --muted:#9aaa9f; --line:#2e3a32; --soft:#141b16;
  --green:#5bbd82; --green-ink:#a3dcb8; --green-soft:#1a2c21; --term:#2b7448;
  --amber:#e2a24c; --amber-soft:#2d2414; --red:#e8776d; --red-soft:#351b19;
  --blue:#82abe0; --blue-soft:#1a2534; --violet:#b39df0; --violet-soft:#241f33; --hl:#82abe0; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 20px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
h1{font-size:19px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:3px 11px}
.seg button{border:0;border-radius:0}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.4;cursor:default}
.valid{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--green);color:var(--green-ink);background:var(--green-soft)}
.valid.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.scen{display:flex;gap:4px;align-items:center;margin-left:auto;flex-wrap:wrap}
.scen .lbl{color:var(--muted);font-size:13px;margin-right:2px}
.app{flex:1;display:grid;grid-template-columns:1fr 440px;min-height:0}
.stage{overflow:auto;position:relative;padding:18px}
.now{display:none;position:sticky;top:0;left:0;z-index:5;margin-bottom:10px;background:var(--blue-soft);border:1px solid var(--blue);border-radius:10px;padding:6px 10px;font-size:13px;max-width:880px}
.now.on{display:block}
.now .req{color:var(--muted)} .now .req q{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.sw{display:inline-block;width:24px;border-top:2px solid var(--green);vertical-align:middle;margin-right:5px}
.canvas{position:relative}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#elabels{position:absolute;left:0;top:0}

/* 节点 */
.node{position:absolute;transform:translate(-50%,0);background:var(--panel);border:1.5px solid var(--green);border-radius:12px;padding:7px 11px 7px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
.node:hover{box-shadow:0 0 0 3px var(--green-soft),var(--shadow)}
.node .nh{display:flex;align-items:center;gap:6px}
.sno{font-weight:700;font-size:11.5px;color:#fff;background:var(--green);border-radius:5px;padding:0 6px;white-space:nowrap}
.node .nt{font-weight:650;font-size:13.5px;line-height:1.35;margin-top:3px}
.node .ni{display:flex;gap:8px;margin-top:4px;font-size:11.5px;color:var(--muted)}
.node .ni .nask{color:var(--amber);font-weight:650}
.node.term{background:var(--term);border-color:var(--term);color:#fff;border-radius:999px;text-align:center;padding:7px 18px}
.node.term .nt{margin:0;font-size:13.5px}
.node.exit{border-color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:5px 12px;text-align:center}
.node.fail{border-color:var(--red);background:var(--red-soft);border-radius:999px;padding:5px 12px;text-align:center}
.node.exit .nt,.node.fail .nt{margin:0;font-size:12.5px}
.node.exit .nt{color:var(--blue)} .node.fail .nt{color:var(--red)}
.node .xs{font-size:11px;color:var(--muted)}
.node.sel{box-shadow:0 0 0 3px var(--hl)}
.node.hl{box-shadow:0 0 0 3px var(--blue-soft),0 0 0 5px var(--hl)}
.node.cur{box-shadow:0 0 0 4px var(--hl)}
.canvas.scen .node:not(.visited){opacity:.35}
.node .vis{position:absolute;top:-9px;right:-9px;display:flex;gap:2px}
.vis span{background:var(--blue);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.group{position:absolute;border:1.5px dashed var(--line);border-radius:16px;pointer-events:none}
.group span{position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 6px;font-size:12px;color:var(--muted);font-weight:650}
.w{fill:none;stroke-width:2;stroke-linejoin:round}
.w.main{stroke:var(--green)} .w.back{stroke:var(--amber);stroke-dasharray:6 4} .w.jump{stroke:var(--violet);stroke-dasharray:6 4}
.w.exit{stroke:var(--blue)} .w.fail{stroke:var(--red)}
.w.on{stroke-width:3.4}
.canvas.scen .w:not(.on){opacity:.3}
.mk-main{fill:var(--green)} .mk-back{fill:var(--amber)} .mk-jump{fill:var(--violet)} .mk-exit{fill:var(--blue)} .mk-fail{fill:var(--red)}
.el{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:650;padding:0 7px;border-radius:999px;background:var(--bg);border:1px solid;white-space:nowrap;cursor:help}
.el.main{color:var(--green-ink);border-color:var(--green)} .el.back{color:var(--amber);border-color:var(--amber)} .el.jump{color:var(--violet);border-color:var(--violet)}
.el.exit{color:var(--blue);border-color:var(--blue)} .el.fail{color:var(--red);border-color:var(--red)}

/* 右侧抽屉 */
.drawer{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 18px 40px}
.drawer .empty{color:var(--muted);font-size:13.5px}
.drawer .empty b{color:var(--ink)}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:8px}
.dh .ttl{font-weight:700;font-size:16px}
.tag-nest{font-size:11.5px;border-radius:999px;padding:0 8px;background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.sec{margin-top:10px}
.sec h5{margin:0 0 4px;font-size:12px;color:var(--muted)}
.acts{list-style:none;margin:0;padding:0}
.acts > li{margin:0 0 7px;padding-left:22px;position:relative}
.an{position:absolute;left:0;top:0;color:var(--green-ink);font-weight:700}
.br{list-style:none;margin:3px 0 2px;padding:0 0 0 12px;border-left:2px solid var(--line)}
.br li{margin:3px 0}
.when{font-weight:650}
.when::before{content:"如果 ";font-weight:500;color:var(--muted)}
.ask{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:6px;padding:0 6px}
.ask::before{content:"👤 问用户 ";color:var(--amber);font-weight:700}
.lst{margin:3px 0 2px;padding-left:18px}
.inloop{color:var(--green-ink);font-weight:600;white-space:nowrap}
.go{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:0 9px;border:1.5px solid;white-space:nowrap;cursor:pointer;line-height:1.6}
.go.next,.go.sub{color:var(--green-ink);border-color:var(--green);background:var(--green-soft)}
.go.back{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.go.jump{color:var(--violet);border-color:var(--violet);background:var(--violet-soft)}
.go.exit{color:var(--blue);border-color:var(--blue);background:var(--blue-soft)}
.go.fail{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.gores{color:var(--muted);font-size:12.8px}
.rules ul{margin:0;padding-left:16px} .rules li{margin-bottom:5px;font-size:13px}
.why{display:block;color:var(--muted);font-size:11.5px;line-height:1.4}
.note{margin-top:10px;background:var(--blue-soft);border-left:3px solid var(--blue);padding:6px 10px;border-radius:6px;font-size:13px}
.note::before{content:"本例：";font-weight:700;color:var(--blue)}
.cur-el{outline:2.5px solid var(--hl);outline-offset:2px;border-radius:6px}
code{font:12.5px "SF Mono",Menlo,monospace;background:var(--soft);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.meta div{margin-bottom:4px;font-size:13.5px} .meta .mk{color:var(--muted);font-weight:650;margin-right:6px}

#textView{display:none;padding:18px;overflow:auto}
#wf{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;white-space:pre-wrap;font:13.5px/1.75 "SF Mono",Menlo,"PingFang SC",monospace;margin:0;max-width:960px}
body.text #textView{display:block;flex:1}
body.text .app,body.text .scen{display:none}
.issues{margin:0;padding:8px 12px 8px 28px;background:var(--red-soft);color:var(--red);display:none}
</style>
</head>
<body>
<header>
  <h1>create-skill 流程图</h1>
  <span class="seg"><button data-v="graph" class="on">流程图</button><button data-v="text">文字版</button></span>
  <span class="valid" id="valid"></span>
  <span class="scen"><span class="lbl">示例走查</span><span id="scenBtns"></span><button id="prev">◀</button><button id="next">▶</button></span>
</header>
<ul class="issues" id="issues"></ul>
<div class="app">
  <div class="stage" id="stage">
    <div class="now" id="now"></div>
    <div class="legend">
      <span><span class="sw"></span>主线</span><span><span class="sw" style="border-top:2px dashed var(--amber)"></span>回退</span>
      <span><span class="sw" style="border-top:2px dashed var(--violet)"></span>转到</span><span><span class="sw" style="border-top-color:var(--blue)"></span>提前结束</span>
      <span>线上的标签是走这条线的结果，悬停可看完整条件；点节点在右侧看这一步的正文</span>
    </div>
    <div class="canvas" id="canvas"><svg id="wires"></svg><div id="nodes"></div><div id="elabels"></div></div>
  </div>
  <aside class="drawer" id="drawer"></aside>
</div>
<div id="textView"><pre id="wf"></pre></div>

<script>
const FLOW = {
  name:'create-skill',
  description:'当用户需要创建新的 skill，或修改已有 skill 的触发条件、执行流程或规则时使用。',
  intro:['把用户的需求或一个已有的 skill，做成 Agent 能直接照着执行的 skill。先弄清用户真正要什么，再画出 skill 的流程图请用户确认，最后按流程图写成 SKILL.md 并检查。用户确认过的流程图是唯一依据：正文与流程图不一致时，以流程图为准。',
         '用户给出的通常只是一条主线，你要把它补成一份完整、可执行的 skill。每一步要写清：从哪里拿输入，可能出现哪些情况，每种情况去哪里，哪里需要用户参与，什么时候结束。你补出来的内容要明确标出来，让用户能看到、能核对，不要等用户逐条指出。'],
};
const STEPS = {
  '1': {title:'明确要开发什么样的 skill', input:'用户请求、相关对话和用户提供的材料',
    acts:[{t:'先收集材料：读完用户的请求和相关对话，用户提供的文档、示例和现有做法也要完整读取'},
          {t:'然后判断用户的真实意图', br:[
            {when:'用户要修订已有的 skill（点名了某个 skill、给出了路径，或说“刚才那个”）', out:'修订'},
            {when:'用户要新建，但这个需求不适合做成 skill', ask:'向用户说明原因并推荐更合适的做法', ans:[
              {when:'用户接受建议', out:'改用其他方式'},
              {when:'用户仍要做成 skill', out:'新建'}]},
            {when:'用户要新建，并且适合做成 skill', out:'新建'}]}],
    rules:[{t:'以下需求不适合做成 skill：只做一次的任务，直接完成即可；只适用于某个项目的约定，写进项目说明文件，如 CLAUDE.md 或 AGENTS.md；需要在某个事件发生时自动执行的行为，用 hook 配置；能用脚本或校验规则强制执行的机械约束，写成脚本或校验'}],
    outcomes:[{tag:'修订', kind:'sub', to:'1.1'}, {tag:'新建', kind:'sub', to:'1.2'},
              {tag:'改用其他方式', kind:'exit', res:'按建议处理，结束本次任务'}],
    kids:['1.1','1.2','1.3']},
  '1.1': {title:'找到并读懂要修订的 skill', input:'用户请求',
    acts:[{t:'在个人 skill 目录、当前项目的 skill 目录和已安装的插件中，查找要修订的 skill', br:[
            {when:'用户的描述对应多个 skill，或一个都对不上', ask:'列出最接近的候选请用户指认', goText:'重新查找'},
            {when:'确实没有这个 skill', ask:'告诉用户，并询问是否改为新建', ans:[
              {when:'用户同意', out:'改为新建'},
              {when:'用户不同意', out:'不再修订'}]},
            {when:'找到了', then:'完整读取它的 SKILL.md、引用的文件和脚本，以及同目录下的流程图 `flow.html`（如果有）'}]},
          {t:'确定要修改的文件', br:[
            {when:'找到的 skill 位于插件缓存等由别人维护的位置', ask:'说明直接修改会在插件更新时被覆盖，给出“复制到个人 skill 目录后再改”和“仍在原处改”两个选项，推荐前者', goText:'按用户的选择确定'},
            {when:'它位于个人或项目的 skill 目录', then:'直接修改原文件'}]},
          {t:'然后把用户的修改要求落到具体行为上：写清这个 skill 现在会怎样、改完应该怎样，并找一个能复现现状的具体请求'}],
    out:'原 skill 的内容、要修改的文件、现状 → 期望、复现请求',
    rules:[{t:'只依据读到的原文理解现有 skill，不要凭记忆或摘要', why:'否则容易误判要改的范围'}],
    outcomes:[{tag:'修订依据就绪', kind:'next', to:'1.3'},
              {tag:'改为新建', kind:'jump', to:'1.2', res:'改走新建路径', lane:0},
              {tag:'不再修订', kind:'exit', res:'结束本次任务'}]},
  '1.2': {title:'确认新 skill 的定位', input:'用户请求',
    acts:[{t:'在已安装的 skill 中查找用途相近的', br:[
            {when:'找到了', ask:'说明它们和这次需求的异同，给出“修订已有的”和“新建”两个选项并标出推荐', ans:[
              {when:'用户选修订', out:'改为修订'},
              {when:'用户选新建', then:'继续本步'}]},
            {when:'没有找到', then:'继续本步'}]},
          {t:'确定新 skill 存放在哪里', br:[
            {when:'用户已经指明', then:'按用户说的'},
            {when:'当前项目已有存放 skill 的约定', then:'按约定'},
            {when:'都没有', ask:'询问用户，推荐只在本项目用的放项目目录，跨项目用的放个人目录', goText:'按回复确定'}]}],
    out:'确认要新建，以及存放位置',
    outcomes:[{tag:'定位已确认', kind:'next', to:'1.3'},
              {tag:'改为修订', kind:'jump', to:'1.1', res:'改走修订路径', lane:1}]},
  '1.3': {title:'核对需求是否完整', input:'步骤 1.1 或 1.2 的产出、对话和材料',
    acts:[{t:'对照下面的清单逐项核对。能从对话、材料、项目文件或原 skill 中找到答案的，直接补上，不要拿去问用户', list:[
            '解决什么问题：这个 skill 要解决的问题，以及没有它时 AI 通常会怎么做错',
            '什么时候用：谁会在什么情况下用它，哪些相近的请求不该触发它',
            '输入和交付：它拿到什么输入，交付什么结果，做到什么程度算完成',
            '具体实例：至少一个真实的输入和期望的结果；修订时还要有能复现现状的请求',
            '约束：必须遵守或不能做的事，可以使用的工具和环境',
            '用户参与：哪些地方需要用户提供信息或做确认']},
          {t:'根据核对结果', br:[
            {when:'还有会影响流程走向的点不清楚', ask:'把这些点一次性问用户。每个问题说明你目前的理解，给出 2～3 个可选答案并标出推荐项；用户没给实例时，自拟一个放进问题里请用户确认', goText:'补全理解，再核对一遍'},
            {when:'剩下的都不影响流程走向', then:'按最合理的方式自行补全，记下你的选择', out:'需求明确'}]}],
    out:'需求摘要',
    rules:[{t:'提问要集中，一次问清，不要零碎地反复追问'}],
    outcomes:[{tag:'需求明确', kind:'next', to:'2'}]},
  '2': {title:'生成或更新流程图', nest:'画的是目标 skill', input:'需求摘要、具体实例；修订时还有原 skill 和已有流程图',
    acts:[{t:'按 `references/flowchart.md` 的规则，生成或更新目标 skill 的流程图，保存为 skill 目录下的 `flow.html`', br:[
            {when:'是新建', then:'以实例为线索，从输入一路推到交付结果，画出主线。再挑一两个会走不同路线的情况推一遍，例如输入缺失、中途失败、用户否决，把分支补上'},
            {when:'是修订', then:'在已有流程图上修改。没有流程图时，先把原 SKILL.md 如实还原成流程图，标出原文含糊或自相矛盾的地方，再只改受影响的部分，并在图上标出改动'}]},
          {t:'流程图顶部写名称、触发描述、一句话用途，以及步骤 1 得到的需求摘要。每个步骤写清输入、动作、产出、可能的结果和各自的去向。画的时候，主动补全用户没有说到的部分', list:[
            '每个输入从哪里来，拿不到时怎么办',
            '动作失败或得到意外结果时去哪里',
            '需要用户参与的地方，以及用户每种回复的去向',
            '每个循环回到哪里、什么时候结束。可能反复多次的，写明最多几次，超过后怎么办',
            '异常结束时告诉用户什么，留下什么']},
          {t:'补全时遇到拿不准的地方，分两类处理', br:[
            {when:'是方向性的问题，也就是有几种合理做法、选哪种结果明显不同', ask:'向用户提问：说明问题和取舍，给出 2～3 个建议做法并标出推荐项', goText:'按用户的选择画进图里'},
            {when:'只是局部细节', then:'自行决定，并在图上标出你的选择，留给用户检查时一并核对'}]},
          {t:'画完后先自查：每个结果都有去向，每个步骤从开始都走得到，每个循环都有退出条件，用实例沿着图走一遍能到达期望结果。发现问题先改好'},
          {para:true, ask:'然后把流程图交给用户检查：告诉用户文件位置，概括主线、关键判断和你自行决定的细节；修订时说明改了哪里', ans:[
            {when:'用户确认', out:'流程图已确认'},
            {when:'问题出在需求理解上', out:'需求理解有误'},
            {when:'问题出在流程图本身', then:'按意见修改', goText:'自查后再请用户检查'},
            {when:'用户要暂停', out:'暂停'}]}],
    out:'用户确认的 `flow.html`',

/* =================== 工具 =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const CIRC = '①②③④⑤⑥⑦⑧⑨';
const OFF = k => ['back','fail','jump','exit'].includes(k);
const outcome = (sid, tag) => STEPS[sid].outcomes.find(o => o.tag === tag);
const kidsOf = b => b.ans || b.br;
const node = id => document.querySelector(`.node[data-n="${CSS.escape(id)}"]`);
function walkBranches(sid, fn){
  const walk = (list, path) => (list || []).forEach(b => { fn(b, [...path, b.when]); walk(kidsOf(b), [...path, b.when]); });
  STEPS[sid].acts.forEach(a => walk(kidsOf(a), []));
}
const usedTags = sid => { const u = new Set(); walkBranches(sid, b => b.out && u.add(b.out)); return u; };
function condOf(sid, tag){
  const found = []; walkBranches(sid, (b, path) => { if (b.out === tag) found.push(path.join(' → ')); });
  return found.length ? found.join('；') : (outcome(sid, tag).when || '动作完成');
}
const countAsks = sid => { let n = 0; STEPS[sid].acts.forEach(a => { if (a.ask) n++; }); walkBranches(sid, b => { if (b.ask) n++; }); return n; };

function validate(){
  const issues = [];
  for (const [sid, s] of Object.entries(STEPS)){
    walkBranches(sid, b => { if (b.out && !outcome(sid, b.out)) issues.push(`步骤 ${sid} 引用了未定义的结果「${b.out}」`); });
    for (const o of s.outcomes){
      if (o.to && o.to !== 'end' && !STEPS[o.to]) issues.push(`步骤 ${sid} 的「${o.tag}」指向不存在的步骤 ${o.to}`);
      if (OFF(o.kind) && !o.res) issues.push(`步骤 ${sid} 的「${o.tag}」没写之后做什么`);
      if (['exit','fail'].includes(o.kind) && !LAYOUT.nodes[`X:${sid}/${o.tag}`]) issues.push(`出口「${o.tag}」没有在画布上布局`);
    }
  }
  Object.keys(STEPS).filter(id => !LAYOUT.nodes[id]).forEach(id => issues.push(`步骤 ${id} 没有在画布上布局`));
  const seen = new Set(), stack = ['1'];
  while (stack.length){ const id = stack.pop(); if (seen.has(id) || !STEPS[id]) continue; seen.add(id); STEPS[id].outcomes.forEach(o => o.to && stack.push(o.to)); }
  Object.keys(STEPS).filter(id => !seen.has(id)).forEach(id => issues.push(`步骤 ${id} 从开始走不到`));
  const v = $('#valid');
  v.textContent = issues.length ? `校验：${issues.length} 个问题` : '校验：✔ 每个去向都有来源和目标，每一步都走得到';
  v.classList.toggle('bad', !!issues.length);
  const ul = $('#issues'); ul.innerHTML = issues.map(i => `<li>${esc(i)}</li>`).join(''); ul.style.display = issues.length ? 'block' : 'none';
}

/* =================== 画布 =================== */
function renderCanvas(){
  const L = LAYOUT, items = [];
  for (const [id, [c, r]] of Object.entries(L.nodes)){
    const x = L.cols[c], y = L.rows[r];
    if (TERMS[id]) items.push(`<div class="node term" data-n="${id}" style="left:${x}px;top:${y}px"><div class="nt">${esc(TERMS[id].title)}</div><div class="vis"></div></div>`);
    else if (id.startsWith('X:')){
      const [sid, tag] = id.slice(2).split('/'), o = outcome(sid, tag);
      items.push(`<div class="node ${o.kind}" data-n="${id}" style="left:${x}px;top:${y}px;width:150px"><div class="nt">${o.kind === 'fail' ? '✖' : '⇥'} ${esc(tag)}</div><div class="xs">${o.kind === 'fail' ? '异常终止' : '提前结束'}</div><div class="vis"></div></div>`);
    } else {
      const s = STEPS[id], asks = countAsks(id), w = id.includes('.') ? 175 : 215;
      items.push(`<div class="node" data-n="${id}" style="left:${x}px;top:${y}px;width:${w}px">
        <div class="nh"><span class="sno">步骤 ${id}</span></div><div class="nt">${esc(s.title)}</div>
        <div class="ni">${asks ? `<span class="nask">👤 问用户 ${asks} 处</span>` : ''}${s.rules ? `<span>约束 ${s.rules.length}</span>` : ''}</div><div class="vis"></div></div>`);
    }
  }
  $('#nodes').innerHTML = items.join('');
  const cv = $('#canvas');
  cv.style.width = (Math.max(...L.cols) + 110) + 'px';
  cv.style.height = (Math.max(...L.rows) + 70) + 'px';
}
const edges = () => {
  const list = [{from:'start', to:'1', kind:'next'}];
  for (const [sid, s] of Object.entries(STEPS)){
    const used = usedTags(sid);
    for (const o of s.outcomes){
      const to = ['exit','fail'].includes(o.kind) ? `X:${sid}/${o.tag}` : o.to;
      const labelled = used.has(o.tag) || o.when;
      list.push({from:sid, to, kind:o.kind === 'sub' ? 'next' : o.kind, label:labelled ? o.tag : '', tip:condOf(sid, o.tag), id:`${sid}/${o.tag}`});
    }
  }
  return list;
};
function drawCanvas(){
  const cv = $('#canvas'), C = cv.getBoundingClientRect();
  const R = id => { const r = node(id).getBoundingClientRect(); const l = r.left - C.left, t = r.top - C.top; return {l, t, r:l + r.width, b:t + r.height, cx:l + r.width / 2, cy:t + r.height / 2}; };
  const P = p => p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const svg = $('#wires'); svg.setAttribute('width', cv.offsetWidth); svg.setAttribute('height', cv.offsetHeight);
  let s = `<defs>${['main','back','jump','exit','fail'].map(k => `<marker id="a-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-${k}" d="M0 0L10 5L0 10z"/></marker>`).join('')}</defs>`;
  let labels = '';
  // 分组框
  $('#nodes').querySelectorAll('.group').forEach(g => g.remove());
  for (const g of LAYOUT.groups){
    const rs = g.nodes.map(R), x1 = Math.min(...rs.map(r => r.l)) - 16, x2 = Math.max(...rs.map(r => r.r)) + 16, y1 = Math.min(...rs.map(r => r.t)) - 18, y2 = Math.max(...rs.map(r => r.b)) + 14;
    $('#nodes').insertAdjacentHTML('afterbegin', `<div class="group" style="left:${x1}px;top:${y1}px;width:${x2 - x1}px;height:${y2 - y1}px"><span>${esc(g.label)}</span></div>`);
  }
  const rowOf = id => LAYOUT.nodes[id][1];
  let backLane = 0;
  for (const e of edges()){
    const a = R(e.from), b = R(e.to), k = e.kind === 'next' ? 'main' : e.kind;
    let p, lp;
    if (rowOf(e.to) === rowOf(e.from)){          // 同一行：水平
      const dir = b.cx > a.cx ? 1 : -1, off = (e.kind === 'jump') ? (dir > 0 ? -9 : 9) : 0;
      p = [[dir > 0 ? a.r : a.l, a.cy + off], [dir > 0 ? b.l : b.r, a.cy + off]];
      lp = [(p[0][0] + p[1][0]) / 2, a.cy + off + (off ? off * 1.7 : -11)];
    } else if (rowOf(e.to) > rowOf(e.from)){     // 往下：折线
      const ym = a.b + Math.min(22, (b.t - a.b) / 2);
      p = Math.abs(a.cx - b.cx) < 1 ? [[a.cx, a.b], [b.cx, b.t]] : [[a.cx, a.b], [a.cx, ym], [b.cx, ym], [b.cx, b.t]];
      lp = Math.abs(a.cx - b.cx) < 1 ? [a.cx, (a.b + b.t) / 2] : [b.cx, (ym + b.t) / 2];
    } else {                                     // 往回：从左侧绕上去
      const lx = Math.min(a.l, b.l) - 34 - (backLane++ % 2) * 14;
      p = [[a.l, a.cy], [lx, a.cy], [lx, b.cy], [b.l, b.cy]];
      lp = [lx, (a.cy + b.cy) / 2];
    }
    s += `<path class="w ${k}" data-e="${esc(e.id || '')}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" d="${P(p)}" marker-end="url(#a-${k})"/>`;
    if (e.label) labels += `<span class="el ${k}" style="left:${lp[0]}px;top:${lp[1]}px" title="${esc(e.tip)}">${esc(e.label)}</span>`;
  }
  svg.innerHTML = s; $('#elabels').innerHTML = labels;
  markScenario();
}

/* =================== 抽屉：这一步的正文 =================== */
function goHTML(sid, tag){
  const o = outcome(sid, tag);
  let label, res = '', to = o.to || '';
  if (o.kind === 'fail'){ label = '✖ 终止'; res = o.res; to = `X:${sid}/${tag}`; }
  else if (o.kind === 'exit'){ label = '⇥ 结束'; res = o.res; to = `X:${sid}/${tag}`; }
  else if (o.to === 'end'){ label = '→ 正常结束'; res = o.res || ''; }
  else if (o.kind === 'back'){ label = `↺ 回到步骤 ${o.to}`; res = o.res; }
  else if (o.kind === 'jump'){ label = `↪ 转到步骤 ${o.to}`; }
  else label = `→ 步骤 ${o.to}`;
  return `<span class="go ${o.kind}" data-to="${esc(to)}">${label}</span>${res ? ` <span class="gores">${fmt(res)}</span>` : ''}`;
}
function branchHTML(sid, list){
  return `<ul class="br">${list.map(b => {
    const parts = [];
    if (b.then) parts.push(fmt(b.then));
    if (b.ask) parts.push(`<span class="ask">${fmt(b.ask)}</span>`);
    if (b.goText) parts.push(`<span class="inloop">↻ ${fmt(b.goText)}</span>`);
    let line = `<span class="when">${fmt(b.when)}</span>${parts.length ? '，' + parts.join('，') : ''}`;
    if (b.out) line += ' ' + goHTML(sid, b.out);
    const k = kidsOf(b);
    return `<li>${line}${k ? branchHTML(sid, k) : ''}</li>`;
  }).join('')}</ul>`;
}
let selected = null, curNote = '';
function showDrawer(id){

  document.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
  if (id && node(id)) node(id).classList.add('sel');

  if (!id){
    d.innerHTML = `<div class="dh"><span class="ttl">${esc(FLOW.name)}</span></div>
      <div class="meta"><div><span class="mk">触发描述</span>${esc(FLOW.description)}</div>${FLOW.intro.map(p => `<div>${fmt(p)}</div>`).join('')}</div>
      <p class="empty">点画布上的任意<b>节点</b>，在这里查看这一步的输入、动作、约束和去向。</p>`;
    return;
  }
  if (TERMS[id]){ d.innerHTML = `<div class="dh"><span class="ttl">${esc(TERMS[id].title)}</span></div><p>${esc(TERMS[id].sub)}</p>${note}`; return; }
  if (id.startsWith('X:')){
    const [sid, tag] = id.slice(2).split('/'), o = outcome(sid, tag);
    d.innerHTML = `<div class="dh"><span class="go ${o.kind}">${o.kind === 'fail' ? '✖ 异常终止' : '⇥ 提前结束'}</span><span class="ttl">${esc(tag)}</span></div>
      <div class="sec"><h5>来自</h5><span class="go next" data-to="${sid}">步骤 ${sid}</span></div>
      <div class="sec"><h5>条件</h5>${fmt(condOf(sid, tag))}</div><div class="sec"><h5>处理</h5>${fmt(o.res)}</div>${note}`;
    return;
  }
  const s = STEPS[id];
  const acts = s.acts.map((a, i) => {

    const list = a.list ? `<ul class="lst">${a.list.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : '';
    const k = kidsOf(a);
    return `<li><span class="an">${CIRC[i]}</span>${head}${list}${k ? branchHTML(id, k) : ''}</li>`;
  }).join('');
  const used = usedTags(id), dflt = s.outcomes.filter(o => !used.has(o.tag));
  d.innerHTML = `<div class="dh"><span class="sno">步骤 ${id}</span><span class="ttl">${esc(s.title)}</span>${s.nest ? `<span class="tag-nest">嵌套：${esc(s.nest)}</span>` : ''}</div>
    ${note}
    <div class="sec"><h5>输入</h5>${fmt(s.input)}</div>
    <div class="sec"><h5>动作</h5><ol class="acts">${acts}</ol></div>
    ${s.out ? `<div class="sec"><h5>产出</h5>${fmt(s.out)}</div>` : ''}
    ${dflt.length ? `<div class="sec"><h5>完成后</h5>${dflt.map(o => goHTML(id, o.tag)).join(' ')}</div>` : ''}
    ${s.rules ? `<div class="sec rules"><h5>约束</h5><ul>${s.rules.map(r => `<li>${fmt(r.t)}${r.why ? `<span class="why">${fmt(r.why)}</span>` : ''}</li>`).join('')}</ul></div>` : ''}
    ${s.kids ? `<div class="sec"><h5>子步骤</h5>${s.kids.map(k => `<span class="go next" data-to="${k}">步骤 ${k} ${esc(STEPS[k].title)}</span>`).join(' ')}</div>` : ''}`;

/* =================== 文字版（与前两版相同） =================== */
function routeText(o){
  if (o.kind === 'fail' || o.kind === 'exit') return o.res;
  if (o.to === 'end') return o.res || '结束并交付 ' + TERMS.end.sub;
  if (o.kind === 'back') return `回到步骤 ${o.to} ${o.res}`;
  return `进入步骤 ${o.to}`;
}
function branchLines(sid, list, ind){
  return list.map(b => {
    const p = [], k = kidsOf(b);
    if (b.then) p.push(b.then);
    if (b.ask) p.push(b.ans ? `${b.ask}，等待回复` : `${b.ask}，等待回复后${b.goText || '继续'}`);
    else if (b.goText) p.push(b.goText);
    if (b.out) p.push(routeText(outcome(sid, b.out)));
    const line = `${ind}- 如果${b.when}，${p.join('，')}${k ? '：' : '。'}`;
    return k ? line + '\n' + branchLines(sid, k, ind + '  ') : line;
  }).join('\n');
}
function stepText(sid, level){
  const s = STEPS[sid]; const paras = []; let buf = '';
  s.acts.forEach(a => {
    const sentence = a.ask ? `${a.ask}，等待回复` : a.t, k = kidsOf(a);
    if (a.para && buf){ paras.push(buf); buf = ''; }
    if (a.list){ paras.push(buf + sentence + '：\n' + a.list.map(x => `- ${x}。`).join('\n')); buf = ''; }
    else if (k){ paras.push(buf + sentence + '：\n' + branchLines(sid, k, '')); buf = ''; }
    else buf += sentence + '。';
  });
  const used = usedTags(sid), rest = s.outcomes.filter(o => !used.has(o.tag) && !OFF(o.kind) || !used.has(o.tag) && o.when);
  if (rest.length === 1 && !rest[0].when){ const tail = `完成后${routeText(rest[0])}。`; if (buf) buf += tail; else paras.push(tail); }
  if (buf) paras.push(buf);
  rest.filter(o => o.when).forEach(o => paras.push(`如果${o.when}，${routeText(o)}。`));
  if (s.rules && s.rules.length) paras.push('要求：\n' + s.rules.map(r => `- ${r.t}${r.why ? '，' + r.why : ''}。`).join('\n'));
  let out = `${'#'.repeat(level)} 步骤 ${sid}：${s.title}\n\n${paras.join('\n\n')}`;
  if (s.kids) out += '\n\n' + s.kids.map(k => stepText(k, level + 1)).join('\n\n');
  return out;
}
function skillText(){
  return [`---\nname: ${FLOW.name}\ndescription: ${FLOW.description}\n---`, `# ${FLOW.name}`, ...FLOW.intro, '## 工作流',
    ...ORDER.filter(id => STEPS[id]).map(id => stepText(id, 3))].join('\n\n');
}

/* =================== 示例走查 =================== */
let cur = null, idx = 0;
function markScenario(){
  document.querySelectorAll('.node').forEach(n => { n.classList.remove('visited', 'cur'); n.querySelector('.vis').innerHTML = ''; });
  document.querySelectorAll('.w.on').forEach(w => w.classList.remove('on'));
  $('#canvas').classList.toggle('scen', !!cur);
  if (!cur) return;
  const path = SCENARIOS[cur].path;
  path.forEach(([id], j) => { const n = node(id); n.classList.add('visited'); n.querySelector('.vis').insertAdjacentHTML('beforeend', `<span>${j + 1}</span>`);
    if (j > 0){ const w = document.querySelector(`.w[data-from="${CSS.escape(path[j - 1][0])}"][data-to="${CSS.escape(id)}"]`); w && w.classList.add('on'); } });
  node(path[idx][0]).classList.add('cur');
}
function setScenario(k){
  cur = k; idx = 0;
  document.querySelectorAll('#scenBtns button').forEach(b => b.classList.toggle('on', b.dataset.k === (k || '')));
  apply();
}
function apply(){
  const now = $('#now');
  if (!cur){ curNote = ''; now.classList.remove('on'); $('#prev').disabled = $('#next').disabled = true; markScenario(); showDrawer(selected); return; }
  const path = SCENARIOS[cur].path, [id, note] = path[idx];
  curNote = note;
  now.classList.add('on');
  now.innerHTML = `<span class="req">请求：<q>${esc(SCENARIOS[cur].req)}</q></span>　<b>第 ${idx + 1} / ${path.length} 步</b>　${esc(note)}`;
  $('#prev').disabled = idx === 0; $('#next').disabled = idx === path.length - 1;
  markScenario(); showDrawer(id);
}

/* =================== 启动 =================== */
renderCanvas(); validate(); showDrawer(null);
$('#wf').textContent = skillText();
$('#scenBtns').innerHTML = `<button data-k="" class="on">不选</button>` + Object.entries(SCENARIOS).map(([k, s]) => `<button data-k="${k}">${s.name}</button>`).join('');
$('#scenBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setScenario(b.dataset.k || null); });
$('#prev').onclick = () => { if (idx > 0){ idx--; apply(); } };
$('#next').onclick = () => { if (cur && idx < SCENARIOS[cur].path.length - 1){ idx++; apply(); } };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft') $('#prev').click(); });
document.addEventListener('click', e => {
  const n = e.target.closest('.node'); if (n){ curNote = cur && SCENARIOS[cur].path[idx][0] === n.dataset.n ? curNote : ''; showDrawer(n.dataset.n); return; }
  const g = e.target.closest('.go[data-to]'); if (g && g.dataset.to){ const t = g.dataset.to; curNote = ''; showDrawer(t); node(t) && node(t).scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); }
});
document.addEventListener('mouseover', e => {
  document.querySelectorAll('.node.hl').forEach(n => n.classList.remove('hl'));
  const g = e.target.closest('.drawer .go[data-to]'); if (g && node(g.dataset.to)) node(g.dataset.to).classList.add('hl');
});
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('text', b.dataset.v === 'text'); drawCanvas();
});
(() => {
  if (location.hash === '#text'){ document.querySelector('.seg button[data-v="text"]').click(); setScenario(null); return; }
  const m = location.hash.match(/^#(\w+)(?::(\d+))?$/);
  if (m && SCENARIOS[m[1]]){ cur = m[1]; idx = Math.min((+m[2] || 1) - 1, SCENARIOS[m[1]].path.length - 1);
    document.querySelectorAll('#scenBtns button').forEach(b => b.classList.toggle('on', b.dataset.k === cur)); }
  else if (/^#s=/.test(location.hash)) selected = decodeURIComponent(location.hash.slice(3));
  drawCanvas(); apply();
})();
new ResizeObserver(drawCanvas).observe($('#canvas'));
if (document.fonts) document.fonts.ready.then(drawCanvas);
</script>
