<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill 工作流</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.400.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* ===== shadcn/ui 设计参数（zinc 中性色 + 靛紫品牌色） ===== */
:root{
  --background:240 20% 98.5%; --foreground:240 10% 3.9%;
  --card:0 0% 100%; --muted:240 4.8% 95.9%; --muted-foreground:240 3.8% 46.1%;
  --accent:240 4.8% 95.9%; --border:240 5.9% 90%; --ring:245 80% 60%;
  --primary:245 75% 58%; --primary-2:280 75% 60%; --primary-foreground:0 0% 100%; --primary-soft:245 90% 96%;
  --success:152 65% 34%; --success-bg:150 70% 95%;
  --warning:30 92% 42%; --warning-bg:40 100% 95%;
  --info:200 90% 40%; --info-bg:200 95% 95%;
  --danger:0 72% 48%; --danger-bg:0 86% 96%;
  --decide:262 70% 55%; --decide-bg:262 90% 96%;
  --pink:330 75% 50%; --pink-bg:330 90% 96%;
  --radius:0.6rem;
  --shadow-sm:0 1px 2px 0 rgb(16 16 40 / .05);
  --shadow-md:0 4px 16px -4px rgb(30 27 75 / .10),0 1px 3px rgb(16 16 40 / .06);
  --shadow-lg:0 20px 40px -12px rgb(30 27 75 / .25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:240 12% 5%; --foreground:0 0% 98%;
    --card:240 10% 8%; --muted:240 5% 14%; --muted-foreground:240 5% 64.9%;
    --accent:240 5% 14%; --border:240 5% 16%; --ring:245 90% 70%;
    --primary:245 90% 68%; --primary-2:280 85% 68%; --primary-foreground:0 0% 100%; --primary-soft:245 40% 16%;
    --success:150 65% 55%; --success-bg:152 45% 12%;
    --warning:38 92% 60%; --warning-bg:33 50% 12%;
    --info:200 90% 62%; --info-bg:200 50% 13%;
    --danger:0 91% 71%; --danger-bg:0 50% 14%;
    --decide:262 90% 75%; --decide-bg:262 40% 16%;
    --pink:330 85% 70%; --pink-bg:330 40% 15%;
    --shadow-sm:none; --shadow-md:0 8px 24px -12px rgb(0 0 0 / .5); --shadow-lg:0 20px 40px -12px rgb(0 0 0 / .6);
  }
}
:root[data-theme="dark"]{
  --background:240 12% 5%; --foreground:0 0% 98%;
  --card:240 10% 8%; --muted:240 5% 14%; --muted-foreground:240 5% 64.9%;
  --accent:240 5% 14%; --border:240 5% 16%; --ring:245 90% 70%;
  --primary:245 90% 68%; --primary-2:280 85% 68%; --primary-foreground:0 0% 100%; --primary-soft:245 40% 16%;
  --success:150 65% 55%; --success-bg:152 45% 12%;
  --warning:38 92% 60%; --warning-bg:33 50% 12%;
  --info:200 90% 62%; --info-bg:200 50% 13%;
  --danger:0 91% 71%; --danger-bg:0 50% 14%;
  --decide:262 90% 75%; --decide-bg:262 40% 16%;
  --pink:330 85% 70%; --pink-bg:330 40% 15%;
  --shadow-sm:none; --shadow-md:0 8px 24px -12px rgb(0 0 0 / .5); --shadow-lg:0 20px 40px -12px rgb(0 0 0 / .6);
}
*{box-sizing:border-box;border-color:hsl(var(--border))}
html,body{height:100%}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke-width:2}
.ic.sm{width:14px;height:14px}
.ic.xs{width:12px;height:12px}
code{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:hsl(var(--muted));padding:1px 5px;border-radius:4px}

/* ===== 基础组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius);border:1px solid hsl(var(--border));background:hsl(var(--background));font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:hsl(var(--accent))}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.icon{width:32px;padding:0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:hsl(var(--accent))}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.tabs{display:inline-flex;align-items:center;height:36px;padding:3px;border-radius:var(--radius);background:hsl(var(--muted))}
.tab{height:30px;padding:0 12px;border:0;border-radius:calc(var(--radius) - 2px);background:transparent;font-size:13px;font-weight:500;color:hsl(var(--muted-foreground));cursor:pointer}
.tab.on{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}
.sep{width:1px;height:20px;background:hsl(var(--border))}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:12px;box-shadow:var(--shadow-sm)}

/* ===== 顶栏 ===== */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background))}
.logo{width:32px;height:32px;border-radius:8px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center}
.title{display:flex;flex-direction:column;line-height:1.25;min-width:0;margin-right:8px}
.title b{font-size:14px;font-weight:600}
.title span{font-size:12px;color:hsl(var(--muted-foreground));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.grow{flex:1}
.vstat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:hsl(var(--success))}
.vstat.bad{color:hsl(var(--danger))}

/* ===== 布局 ===== */
.shell{flex:1;display:grid;grid-template-columns:256px 1fr;min-height:0}
.side{border-right:1px solid hsl(var(--border));overflow:auto;padding:12px 12px 32px;background:hsl(var(--background))}
.group{margin-bottom:16px}
.group-h{display:flex;align-items:center;height:32px;padding:0 8px;font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))}
.item{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer;color:hsl(var(--foreground));white-space:nowrap}
.item:hover{background:hsl(var(--accent))}
.item.on{background:hsl(var(--accent));font-weight:500}
.item .k{min-width:24px;font-size:12px;font-variant-numeric:tabular-nums;color:hsl(var(--muted-foreground))}
.item .t{overflow:hidden;text-overflow:ellipsis}
.item .r{margin-left:auto;font-size:12px;color:hsl(var(--muted-foreground))}
.item.l2{padding-left:24px}
.item .ic{color:hsl(var(--muted-foreground))}
.main{overflow:auto}
.content{max-width:820px;margin:0 auto;padding:32px 32px 96px}
.rules{display:none;margin:16px 24px 0;padding:12px 14px;border-radius:var(--radius);background:hsl(var(--muted))}
.rules.on{display:block}
.rules h5{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.rules ol{margin:0;padding-left:18px;font-size:13px}
.rules li{margin:4px 0}
.res{cursor:pointer}
.res:hover{background:hsl(var(--accent))}
.check{display:none;margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.check.on{display:block}
.check li{display:flex;gap:8px;padding:3px 0;color:hsl(var(--muted-foreground))}
.check li .ic{margin-top:2px}
.cont{font-size:12px;color:hsl(var(--muted-foreground));display:inline-flex;align-items:center;gap:4px}
.flash{animation:flash 1.2s}
@keyframes flash{0%,50%{box-shadow:0 0 0 2px hsl(var(--ring))}100%{box-shadow:var(--shadow-sm)}}
.tree{padding:0 12px 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{height:40px;padding:0 12px;text-align:center;font-weight:500;color:hsl(var(--muted-foreground));border-bottom:1px solid hsl(var(--border))}
td{height:44px;padding:0 12px;text-align:center;border-bottom:1px solid hsl(var(--border))}
th:first-child,td:first-child{text-align:left;padding-left:24px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:hsl(var(--muted) / .5)}
pre.text{margin:0;padding:20px 24px;white-space:pre-wrap;font:13px/1.8 "Geist Mono",ui-monospace,Menlo,"PingFang SC",monospace}
.view{display:none} .view.on{display:block}

/* ===== Sheet（右侧详情） ===== */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:hsl(var(--background));border-left:1px solid hsl(var(--border));box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:flex-start;gap:12px;padding:24px 24px 16px}
.sheet-h .tt{flex:1;min-width:0}
.sheet-h h4{margin:0;font-size:17px;font-weight:600}
.sheet-h p{margin:4px 0 0;font-size:13px;color:hsl(var(--muted-foreground))}
.sheet-b{flex:1;overflow:auto;padding:0 24px 32px;font-size:13.5px;line-height:1.6}
.sheet-b h5{margin:20px 0 8px;font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground))}
.sheet-b ul{margin:0;padding-left:18px}
.sheet-b li{margin:4px 0}

/* ================= 强调层 ================= */
.logo{background:linear-gradient(135deg,hsl(var(--primary)),hsl(var(--primary-2)));color:#fff;box-shadow:0 4px 12px -2px hsl(var(--primary) / .5)}
.tab.on{color:hsl(var(--primary))}
.item.on{background:hsl(var(--primary-soft));color:hsl(var(--primary));position:relative}
.item.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:hsl(var(--primary))}
.item.on .k,.item.on .ic{color:hsl(var(--primary))}
.content{max-width:900px}

/* 主线 + 步骤卡片 */
.flow{position:relative}
.flow::before{content:"";position:absolute;left:23px;top:24px;bottom:40px;width:3px;border-radius:3px;background:linear-gradient(to bottom,hsl(var(--primary)),hsl(var(--primary-2)) 70%,hsl(var(--success)))}
.lane{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:20px;margin-bottom:22px;position:relative}
.lane.sub{grid-template-columns:48px 24px minmax(0,1fr);margin-bottom:16px}
.node{position:relative;z-index:1;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,hsl(var(--primary)),hsl(var(--primary-2)));box-shadow:0 6px 16px -4px hsl(var(--primary) / .55),0 0 0 5px hsl(var(--background));cursor:pointer}
.lane.sub .node{width:34px;height:34px;margin:7px;border-radius:10px;font-size:12.5px;background:hsl(var(--card));color:hsl(var(--primary));box-shadow:0 0 0 2px hsl(var(--primary) / .5),0 0 0 6px hsl(var(--background))}
.lane.sub .tick{align-self:start;margin-top:24px;height:2px;background:hsl(var(--primary) / .35);border-radius:2px}
.lane.end .node{background:linear-gradient(135deg,hsl(152 70% 42%),hsl(170 70% 40%));box-shadow:0 6px 16px -4px hsl(152 70% 40% / .55),0 0 0 5px hsl(var(--background))}
.card{border-radius:14px;box-shadow:var(--shadow-md)}
.kicker{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:hsl(var(--primary));margin-bottom:2px}
.rules{background:hsl(var(--warning-bg));border:1px solid hsl(var(--warning) / .2)}
.rules h5{color:hsl(var(--warning))}
</style>
</head>
<body>
<style>
/* ===== 新的中间区：按元素模型展示 ===== */
.legend2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 18px;margin:0 0 26px;font-size:12.5px;color:hsl(var(--muted-foreground))}
.legend2 b{color:hsl(var(--foreground));font-weight:600;margin-right:2px}
.legend2 .grp{display:inline-flex;align-items:center;gap:6px}
.kind{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.k-do{background:hsl(var(--muted));color:hsl(var(--foreground))}
.k-decide{background:hsl(var(--decide-bg));color:hsl(var(--decide))}
.k-ask{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.k-flow{background:hsl(var(--primary-soft));color:hsl(var(--primary))}
.k-rule{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.if{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;font-size:11.5px;font-weight:700;background:hsl(var(--decide-bg));color:hsl(var(--decide));flex:none}
.if.user{background:hsl(var(--warning-bg));color:hsl(var(--warning))}
.flowx{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.flowx.fwd{background:hsl(var(--primary-soft));color:hsl(var(--primary));cursor:pointer}
.flowx.back{background:hsl(var(--warning-bg));color:hsl(var(--warning));cursor:pointer}
.flowx.retry{color:hsl(var(--muted-foreground));box-shadow:inset 0 0 0 1px hsl(var(--border))}
.flowx.end{background:hsl(var(--success));color:#fff}
.flowx.cont{color:hsl(var(--muted-foreground));font-weight:500;padding:0 2px}
.flowx.fwd:hover,.flowx.back:hover{filter:brightness(.97)}
.resx{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;background:hsl(var(--info-bg));color:hsl(var(--info));cursor:pointer;vertical-align:1px;white-space:nowrap}

.secx{padding:6px 0 4px}
.secx .kicker{margin:0}
.secx h2{margin:2px 0 4px;font-size:20px;font-weight:650;letter-spacing:-.01em}
.secx .kids{display:flex;flex-wrap:wrap;gap:6px}
.secx .kids span{font-size:12px;padding:2px 8px;border-radius:6px;background:hsl(var(--muted));color:hsl(var(--muted-foreground));cursor:pointer}

.cardx{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:14px;box-shadow:var(--shadow-md);scroll-margin:24px;transition:box-shadow .2s}
.cardx.hl{box-shadow:0 0 0 2px hsl(var(--ring)),var(--shadow-md)}
.cx-h{padding:18px 22px 8px}
.cx-h h3{margin:0;font-size:18px;font-weight:650}
.from{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:hsl(var(--muted-foreground))}
.from .chip{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;background:hsl(var(--muted));cursor:pointer}
.from .chip.back{background:hsl(var(--warning-bg));color:hsl(var(--warning))}

.ins2{padding:12px 22px 4px}
.ix{position:relative;padding:0 0 18px 0}
.ix + .ix{border-top:1px dashed hsl(var(--border));padding-top:16px}
.ix-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ix-l{font-size:15px;font-weight:600}
.ix-t{margin:6px 0 0;font-size:13.5px;line-height:1.75;color:hsl(var(--muted-foreground))}
body.brief .ix-t,body.brief .bx-do .full{display:none}
.chk2{list-style:none;margin:10px 0 0;padding:10px 14px;border-radius:10px;background:hsl(var(--muted) / .6);font-size:13px}
.chk2 li{display:flex;gap:8px;padding:3px 0;color:hsl(var(--muted-foreground))}
.chk2 li .ic{margin-top:3px}

.bx{margin-top:12px;border:1px solid hsl(var(--border));border-radius:12px;overflow:hidden;font-size:13px}
.bx-h,.bx-r{display:grid;grid-template-columns:minmax(170px,240px) minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 14px}
.bx-h{background:hsl(var(--muted) / .6);padding:7px 14px;font-size:11.5px;font-weight:600;color:hsl(var(--muted-foreground))}
.bx-r{border-top:1px solid hsl(var(--border))}
.bx-r.reply{background:hsl(var(--muted) / .3)}
.bx-if{display:flex;align-items:flex-start;gap:6px;font-weight:500;min-width:0;line-height:1.55}
.bx-if .ic{margin-top:3px;color:hsl(var(--muted-foreground))}
.bx-do{display:flex;flex-direction:column;gap:4px;color:hsl(var(--muted-foreground));min-width:0}
.bx-do .line{display:flex;align-items:flex-start;gap:6px;line-height:1.55}
.bx-do .line .kind{height:20px;font-size:11px;padding:0 6px}
.bx-fl{display:flex;justify-content:flex-end}

.sfoot{display:flex;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid hsl(var(--border));background:linear-gradient(90deg,hsl(var(--primary-soft)),transparent 70%);font-size:13px;font-weight:500;border-radius:0 0 14px 14px}
.rulesx{margin:0 22px 16px;padding:10px 14px;border-radius:10px;background:hsl(var(--warning-bg));font-size:13px;display:flex;gap:10px;align-items:flex-start}
.rulesx ul{margin:1px 0 0;padding-left:16px}
.rulesx li{margin:2px 0}

/* ===== 第 3 版：连贯的走向 ===== */
.content{max-width:1200px;padding:28px 40px 96px}
.startx,.endx{padding:6px 0 2px}
.startx .kicker,.endx .kicker{margin:0}
.startx h2{margin:2px 0 6px;font-size:19px;font-weight:650;line-height:1.5}
.startx p{margin:0;font-size:13.5px;line-height:1.75;color:hsl(var(--muted-foreground));max-width:860px}
.lane.start .node{background:linear-gradient(135deg,hsl(var(--primary)),hsl(var(--primary-2)))}
.endx h2{margin:2px 0 0;font-size:17px;font-weight:650}
.endx p{margin:2px 0 0;font-size:13px;color:hsl(var(--muted-foreground))}
.cardx{box-shadow:var(--shadow-sm)}
.cx-h{padding:16px 22px 4px}
.cx-h h3{font-size:17px}
/* 指令用竖线串起来 */
.ins2{position:relative;padding:10px 22px 6px 50px}
.ins2::before{content:"";position:absolute;left:31px;top:22px;bottom:22px;width:2px;border-radius:2px;background:hsl(var(--border))}
.ix{position:relative;padding:0 0 18px}
.ix + .ix{border-top:0;padding-top:0}
.ix::before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;background:hsl(var(--card));box-shadow:0 0 0 2px hsl(var(--border-strong,var(--border)))}
.ix.t-decide::before{box-shadow:0 0 0 2px hsl(var(--decide))}
.ix.t-ask::before{box-shadow:0 0 0 2px hsl(var(--warning))}
.ix.t-flow::before{background:hsl(var(--primary));box-shadow:0 0 0 2px hsl(var(--primary))}
.ix.t-rule::before{box-shadow:0 0 0 2px hsl(var(--warning))}
.ix-t{margin:4px 0 0}
.ix-p{margin:0;font-size:14px;line-height:1.8;color:hsl(var(--foreground))}
.ix-p .kind{margin-right:8px;vertical-align:1px}
/* 分支：树状连接 */
.tree{margin:10px 0 0 6px}
.tn{position:relative;padding:4px 0 4px 22px}
.tn::before{content:"";position:absolute;left:0;top:17px;width:16px;border-top:1.5px solid hsl(var(--border))}
.tn::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid hsl(var(--border))}
.tn:last-child::after{bottom:auto;height:17px}
.tn > .tree{margin-left:10px}
.tr{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr) auto;gap:14px;align-items:start;font-size:13.5px;line-height:1.6;padding:3px 0}
.tr .cond{display:flex;align-items:flex-start;gap:6px;font-weight:600}
.tr .cond .if{margin-top:1px}
.tr .acts{display:flex;flex-direction:column;gap:4px;color:hsl(var(--muted-foreground))}
.tr .acts .line{display:flex;align-items:flex-start;gap:6px}
.tr .acts .kind{height:20px;font-size:11px;padding:0 6px;margin-top:1px}
.tr .fl{display:flex;justify-content:flex-end}
.tn.reply .cond{font-weight:500}
.flowx{height:24px}
body.brief .tr .acts .txt{display:none}
.rule-row{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.rule-row ul{margin:1px 0 0;padding-left:16px} .rule-row li{margin:2px 0}
.flow-row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500}
.side{width:auto}

/* ===== 第 4 版：步骤内部按正文阅读顺序 ===== */
.node.word{font-size:12px;letter-spacing:.02em}

.fc.fwd{background:hsl(var(--primary-soft));color:hsl(var(--primary));cursor:pointer}
.fc.back{background:hsl(var(--warning-bg));color:hsl(var(--warning));cursor:pointer}
.fc.retry{box-shadow:inset 0 0 0 1px hsl(var(--border));color:hsl(var(--foreground));font-weight:500}
.fc.end{background:hsl(var(--success-bg));color:hsl(var(--success))}

.nextline{font-size:14px;line-height:1.85}
.rule-row{font-size:14px}

/* 左侧节点：横向胶囊，写成“步骤 1.1” */

.lane{grid-template-columns:92px minmax(0,1fr)}
.lane.sub{grid-template-columns:92px 20px minmax(0,1fr)}

.node,.node.word,.node.step-node{width:auto;min-width:76px;height:34px;padding:0 12px;border-radius:999px;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1;white-space:nowrap}
.node.step-node .nw{font-size:12.5px;font-weight:600;opacity:.9}
.node.step-node .nn{font-size:13.5px;font-weight:700}
.lane.sub .node,.lane.sub .node.step-node{min-width:72px;height:30px;margin:6px 0 0;padding:0 10px}
.lane.sub .tick{margin-top:21px}
.lane.end .node{min-width:76px}

.lane.end .node{background:linear-gradient(135deg,hsl(152 65% 40%),hsl(165 65% 38%));color:#fff;box-shadow:0 6px 16px -6px hsl(152 70% 35% / .5),0 0 0 5px hsl(var(--background))}

.startx p{margin:2px 0 0}
.secx h2{margin:0;font-size:19px;line-height:34px}
.endx p{margin:0;line-height:34px}

.ix.t-decide::before{background:hsl(var(--decide));box-shadow:0 0 0 3px hsl(var(--card))}
.ix.t-ask::before{background:hsl(var(--warning));box-shadow:0 0 0 3px hsl(var(--card))}
.ix.t-flow::before{background:hsl(var(--primary));box-shadow:0 0 0 3px hsl(var(--card))}
.ix.t-rule::before{background:hsl(var(--warning));box-shadow:0 0 0 3px hsl(var(--card))}
/* 指令句：标签与第一行正文居中对齐 */
.ix-p{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:14.5px;line-height:26px}
.ix-p .kind{margin:2px 0 0;height:22px;flex:none}
.nextline{margin:0;font-size:14px;line-height:26px}
/* 分支列表：1px 连接线，统一缩进 */
.bl{margin:6px 0 0;padding:0}

/* 行内标记统一高度和垂直位置 */

const RES = FLOW.resources || [];
const resIcon = p => p.startsWith('scripts') ? 'file-code' : p.startsWith('assets') ? 'package' : 'file-text';
const fmt = s => esc(s).replace(/`([^`]+)`/g, (m, p) => RES.some(r => r.path === p)
  ? `<span class="resx" data-res="${esc(p)}">${ic(resIcon(p), 'xs')}${esc(p)}</span>` : `<code>${p}</code>`);

const ALL = {}, ORDER = [];
(function index(list, depth, parent){ list.forEach(s => { s.depth = depth; s.parent = parent; ALL[s.id] = s; ORDER.push(s.id); if (s.children) index(s.children, depth + 1, s.id); }); })(FLOW.steps, 1, null);
const LEAVES = ORDER.filter(id => !ALL[id].children);
const pos = id => ORDER.indexOf(id);
const isBack = (from, to) => pos(to) <= pos(from);
function walk(nodes, fn, sid){ (nodes || []).forEach(n => { fn(n, sid); (n.branches || []).forEach(b => walk(b.then, fn, sid)); }); }
function eachNode(fn){ LEAVES.forEach(id => { walk(ALL[id].body, fn, id); if (ALL[id].next) fn(ALL[id].next, id); }); }
const pathsIn = t => (String(t || '').match(/`([^`]+)`/g) || []).map(x => x.slice(1, -1)).filter(x => /^(references|scripts|assets)\//.test(x));
const INCOMING = {};
eachNode((n, sid) => { if (n.type === 'goto' && ALL[n.to]) { const a = INCOMING[n.to] = INCOMING[n.to] || []; if (!a.some(x => x[0] === sid)) a.push([sid, isBack(sid, n.to)]); } });

/* ---- 校验（与模板一致） ---- */
function terminates(b){ return (b.then || []).some(x => FLOWS.includes(x.type) || (x.type === 'ask' && x.branches && x.branches.every(terminates))); }
function validate(){
  const iss = [];
  ORDER.forEach(id => { const s = ALL[id];
    if (s.depth > 3) iss.push(`步骤 ${id} 超过三层`);
    if (s.children && s.body) iss.push(`步骤 ${id} 同时包含指令和子步骤`);
    if (!s.body) return;
    s.body.forEach((n, i) => { if ((n.type === 'decide' || n.type === 'ask') && !(n.branches || []).length) iss.push(`步骤 ${id} 的第 ${i + 1} 条指令没有分支`); });
    if (!s.next){ const last = s.body[s.body.length - 1]; if (!last || !last.branches || !last.branches.every(terminates)) iss.push(`步骤 ${id} 没有写完成后的去向`); } });
  eachNode((n, sid) => { if (n.type === 'goto' && (!ALL[n.to] || ALL[n.to].children)) iss.push(`步骤 ${sid} 的跳转目标 ${n.to} 无效`);
    [n.text, n.when].forEach(t => pathsIn(t).forEach(p => { if (!RES.some(r => r.path === p)) iss.push(`步骤 ${sid} 引用了未登记的资源 ${p}`); })); });
  const seen = new Set(), st = [LEAVES[0]];
  while (st.length){ const id = st.pop(); if (!id || seen.has(id) || !ALL[id]) continue; seen.add(id); walk(ALL[id].body, n => { if (n.type === 'goto') st.push(n.to); }); const nx = ALL[id].next; if (nx && nx.type === 'goto') st.push(nx.to); }
  LEAVES.filter(id => !seen.has(id)).forEach(id => iss.push(`步骤 ${id} 从开始走不到`));
  const el = $('#vstat');
  el.innerHTML = iss.length ? `${ic('circle-alert', 'sm')}${iss.length} 个问题` : `${ic('circle-check', 'sm')}结构校验通过`;
  el.classList.toggle('bad', !!iss.length);
  $('#issues').innerHTML = iss.map(x => `<li>${esc(x)}</li>`).join(''); $('#issues').style.display = iss.length ? 'block' : 'none';
}

/* ---- 元素标签 ---- */
const KIND = {do:['play', '执行', 'k-do'], check:['play', '执行', 'k-do'], decide:['git-branch', '判断', 'k-decide'], ask:['message-circle', '提问', 'k-ask']};
const kindTag = t => { const [i, l, c] = KIND[t] || KIND.do; return `<span class="kind ${c}">${ic(i, 'xs')}${l}</span>`; };

/* ---- 文案与文字版用同一套逻辑生成，只多了样式 ---- */
function flowHTML(sid, f){
  if (f.type === 'goto'){ const b = isBack(sid, f.to);
    return `<span class="fc ${b ? 'back' : 'fwd'}" data-go="${esc(f.to)}">${ic(b ? 'undo-2' : 'arrow-right')}${b ? '回到' : '进入'}步骤 ${esc(f.to)}</span>${f.text ? '，' + fmt(f.text) : ''}`; }
  if (f.type === 'retry') return `<span class="fc retry">${ic('refresh-cw')}然后${fmt(f.text)}</span>`;
  return `<span class="fc end">${ic('flag')}${fmt(f.text)}</span>`;
}
function branchList(sid, branches, kind){
  return `<ul class="bl bl-${kind}">${branches.map(b => {
    const parts = []; let nested = '';
    (b.then || []).forEach(x => {
      if (x.type === 'ask' && x.branches){ parts.push(fmt(x.text)); nested = branchList(sid, x.branches, 'ask'); }
      else if (FLOWS.includes(x.type)) parts.push(flowHTML(sid, x));
      else parts.push(fmt(x.text));
    });
    return `<li><span class="kw kw-${kind}">如果</span><span class="cond">${fmt(b.when)}</span>，${parts.join('，')}${nested ? '：' + nested : '。'}</li>`;
  }).join('')}</ul>`;
}
function insHTML(s, n){
  const tail = n.branches || n.type === 'check' ? '：' : '。';
  return `<div class="ix t-${n.type === 'check' ? 'do' : n.type}"><p class="ix-p">${kindTag(n.type)}<span>${fmt(n.text)}${tail}</span></p>
    ${n.type === 'check' ? `<ul class="chk2">${n.items.map(x => `<li>${ic('square', 'sm')}<span>${fmt(x)}</span></li>`).join('')}</ul>` : ''}
    ${n.branches ? branchList(s.id, n.branches, n.type) : ''}</div>`;
}
function leafHTML(s){
  const rules = (s.rules || []).length ? `<div class="ix t-rule"><div class="rule-row"><span class="kind k-rule">${ic('shield-alert', 'xs')}约束</span><ul>${s.rules.map(r => `<li>${fmt(r)}</li>`).join('')}</ul></div></div>` : '';
  const nx = s.next ? `<div class="ix t-flow"><p class="ix-p"><span class="kind k-flow">${ic('corner-down-right', 'xs')}流程</span><span>${s.next.type === 'goto' ? '完成后' : ''}${flowHTML(s.id, s.next)}。</span></p></div>` : '';
  return `<section class="cardx" id="s-${esc(s.id)}"><div class="cx-h"><h3>${esc(s.title)}</h3></div>
    <div class="ins2">${s.body.map(n => insHTML(s, n)).join('')}${nx}${rules}</div></section>`;
}
function stepHTML(s){
  const sub = s.depth > 1;
  const node = `<div><div class="node step-node" data-go="${esc(s.id)}"><span class="nw">步骤</span><span class="nn">${esc(s.id)}</span></div></div>`;
  if (s.children) return `<div class="lane${sub ? ' sub' : ''}">${node}${sub ? '<div class="tick"></div>' : ''}<div class="secx" id="s-${esc(s.id)}"><h2>${esc(s.title)}</h2></div></div>` + s.children.map(stepHTML).join('');
  return `<div class="lane${sub ? ' sub' : ''}">${node}${sub ? '<div class="tick"></div>' : ''}${leafHTML(s)}</div>`;
}

/* ---- 页面 ---- */
function render(){
  document.title = `${FLOW.name} · 工作流`; $('#skillName').textContent = FLOW.name; $('#skillDesc').textContent = FLOW.description;
  let ends = [], backs = [];
  eachNode((n, sid) => { if (n.type === 'end') ends.push([sid, n]); if (n.type === 'goto' && ALL[n.to] && isBack(sid, n.to)) backs.push([sid, n]); });
  $('#steps').innerHTML = `<div class="lane start"><div><div class="node word">开始</div></div><div class="startx"><h2>${fmt(FLOW.description)}</h2><p>${fmt(FLOW.summary)}</p></div></div>`
    + FLOW.steps.map(stepHTML).join('')
    + `<div class="lane end"><div><div class="node word">结束</div></div><div class="endx"><p>任务在交付时结束，也可能在某一步提前结束，结束的位置见各步骤中的绿色标记。</p></div></div>`;
  const dirs = {}; RES.forEach(r => { const d = r.path.includes('/') ? r.path.split('/')[0] : ''; (dirs[d] = dirs[d] || []).push(r); });
  const fileLi = r => `<li><span class="fn" data-res="${esc(r.path)}">${ic(resIcon(r.path), 'sm')}${esc(r.path.split('/').pop())}</span></li>`;
  $('#side').innerHTML = `<div class="group"><div class="group-h">步骤</div>${ORDER.map(id => `<div class="item${ALL[id].depth > 1 ? ' l2' : ''}" data-go="${esc(id)}"><span class="k">${esc(id)}</span><span class="t">${esc(ALL[id].title)}</span></div>`).join('')}</div>
    <div class="group"><div class="group-h">文件</div><ul class="ftree"><li><span class="fn dir">${ic('folder-open', 'sm')}${esc(FLOW.name)}</span><ul>
      <li><span class="fn" data-view="text">${ic('file-text', 'sm')}SKILL.md</span></li>
      <li><span class="fn" data-view="flow">${ic('workflow', 'sm')}skill-workflow.html</span></li>
      ${(dirs[''] || []).map(fileLi).join('')}
      ${Object.keys(dirs).filter(d => d).map(d => `<li><span class="fn dir">${ic('folder', 'sm')}${esc(d)}</span><ul>${dirs[d].map(fileLi).join('')}</ul></li>`).join('')}
    </ul></li></ul></div>`;
}


/* ---- 文字版导出（与模板一致） ---- */
function flowText(sid, f){ if (f.type === 'goto') return (isBack(sid, f.to) ? `回到步骤 ${f.to}` : `进入步骤 ${f.to}`) + (f.text ? `，${f.text}` : ''); if (f.type === 'retry') return `然后${f.text}`; return f.text; }
function branchLines(sid, branches, ind){ return branches.map(b => { const parts = []; let nested = '';
  (b.then || []).forEach(x => { if (x.type === 'ask' && x.branches){ parts.push(x.text); nested = '\n' + branchLines(sid, x.branches, ind + '  '); } else if (FLOWS.includes(x.type)) parts.push(flowText(sid, x)); else parts.push(x.text); });
  return `${ind}- 如果${b.when}，${parts.join('，')}${nested ? '：' + nested : '。'}`; }).join('\n'); }
function stepText(s){ const h = '#'.repeat(s.depth + 2) + ` 步骤 ${s.id}：${s.title}`;
  if (s.children) return [h, ...s.children.map(stepText)].join('\n\n');
  const paras = s.body.map(n => n.type === 'check' ? `${n.text}：\n\n` + n.items.map(x => `- [ ] ${x}`).join('\n') : n.branches ? `${n.text}：\n\n` + branchLines(s.id, n.branches, '') : `${n.text}。`);
  if (s.next) paras.push(s.next.type === 'goto' ? `完成后${flowText(s.id, s.next)}。` : `${flowText(s.id, s.next)}。`);
  if ((s.rules || []).length) paras.push('约束：\n\n' + s.rules.map(r => `- ${r}`).join('\n'));
  return [h, ...paras].join('\n\n'); }
function skillText(){ const g = (FLOW.globalRules || []).length ? ['约束：\n\n' + FLOW.globalRules.map(r => `- ${r}`).join('\n')] : [];
  return [`---\nname: ${FLOW.name}\ndescription: ${FLOW.description}\n---`, `# ${FLOW.name}`, FLOW.summary, ...g, '## 工作流', ...FLOW.steps.map(stepText)].join('\n\n') + '\n'; }

/* ---- 交互 ---- */
function showView(v){ document.querySelectorAll('.tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.view === v)); document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v)); }
const closeSheet = () => { $('#sheet').classList.remove('on'); $('#overlay').classList.remove('on'); };
function focusStep(id){ closeSheet(); showView('flow'); const el = document.getElementById('s-' + id); if (!el) return; el.scrollIntoView({behavior:'smooth', block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  document.querySelectorAll('.item.on').forEach(n => n.classList.remove('on')); const n = document.querySelector(`.item[data-go="${CSS.escape(id)}"]`); n && n.classList.add('on'); }
/* 脚本：展示做什么、输入、输出和核心流程 */
function scriptCard(r){
  const row = (k, v) => v ? `<div class="sc-row"><div class="sc-k">${k}</div><div class="sc-v">${fmt(v)}</div></div>` : '';
  return `<div class="sc">${row('做什么', r.purpose)}${row('输入', r.input)}${row('输出', r.output)}
    ${(r.steps || []).length ? `<div class="sc-row"><div class="sc-k">核心流程</div><ol class="sc-flow">${r.steps.map(x => `<li>${fmt(x)}</li>`).join('')}</ol></div>` : ''}</div>`;
}
function openRes(p){
  const r = RES.find(x => x.path === p); if (!r) return;
  const steps = LEAVES.filter(id => { let hit = false; walk(ALL[id].body, n => { if (pathsIn(n.text).includes(p)) hit = true; }); return hit; });
  const c = RES_CONTENT[p];
  const src = c == null ? '' : `<pre class="src">${esc(c)}</pre>`;
  const body = p.startsWith('scripts/') ? scriptCard(r) + (src ? `<details class="src-d"><summary>${ic('code', 'xs')}源码</summary>${src}</details>` : '')
    : c == null ? `<p class="res-miss">没有读取到文件内容</p>`
    : p.endsWith('.md') ? `<article class="md">${typeof marked !== 'undefined' ? marked.parse(c) : src}</article>`
    : src;
  $('#sheet').innerHTML = `<div class="sheet-h"><div class="tt"><h4>${esc(r.title)}</h4><p><code>${esc(r.path)}</code></p></div><button class="btn icon ghost" data-close>${ic('x')}</button></div>
    <div class="res-used"><span class="lbl">用到它的步骤</span>${steps.map(id => `<span class="stepchip" data-go="${esc(id)}">步骤 ${esc(id)}　${esc(ALL[id].title)}${ic('arrow-up-right', 'xs')}</span>`).join('')}</div>
    <div class="sheet-b">${body}</div>`;
  icons(); $('#sheet').classList.add('on', 'wide'); $('#overlay').classList.add('on');
}
document.addEventListener('click', e => { const t = e.target;
  if (t.closest('[data-close]') || t.closest('#overlay')){ closeSheet(); return; }
  const fv = t.closest('.fn[data-view]'); if (fv){ showView(fv.dataset.view); return; }
  const r = t.closest('[data-res]'); if (r){ openRes(r.dataset.res); return; }
  const g = t.closest('[data-go]'); if (g){ focusStep(g.dataset.go); } });
document.addEventListener('mouseover', e => { document.querySelectorAll('.cardx.hl').forEach(c => c.classList.remove('hl')); const g = e.target.closest('.flowx[data-go]'); if (g){ const c = document.getElementById('s-' + g.dataset.go); c && c.classList.add('hl'); } });
document.querySelectorAll('.tabs .tab').forEach(t => t.onclick = () => showView(t.dataset.view));
const THEMES = [['', 'monitor'], ['light', 'sun'], ['dark', 'moon']];
function setTheme(t){ t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme'); $('#themeBtn').innerHTML = ic(THEMES.find(x => x[0] === t)[1]); icons(); try { localStorage.setItem('skill-flow-theme', t); } catch (e) {} }
$('#themeBtn').onclick = () => { const c = document.documentElement.getAttribute('data-theme') || ''; setTheme(THEMES[(THEMES.findIndex(x => x[0] === c) + 1) % 3][0]); };

render(); validate(); $('#wf').textContent = skillText();
let th = ''; try { th = localStorage.getItem('skill-flow-theme') || ''; } catch (e) {}
const q = new URLSearchParams(location.search).get('theme'); if (q === 'light' || q === 'dark') th = q; setTheme(th);
if (location.hash === '#text') showView('text'); const rh = location.hash.match(/^#res=(.+)/); if (rh) openRes(decodeURIComponent(rh[1]));
icons();
</script>
</body>
</html>
